          <td data-label="Retard"><strong style="color:#c5221f">+${days}j</strong></td>
        </tr>`;
      });
      html += '</tbody></table></div></div>';
    }

    $('dash-body').innerHTML = html;
  }

  // ═════════════════════════════════════════════════════════════════
  //  CHART ÉVOLUTION (SVG)
  // ═════════════════════════════════════════════════════════════════
  function buildEvolutionChart(tasks, period) {
    const buckets = splitPeriodIntoBuckets(period);
    if (!buckets.length) return '<div class="empty">Aucune donnée</div>';

    const series = buckets.map(b => {
      const inBucket = tasks.filter(t => t.dateAssigned >= b.from && t.dateAssigned <= b.to);
      const created = inBucket.length;
      const completedInBucket = tasks.filter(t =>
        t.status === 'Terminé' && t.closeDate && t.closeDate >= b.from && t.closeDate <= b.to
      ).length;
      const late = tasks.filter(t =>
        t.status !== 'Terminé' && t.dateLimit && t.dateLimit >= b.from && t.dateLimit <= b.to
      ).length;
      const lateStart = inBucket.filter(t => t.status === 'À faire' && t.dateStart && t.dateStart <= todayStr()).length;
      return { label: b.label, created, completed: completedInBucket, late, lateStart };
    });

    const maxVal = Math.max(1,
      ...series.map(s => Math.max(s.created, s.completed, s.late, s.lateStart))
    );
    const niceMax = niceCeil(maxVal);

    const W = Math.max(600, buckets.length * 90);
    const H = 240;
    const padL = 40, padR = 16, padT = 20, padB = 40;
    const innerW = W - padL - padR;
    const innerH = H - padT - padB;
    const stepX = buckets.length > 1 ? innerW / (buckets.length - 1) : innerW;

    function y(v) { return padT + innerH - (v / niceMax) * innerH; }
    function x(i) { return padL + i * stepX; }

    const colors = { created:'#1a73e8', completed:'#137333', late:'#c5221f', lateStart:'#f9ab00' };

    let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;min-height:240px;max-width:${W}px;">`;
    for (let i = 0; i <= 4; i++) {
      const yy = padT + (innerH * i / 4);
      const val = Math.round(niceMax * (1 - i / 4));
      svg += `<line x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}" stroke="#e8eaed" stroke-width="1"/>`;
      svg += `<text x="${padL - 6}" y="${yy + 4}" text-anchor="end" font-size="10" fill="#9aa0a6">${val}</text>`;
    }
    buckets.forEach((b, i) => {
      const xx = x(i);
      svg += `<text x="${xx}" y="${H - padB + 16}" text-anchor="middle" font-size="10" fill="#5f6368">${escapeHtml(b.label)}</text>`;
    });
    ['created','completed','late','lateStart'].forEach(key => {
      const pts = series.map((s,i) => x(i) + ',' + y(s[key])).join(' ');
      svg += `<polyline points="${pts}" fill="none" stroke="${colors[key]}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
      series.forEach((s,i) => {
        svg += `<circle cx="${x(i)}" cy="${y(s[key])}" r="3.5" fill="${colors[key]}" stroke="#fff" stroke-width="1.5"/>`;
        if (s[key] > 0) {
          svg += `<text x="${x(i)}" y="${y(s[key]) - 8}" text-anchor="middle" font-size="9" fill="${colors[key]}" font-weight="600">${s[key]}</text>`;
        }
      });
    });
    svg += '</svg>';

    const legend = `<div class="chart-legend">
      <span class="legend-item"><span class="legend-swatch" style="background:${colors.created}"></span>Créées</span>
      <span class="legend-item"><span class="legend-swatch" style="background:${colors.completed}"></span>Terminées</span>
      <span class="legend-item"><span class="legend-swatch" style="background:${colors.late}"></span>Échues non finies</span>
      <span class="legend-item"><span class="legend-swatch" style="background:${colors.lateStart}"></span>Démarrage tardif</span>
    </div>`;

    return legend + '<div class="evo-chart-wrap">' + svg + '</div>';
  }

  function buildEvolutionTable(tasks, period) {
    const buckets = splitPeriodIntoBuckets(period);
    if (!buckets.length) return '<div class="empty">Aucune donnée</div>';

    let html = '<div class="table-wrap" style="border:none;"><table class="evolution-table"><thead><tr>';
    html += '<th>Période</th><th>Créées</th><th>Terminées</th><th>Échues</th><th>Démarrage tardif</th><th>Taux complétion</th></tr></thead><tbody>';
    buckets.forEach(b => {
      const inBucket = tasks.filter(t => t.dateAssigned >= b.from && t.dateAssigned <= b.to);
      const created = inBucket.length;
      const completedInBucket = tasks.filter(t =>
        t.status === 'Terminé' && t.closeDate && t.closeDate >= b.from && t.closeDate <= b.to
      ).length;
      const late = tasks.filter(t =>
        t.status !== 'Terminé' && t.dateLimit && t.dateLimit >= b.from && t.dateLimit <= b.to
      ).length;
      const lateStart = inBucket.filter(t => t.status === 'À faire' && t.dateStart && t.dateStart <= todayStr()).length;
      const rate = created ? Math.round(completedInBucket * 100 / created) : 0;
      html += `<tr>
        <td>${escapeHtml(b.label)}</td>
        <td><span class="evo-cell ${created ? 'info' : 'empty'}">${created || '·'}</span></td>
        <td><span class="evo-cell ${completedInBucket ? 'ok' : 'empty'}">${completedInBucket || '·'}</span></td>
        <td><span class="evo-cell ${late ? 'danger' : 'empty'}">${late || '·'}</span></td>
        <td><span class="evo-cell ${lateStart ? 'warn' : 'empty'}">${lateStart || '·'}</span></td>
        <td><span class="evo-cell ${rate >= 70 ? 'ok' : rate >= 40 ? 'warn' : (created ? 'danger' : 'empty')}">${created ? rate + '%' : '·'}</span></td>
      </tr>`;
    });
    html += '</tbody></table></div>';
    return html;
  }

  function niceCeil(v) {
    if (v <= 5) return 5;
    if (v <= 10) return 10;
    if (v <= 20) return 20;
    if (v <= 50) return 50;
    if (v <= 100) return 100;
    const mag = Math.pow(10, Math.floor(Math.log10(v)));
    return Math.ceil(v / mag) * mag;
  }

  // ═════════════════════════════════════════════════════════════════
  //  DRAWER DÉTAIL (Pilotage)
  // ═════════════════════════════════════════════════════════════════
  let detailContext = null;

  function openDetail(filterKey) {
    const period = periodOf('dash');
    const tasks = filterTasksByPeriod(state.tasks, period);
    const today = todayStr();

    let list = tasks.slice(), title = '';
    if (filterKey === 'all')        { list = tasks;                                                          title = '📋 Toutes les tâches'; }
    if (filterKey === 'done')       { list = tasks.filter(t => t.status === 'Terminé');                     title = '✅ Tâches terminées'; }
    if (filterKey === 'in_progress'){ list = tasks.filter(t => t.status === 'En cours');                    title = '⏳ Tâches en cours'; }
    if (filterKey === 'todo')       { list = tasks.filter(t => t.status === 'À faire');                     title = '📥 Tâches à faire'; }
    if (filterKey === 'overdue')    { list = tasks.filter(t => t.status !== 'Terminé' && t.dateLimit && t.dateLimit < today); title = '⚠️ Tâches en retard'; }
    if (filterKey === 'late_start') { list = tasks.filter(t => t.status === 'À faire' && t.dateStart && t.dateStart <= today); title = '🚨 Tâches en démarrage tardif'; }

    detailContext = { tasks: list, title: title, search:'', recipient:'', dept:'' };
    showDetailDrawer();
  }

  function buildDetailTable(list) {
    if (!list.length) return '<div class="empty-state"><div class="icon">📭</div><h4>Aucune tâche</h4></div>';
    let rows = '';
    list.forEach(t => {
      const overdue = isOverdue(t);
      rows += `<tr>
        <td data-label="ID"><strong>${escapeHtml(t.id)}</strong></td>
        <td data-label="Description">${escapeHtml(t.description)}</td>
        <td data-label="Destinataire">${escapeHtml(t.recipient)}</td>
        <td data-label="Département">${escapeHtml(t.department || '—')}</td>
        <td data-label="Échéance">${overdue ? '<span class="badge badge-overdue">'+escapeHtml(t.dateLimit)+'</span>' : escapeHtml(t.dateLimit)}</td>
        <td data-label="Statut"><span class="badge badge-status-${statusKey(t.status)}">${escapeHtml(t.status)}</span></td>
      </tr>`;
    });
    return `<div class="table-wrap" style="border:none;"><table><thead><tr>
      <th>ID</th><th>Description</th><th>Destinataire</th><th>Département</th><th>Échéance</th><th>Statut</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  function filterDetailTable() {
    if (!detailContext) return;
    const c = detailContext;
    let list = c.tasks.slice();
    if (c.search) {
      const q = c.search.toLowerCase();
      list = list.filter(t =>
        (t.description||'').toLowerCase().includes(q) ||
        (t.id||'').toLowerCase().includes(q) ||
        (t.recipient||'').toLowerCase().includes(q));
    }
    if (c.recipient) list = list.filter(t => t.recipient === c.recipient);
    if (c.dept)      list = list.filter(t => t.department === c.dept);
    $('detail-table-wrap').innerHTML = buildDetailTable(list);
    $('detail-count').textContent = list.length + ' / ' + c.tasks.length;
  }

  function showDetailDrawer() {
    const c = detailContext;
    const recipientSet = Array.from(new Set(c.tasks.map(t => t.recipient).filter(Boolean))).sort();
    const deptSet      = Array.from(new Set(c.tasks.map(t => t.department).filter(Boolean))).sort();

    const html = `<div class="detail-panel" id="detail-panel">
      <div class="detail-drawer">
        <div class="detail-drawer-header">
          <h3>${escapeHtml(c.title)} <span style="background:rgba(255,255,255,.25);padding:2px 8px;border-radius:10px;font-size:12px;margin-left:8px;" id="detail-count">${c.tasks.length}</span></h3>
          <button class="detail-close" onclick="closeDetailDrawer()">×</button>
        </div>
        <div class="detail-drawer-body">
          ${c.headerHtml || ''}
          <div class="detail-toolbar">
            <input type="search" id="detail-search" placeholder="🔍 Rechercher…">
            <select id="detail-recipient">
              <option value="">Tous destinataires</option>
              ${recipientSet.map(r => `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join('')}
            </select>
            <select id="detail-dept">
              <option value="">Tous départements</option>
              ${deptSet.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('')}
            </select>
          </div>
          <div id="detail-table-wrap">${buildDetailTable(c.tasks)}</div>
        </div>
      </div>
    </div>`;
    const div = document.createElement('div');
    div.innerHTML = html;
    document.body.appendChild(div.firstChild);

    $('detail-search').oninput     = (e) => { detailContext.search    = e.target.value; filterDetailTable(); };
    $('detail-recipient').onchange = (e) => { detailContext.recipient = e.target.value; filterDetailTable(); };
    $('detail-dept').onchange      = (e) => { detailContext.dept      = e.target.value; filterDetailTable(); };

    document.getElementById('detail-panel').addEventListener('click', (e) => {
      if (e.target.id === 'detail-panel') closeDetailDrawer();
    });
  }
  function closeDetailDrawer() {
    const p = $('detail-panel');
    if (p) p.remove();
    detailContext = null;
  }

  // ═════════════════════════════════════════════════════════════════
  //  VUE PAR EMPLOYÉ (Chef)
  // ═════════════════════════════════════════════════════════════════
  async function renderPerEmployee() {
    showLoader('Chargement…');
    const ok = await loadTasks();
    if (ok && !state.personnel.length) {
      const r = await call('getPersonnel', URL_TOKEN);
      if (r.success) state.personnel = r.personnel || [];
    }
    hideLoader();
    if (!ok) return;

    let html = `<div class="page-title">👤 Vue par employé</div>
                <div class="page-sub">Performance individuelle de chaque employé</div>`;
    html += renderPeriodSelector('perEmp', 'ps-info-perEmp');
    html += '<div id="perEmp-body"></div>';
    $('main-content').innerHTML = html;

    wirePeriodSelector('perEmp', renderPerEmpTable);
    renderPerEmpTable();
  }

  function renderPerEmpTable() {
    const period = periodOf('perEmp');
    const tasks = filterTasksByPeriod(state.tasks, period);
    const { from, to } = getPeriodBounds(period);
    const today = todayStr();

    const infoEl = $('ps-info-perEmp');
    if (infoEl) {
      if (!from && !to) infoEl.textContent = `${tasks.length} tâche${tasks.length>1?'s':''} au total`;
      else infoEl.textContent = `${tasks.length} tâche${tasks.length>1?'s':''} · du ${from} au ${to}`;
    }

    const employees = state.personnel.filter(p =>
      (p.status||'').toLowerCase() !== 'inactif'
    );

    const stats = {};
    employees.forEach(p => {
      stats[p.name] = {
        name: p.name, dept: p.dept, role: p.role, roleNorm: p.roleNorm,
        total: 0, done: 0, inProgress: 0, todo: 0, late: 0, lateStart: 0,
        avgDays: 0, completedDays: 0, completedCount: 0
      };
    });
    tasks.forEach(t => {
      const s = stats[t.recipient];
      if (!s) return;
      s.total++;
      if (t.status === 'Terminé') {
        s.done++;
        if (t.closeDate && t.dateAssigned) {
          s.completedDays += Math.max(0, daysBetween(t.dateAssigned, t.closeDate));
          s.completedCount++;
        }
      } else if (t.status === 'En cours') s.inProgress++;
      else s.todo++;
      if (t.status !== 'Terminé' && t.dateLimit && t.dateLimit < today) s.late++;
      if (t.status === 'À faire' && t.dateStart && t.dateStart <= today) s.lateStart++;
    });

    const arr = Object.values(stats)
      .filter(s => s.total > 0)
      .map(s => {
        s.completionRate = s.total ? Math.round(s.done * 100 / s.total) : 0;
        s.avgDays = s.completedCount ? Math.round(s.completedDays / s.completedCount) : 0;
        return s;
      })
      .sort((a,b) => b.total - a.total);

    if (!arr.length) {
      $('perEmp-body').innerHTML = '<div class="empty-state"><div class="icon">📭</div><h4>Aucune donnée</h4></div>';
      return;
    }

    let html = `<div class="dash-section">
      <h3>📊 Performance par employé <span class="count">${arr.length}</span></h3>
      <div class="table-wrap" style="border:none;"><table>
        <thead><tr>
          <th>Employé</th><th>Département</th><th>Total</th>
          <th>Terminées</th><th>En cours</th><th>À faire</th>
          <th>En retard</th><th>Démarrage tardif</th><th>Délai moyen</th>
          <th>Taux</th>
        </tr></thead><tbody>`;
    arr.forEach(s => {
      const rateMod = s.completionRate >= 70 ? 'ok' : (s.completionRate >= 40 ? 'warn' : 'danger');
      html += `<tr style="cursor:pointer;" class="emp-row-clickable" data-emp-name="${escapeHtml(s.name)}">
        <td data-label="Employé"><strong>${escapeHtml(s.name)}</strong></td>
        <td data-label="Département">${escapeHtml(s.dept || '—')}</td>
        <td data-label="Total"><strong>${s.total}</strong></td>
        <td data-label="Terminées"><span class="evo-cell ok">${s.done}</span></td>
        <td data-label="En cours"><span class="evo-cell info">${s.inProgress}</span></td>
        <td data-label="À faire">${s.todo}</td>
        <td data-label="En retard">${s.late > 0 ? '<span class="badge badge-overdue">'+s.late+'</span>' : '—'}</td>
        <td data-label="Démarrage tardif">${s.lateStart > 0 ? '<span class="evo-cell warn">'+s.lateStart+'</span>' : '—'}</td>
        <td data-label="Délai moyen">${s.avgDays ? s.avgDays + 'j' : '—'}</td>
        <td data-label="Taux"><span class="evo-cell ${rateMod}">${s.completionRate}%</span></td>
      </tr>`;
    });
    html += '</tbody></table></div></div>';
    $('perEmp-body').innerHTML = html;

    // ✨ v6.2 : câbler le clic sur chaque ligne employé
    $('perEmp-body').querySelectorAll('.emp-row-clickable').forEach(row => {
      row.addEventListener('click', () => {
        const name = row.getAttribute('data-emp-name');
        if (name) openEmpDetail(name);
      });
    });
  }

  // ✨ KPIs d'un lot de tâches (réutilisé par les 3 blocs du détail employé)
  function computeEmpKpis(list, today) {
    const done       = list.filter(t => t.status === 'Terminé').length;
    const inProgress = list.filter(t => t.status === 'En cours').length;
    const todo       = list.filter(t => t.status === 'À faire').length;
    const late       = list.filter(t => t.status !== 'Terminé' && t.dateLimit && t.dateLimit < today).length;
    const lateStart  = list.filter(t => t.status === 'À faire' && t.dateStart && t.dateStart <= today).length;
    const rate       = list.length ? Math.round(done * 100 / list.length) : 0;
    const completed  = list.filter(t => t.status === 'Terminé' && t.closeDate && t.dateAssigned);
    const avgDays    = completed.length
      ? Math.round(completed.reduce((s,t) => s + Math.max(0, daysBetween(t.dateAssigned, t.closeDate)), 0) / completed.length)
      : 0;
    return { total: list.length, done, inProgress, todo, late, lateStart, rate, avgDays };
  }

  // ✨ Un bloc de cartes KPI cliquables pour un « scope » (received / assignedOthers / assignedSelf)
  function empKpiBlock(scope, title, k) {
    const card = (key, cls, label, val, sub) =>
      `<div class="kpi-card ${cls}" onclick="filterEmpDetail('${scope}','${key}')" title="Voir ces tâches">
         <div class="kpi-label">${label}</div><div class="kpi-value">${val}</div>
         ${sub ? `<div class="kpi-sub">${sub}</div>` : ''}<div class="kpi-hint">Cliquer</div></div>`;
    return `<div style="font-size:13px;font-weight:600;color:#5f6368;margin:14px 0 8px;">${title} <span class="count">${k.total}</span></div>
      <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;">
        ${card('all','','Total',k.total,'')}
        ${card('done','ok','Terminées',k.done,k.total?k.rate+'%':'')}
        ${card('inprogress','info','En cours',k.inProgress,'')}
        ${card('todo','','À faire',k.todo,'')}
        ${card('late',k.late>0?'danger':'ok','En retard',k.late,'')}
        ${card('latestart',k.lateStart>0?'warn':'ok','Dém. tardif',k.lateStart,'')}
        <div class="kpi-card kpi-static"><div class="kpi-label">Délai moyen</div><div class="kpi-value">${k.avgDays?k.avgDays+'j':'—'}</div></div>
      </div>`;
  }

  // ✨ Détail d'un employé : 3 groupes distincts de tâches, chacun avec ses KPIs.
  //   📥 reçues (des autres) · 📤 assignées aux autres · 🔁 auto-assignées
  function openEmpDetail(empName, periodKey) {
    const period = periodOf(periodKey || 'perEmp');
    const all    = filterTasksByPeriod(state.tasks, period);
    const today  = todayStr();

    const received       = all.filter(t => t.recipient === empName && t.assignedByName !== empName);
    const assignedOthers = all.filter(t => t.assignedByName === empName && t.recipient !== empName);
    const assignedSelf   = all.filter(t => t.assignedByName === empName && t.recipient === empName);

    window._empScopes = { received, assignedOthers, assignedSelf };
    window._empDetailName = empName;

    const miniDash = `
      <div style="margin-bottom:6px;">
        <div style="font-size:13px;font-weight:700;color:#202124;margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px;">
          Récapitulatif — ${escapeHtml(empName)}
        </div>
        ${empKpiBlock('received', '📥 Tâches reçues (des autres)', computeEmpKpis(received, today))}
        ${empKpiBlock('assignedOthers', '📤 Tâches qu\'il a assignées aux autres', computeEmpKpis(assignedOthers, today))}
        ${empKpiBlock('assignedSelf', '🔁 Tâches qu\'il s\'est assignées', computeEmpKpis(assignedSelf, today))}
        <div id="emp-detail-filter-label" style="font-size:12px;color:#1a73e8;font-weight:500;margin:12px 0 4px;"></div>
      </div>
      <hr style="border:none;border-top:1px solid #dadce0;margin-bottom:14px;">
    `;

    detailContext = {
      tasks: received,
      title: '👤 ' + empName,
      search: '', recipient: '', dept: '',
      headerHtml: miniDash
    };
    showDetailDrawer();

    window._empScope = 'received';
    window._empFilterKey = 'all';
    renderEmpDetailTable('received', 'all');
  }

  // ✨ v7.0 : réaffiche la fiche employé/directeur si elle est ouverte, après une
  // action menée depuis sa liste (renvoi, appréciation). Sans effet sinon :
  // renderEmpDetailTable sort immédiatement quand la table n'est pas dans le DOM.
  function refreshEmpDetailIfOpen() {
    if (!window._empScope) return;
    renderEmpDetailTable(window._empScope, window._empFilterKey || 'all');
  }

  // Filtre = (scope, statut). Réaffiche la table du détail employé.
  function filterEmpDetail(scope, key) {
    window._empScope = scope;
    window._empFilterKey = key;
    renderEmpDetailTable(scope, key);
  }

  function renderEmpDetailTable(scope, key) {
    const scopes = window._empScopes || {};
    const tasks  = scopes[scope] || [];
    const today  = todayStr();
    const scopeLabels = {
      received: '📥 Reçues (des autres)',
      assignedOthers: '📤 Assignées aux autres',
      assignedSelf: '🔁 Auto-assignées'
    };
    const statusLabels = {
      all: 'toutes', done: '✅ terminées', inprogress: '⏳ en cours',
      todo: '📥 à faire', late: '⚠️ en retard', latestart: '🚨 démarrage tardif'
    };

    let list = tasks.slice();
    if (key === 'done')       list = tasks.filter(t => t.status === 'Terminé');
    if (key === 'inprogress') list = tasks.filter(t => t.status === 'En cours');
    if (key === 'todo')       list = tasks.filter(t => t.status === 'À faire');
    if (key === 'late')       list = tasks.filter(t => t.status !== 'Terminé' && t.dateLimit && t.dateLimit < today);
    if (key === 'latestart')  list = tasks.filter(t => t.status === 'À faire' && t.dateStart && t.dateStart <= today);
    list.sort((a, b) => (b.dateAssigned || '').localeCompare(a.dateAssigned || ''));

    const labelEl = $('emp-detail-filter-label');
    if (labelEl) labelEl.textContent = (scopeLabels[scope] || '') + ' · ' + (statusLabels[key] || '');

    const tableWrap = $('detail-table-wrap');
    if (!tableWrap) return;
    if (!list.length) {
      tableWrap.innerHTML = '<div class="empty-state"><div class="icon">📭</div><h4>Aucune tâche</h4></div>';
      const dc0 = $('detail-count'); if (dc0) dc0.textContent = '0 / ' + tasks.length;
      return;
    }
    const dc = $('detail-count'); if (dc) dc.textContent = list.length + ' / ' + tasks.length;

    // Colonne « tiers » : pour les reçues on montre l'assigneur ; pour les
    // assignées, le destinataire.
    const otherHead = scope === 'received' ? 'Assigné par' : 'Destinataire';
    let rows = '';
    list.forEach(t => {
      const overdue = isOverdue(t);
      let closureInfo = '';
      if (t.status === 'Terminé' && t.closeDate) {
        const early = t.dateLimit && t.closeDate <= t.dateLimit;
        const color = early ? '#137333' : '#c5221f';
        const icon  = early ? '✅' : '⚠️';
        closureInfo = `<div style="font-size:11px;color:${color};margin-top:2px;">${icon} Terminé le ${escapeHtml(t.closeDate)}</div>`;
      }
      const other = scope === 'received' ? (t.assignedByName || '—') : (t.recipient || '—');
      // ✨ v7.0 : agir sans quitter la fiche de la personne. Mêmes règles que le
      // détail complet (openTaskDetail) : l'appréciation et le renvoi pour
      // correction appartiennent au Chef ou à l'assigneur de CETTE tâche, et le
      // renvoi n'a de sens que sur une tâche déclarée terminée. La messagerie
      // reste ouverte à quiconque voit la tâche.
      const canAppreciate = state.user.role === 'chef' || t.assignedByName === state.user.name;
      const canReturn     = canAppreciate && t.status === 'Terminé';
      const msgCount      = Number(t.messagesCount || 0);
      rows += `<tr style="cursor:pointer;" onclick="closeTdc&&closeTdc();closeDetailDrawer&&closeDetailDrawer();setTimeout(()=>openTaskDetail('${escapeHtml(t.id)}'),100)">
        <td data-label="ID"><strong>${escapeHtml(t.id)}</strong></td>
        <td data-label="Description">${escapeHtml(t.description)}${closureInfo}</td>
        <td data-label="${otherHead}">${escapeHtml(other)}</td>
        <td data-label="Échéance">${overdue ? '<span class="badge badge-overdue">'+escapeHtml(t.dateLimit)+'⚠</span>' : escapeHtml(t.dateLimit || '—')}</td>
        <td data-label="Clôture">${t.closeDate ? escapeHtml(t.closeDate) : '<span style="color:#bdc1c6">—</span>'}</td>
        <td data-label="Statut"><span class="badge badge-status-${statusKey(t.status)}">${escapeHtml(t.status)}</span></td>
        <td data-label="Avancement">${Number(t.progress||0)}%</td>
        <td data-label="Actions" class="actions" onclick="event.stopPropagation()">
          <button class="btn btn-icon" onclick="openChatModal('${escapeHtml(t.id)}')"
                  title="${msgCount ? msgCount + ' commentaire(s)' : 'Commenter cette tâche'}">💬${msgCount ? '<span style="font-size:10px;font-weight:700;">' + msgCount + '</span>' : ''}</button>
          ${canAppreciate ? `<button class="btn btn-icon" onclick="openChefCommentModal('${escapeHtml(t.id)}')" title="Laisser une appréciation">⭐</button>` : ''}
          ${canReturn ? `<button class="btn btn-icon" style="color:#b06000;" onclick="openRejectTaskModal('${escapeHtml(t.id)}')" title="Renvoyer pour correction — la tâche repasse « En cours »">🔄</button>` : ''}
        </td>
      </tr>`;
    });
    tableWrap.innerHTML = `<div class="table-wrap" style="border:none;"><table>
      <thead><tr>
        <th>ID</th><th>Description</th><th>${otherHead}</th>
        <th>Échéance</th><th>Clôture réelle</th><th>Statut</th><th>%</th><th>Actions</th>
      </tr></thead><tbody>${rows}</tbody></table></div>`;
  }


  // ═════════════════════════════════════════════════════════════════
  //  ✨ v5.3 : VUE PAR DIRECTEUR (Chef / RH = tous ; Dir = lui-même)
  // ═════════════════════════════════════════════════════════════════
  async function renderPerDirector() {
    showLoader('Chargement…');
    const ok = await loadTasks();
    if (ok && !state.personnel.length) {
      const r = await call('getPersonnel', URL_TOKEN);
      if (r.success) state.personnel = r.personnel || [];
    }
    hideLoader();
    if (!ok) return;

    const role = state.user.role;
    // ✨ v6.8 : vue réservée aux directeurs + RH ; les chefs de département sont exclus.
    //   - dir : voit uniquement sa propre fiche
    const isSelfOnly = role === 'dir';
    const title = isSelfOnly
      ? '🎯 Ma performance de directeur'
      : '🎯 Vue par directeur';
    const subtitle = isSelfOnly
      ? 'Indicateurs sur les tâches que vous gérez et qui vous sont assignées'
      : 'Capacité de chaque directeur (et de la responsable RH) à assigner et suivre les tâches';

    let html = `<div class="page-title">${title}</div>
                <div class="page-sub">${escapeHtml(subtitle)}</div>`;
    html += renderPeriodSelector('perDir', 'ps-info-perDir');
    html += '<div id="perDir-body"></div>';
    $('main-content').innerHTML = html;

    wirePeriodSelector('perDir', renderPerDirectorBody);
    renderPerDirectorBody();
  }

  function renderPerDirectorBody() {
    const period = periodOf('perDir');
    const tasks = filterTasksByPeriod(state.tasks, period);
    const { from, to } = getPeriodBounds(period);
    const today = todayStr();
    const role = state.user.role;
    const me = state.user.name;

    const infoEl = $('ps-info-perDir');
    if (infoEl) {
      if (!from && !to) infoEl.textContent = `${tasks.length} tâche${tasks.length>1?'s':''} au total`;
      else infoEl.textContent = `${tasks.length} tâche${tasks.length>1?'s':''} · du ${from} au ${to}`;
    }

    // ✨ v6.8 : Liste des "managers" = directeurs simples + Responsable RH (les chefs de
    // département sont volontairement exclus de cette vue).
    //   - chef / rh : voient tous les directeurs + la RH
    //   - dir       : voit uniquement sa propre fiche
    let directors = state.personnel.filter(p =>
      (p.status||'').toLowerCase() !== 'inactif' &&
      (p.roleNorm === 'dir' || p.roleNorm === 'rh')
    );
    if (role === 'dir') {
      directors = directors.filter(p => p.name === me);
    }

    if (!directors.length) {
      $('perDir-body').innerHTML = '<div class="empty-state"><div class="icon">👔</div><h4>Aucun directeur trouvé</h4></div>';
      return;
    }

    // Calculer les stats pour chaque directeur
    const dirStats = directors.map(dir => {
      // Tâches assignées PAR ce directeur
      const assigned = tasks.filter(t => t.assignedByName === dir.name);
      // Tâches reçues PAR ce directeur (sa propre charge)
      const received = tasks.filter(t => t.recipient === dir.name);
      // ✨ Détail demandé : reçues des autres / assignées aux autres / auto-assignées
      const receivedFromOthers = tasks.filter(t => t.recipient === dir.name && t.assignedByName !== dir.name).length;
      const assignedToOthers   = tasks.filter(t => t.assignedByName === dir.name && t.recipient !== dir.name).length;
      const selfAssigned       = tasks.filter(t => t.assignedByName === dir.name && t.recipient === dir.name).length;

      const assignedDone = assigned.filter(t => t.status === 'Terminé').length;
      const assignedLate = assigned.filter(t =>
        t.status !== 'Terminé' && t.dateLimit && t.dateLimit < today).length;
      const assignedLateStart = assigned.filter(t =>
        t.status === 'À faire' && t.dateStart && t.dateStart <= today).length;
      const completionRate = assigned.length
        ? Math.round(assignedDone * 100 / assigned.length) : 0;

      const receivedDone = received.filter(t => t.status === 'Terminé').length;
      const receivedLate = received.filter(t =>
        t.status !== 'Terminé' && t.dateLimit && t.dateLimit < today).length;

      // Taille de l'équipe (employés du même département)
      const teamSize = state.personnel.filter(p =>
        (p.status||'').toLowerCase() !== 'inactif' &&
        p.roleNorm === 'emp' &&
        p.dept && dir.dept &&
        p.dept.toLowerCase() === dir.dept.toLowerCase()
      ).length;

      // Score de performance composite (sur 100)
      // - Taux complétion : 50% du score
      // - Pénalité retard : -2 points par tâche en retard (assignée) jusqu'à -30
      // - Pénalité démarrage tardif : -1 point par tâche jusqu'à -20
      let score = completionRate * 0.5 + 50;
      score -= Math.min(30, assignedLate * 2);
      score -= Math.min(20, assignedLateStart * 1);
      score = Math.max(0, Math.min(100, Math.round(score)));
      // Si aucune tâche assignée, le score est neutre (50)
      if (assigned.length === 0) score = 50;

      return {
        dir: dir,
        assigned: assigned,
        assignedTotal: assigned.length,
        assignedDone: assignedDone,
        assignedLate: assignedLate,
        assignedLateStart: assignedLateStart,
        completionRate: completionRate,
        received: received,
        receivedTotal: received.length,
        receivedDone: receivedDone,
        receivedLate: receivedLate,
        receivedFromOthers: receivedFromOthers,
        assignedToOthers: assignedToOthers,
        selfAssigned: selfAssigned,
        teamSize: teamSize,
        score: score
      };
    }).sort((a,b) => b.score - a.score);

    // Vue d'ensemble si plusieurs directeurs
    let html = '';
    if (dirStats.length > 1) {
      const totalAssigned = dirStats.reduce((s,d) => s + d.assignedTotal, 0);
      const totalDone = dirStats.reduce((s,d) => s + d.assignedDone, 0);
      const totalLate = dirStats.reduce((s,d) => s + d.assignedLate, 0);
      const avgScore = Math.round(dirStats.reduce((s,d) => s + d.score, 0) / dirStats.length);
      const avgScoreMod = avgScore >= 75 ? 'ok' : (avgScore >= 55 ? 'warn' : 'danger');

      html += '<div class="kpi-grid">';
      // ✨ v6.3 : cartes récap cliquables (ouvrent le détail des tâches assignées
      // par l'ensemble des directeurs, filtré). Les agrégats non « liste de
      // tâches » (effectif, score) restent statiques pour ne pas afficher de
      // faux signal cliquable.
      html += kpiCardSimple('Directeurs actifs', dirStats.length, '', 'info');
      html += kpiCard('Tâches assignées (total)', totalAssigned, '', '', 'assigned', 'Cliquer pour détail', 'openPerDirSummaryDetail');
      html += kpiCard('Terminées',  totalDone, totalAssigned ? Math.round(totalDone*100/totalAssigned) + '%' : '—',
                      totalAssigned && (totalDone*100/totalAssigned) >= 70 ? 'ok' : '', 'done', 'Cliquer pour détail', 'openPerDirSummaryDetail');
      html += kpiCard('En retard',   totalLate, '', totalLate > 0 ? 'danger' : '', 'late', 'Cliquer pour détail', 'openPerDirSummaryDetail');
      html += kpiCardSimple('Score moyen', avgScore + '/100', '', avgScoreMod);
      html += '</div>';
    }

    // Une carte par directeur
    html += '<div class="dash-section">';
    html += `<h3>📊 Détail par directeur <span class="count">${dirStats.length}</span></h3>`;
    dirStats.forEach(s => {
      let scoreClass = 'poor';
      if (s.score >= 80) scoreClass = 'excellent';
      else if (s.score >= 65) scoreClass = 'good';
      else if (s.score >= 50) scoreClass = 'average';

      const lateMod    = s.assignedLate > 0      ? 'danger' : '';
      const lateSMod   = s.assignedLateStart > 0 ? 'warn'   : '';
      const completionMod = s.completionRate >= 70 ? 'ok' : (s.completionRate >= 40 ? 'warn' : 'danger');

      html += `<div class="dir-card" data-dir-name="${escapeHtml(s.dir.name)}">
        <div class="dir-card-header">
          <div class="dir-avatar">${initials(s.dir.name)}</div>
          <div class="dir-card-info">
            <div class="nm">${escapeHtml(s.dir.name)}
              <span class="badge badge-role-${s.dir.roleNorm}" style="margin-left:6px;font-size:10px;">${escapeHtml(s.dir.roleNorm === 'rh' ? 'DA-RH' : 'Directeur')}</span>
              <span class="perf-score ${scoreClass}">${s.score}/100</span>
            </div>
            <div class="dpt">${escapeHtml(s.dir.dept || '—')}${s.dir.position ? ' • ' + escapeHtml(s.dir.position) : ''}</div>
          </div>
        </div>
        <div class="dir-stats">
          <div class="dir-stat info">
            <div class="lbl">📥 Reçues (des autres)</div>
            <div class="val">${s.receivedFromOthers}</div>
          </div>
          <div class="dir-stat info">
            <div class="lbl">📤 Assignées (aux autres)</div>
            <div class="val">${s.assignedToOthers}</div>
          </div>
          <div class="dir-stat info">
            <div class="lbl">🔁 Auto-assignées</div>
            <div class="val">${s.selfAssigned}</div>
          </div>
          <div class="dir-stat ${completionMod === 'ok' ? 'ok' : completionMod === 'warn' ? 'warn' : completionMod === 'danger' ? 'danger' : ''}">
            <div class="lbl">Taux complétion</div>
            <div class="val">${s.completionRate}%</div>
          </div>
          <div class="dir-stat ${lateMod}">
            <div class="lbl">En retard (générées)</div>
            <div class="val">${s.assignedLate}</div>
          </div>
          <div class="dir-stat ${lateSMod}">
            <div class="lbl">Démarrage tardif</div>
            <div class="val">${s.assignedLateStart}</div>
          </div>
          <div class="dir-stat">
            <div class="lbl">Équipe (employés)</div>
            <div class="val">${s.teamSize}</div>
          </div>
        </div>
        <div style="margin-top:10px;font-size:11px;color:#5f6368;text-align:right;font-style:italic;">
          Cliquer pour voir les tâches assignées par ce directeur →
        </div>
      </div>`;
    });
    html += '</div>';

    // Explication du score (en bas)
    html += `<div class="dash-section" style="background:#f8f9fa;border:1px dashed #dadce0;">
      <h3 style="font-size:13px;color:#5f6368;">ℹ️ Comment se calcule le score ?</h3>
      <div style="font-size:12px;color:#5f6368;line-height:1.6;">
        Le score (sur 100) est calculé sur les <strong>tâches que le directeur a assignées</strong> :<br>
        • Base : 50 points + (taux de complétion × 0,5)<br>
        • – 2 points par tâche en retard (max -30)<br>
        • – 1 point par tâche en démarrage tardif (max -20)<br>
        <span style="color:#137333;font-weight:600;">≥ 80 = Excellent</span> ·
        <span style="color:#1967d2;font-weight:600;">65-79 = Bon</span> ·
        <span style="color:#b06000;font-weight:600;">50-64 = Moyen</span> ·
        <span style="color:#c5221f;font-weight:600;">&lt; 50 = À améliorer</span>
      </div>
    </div>`;

    $('perDir-body').innerHTML = html;

    // ✨ v5.3 : wiring du clic sur les cartes directeur (délégation d'événement,
    // plus robuste que onclick=… qui casse avec les apostrophes / caractères spéciaux)
    $('perDir-body').querySelectorAll('.dir-card').forEach(card => {
      card.addEventListener('click', () => {
        const name = card.getAttribute('data-dir-name');
        if (name) openDirDetail(name);
      });
    });
  }

  // ✨ Détail directeur = même vue à 3 groupes (reçues / assignées aux autres /
  // auto-assignées) que « Par employé », sur la période de l'onglet « Par directeur ».
  function openDirDetail(dirName) {
    openEmpDetail(dirName, 'perDir');
  }

  // ✨ v6.3 : détail des cartes récap du haut de l'onglet « Par directeur ».
  // Agrège les tâches assignées par TOUS les directeurs visibles, puis filtre
  // selon la carte cliquée (toutes / terminées / en retard).
  function openPerDirSummaryDetail(filterKey) {
    const period = periodOf('perDir');
    const tasks  = filterTasksByPeriod(state.tasks, period);
    const today  = todayStr();
    const role   = state.user.role;
    const me     = state.user.name;

    let directors = state.personnel.filter(p =>
      (p.status||'').toLowerCase() !== 'inactif' &&
      (p.roleNorm === 'dir' || p.roleNorm === 'rh')
    );
    if (role === 'dir') {
      directors = directors.filter(p => p.name === me);
    }
    const dirNames = new Set(directors.map(d => d.name));

    let list = tasks.filter(t => dirNames.has(t.assignedByName));
    let title = '📤 Toutes les tâches assignées par les directeurs';
    if (filterKey === 'done') {
      list = list.filter(t => t.status === 'Terminé');
      title = '✅ Tâches terminées (assignées par les directeurs)';
    } else if (filterKey === 'late') {
      list = list.filter(t => t.status !== 'Terminé' && t.dateLimit && t.dateLimit < today);
      title = '⚠️ Tâches en retard (assignées par les directeurs)';
    }

    detailContext = { tasks: list, title: title, search:'', recipient:'', dept:'' };
    showDetailDrawer();
  }

  // ═════════════════════════════════════════════════════════════════
  //  ✨ v7.1 : ÉVALUATION PAR NIVEAU HIÉRARCHIQUE
  //
  //  Six strates d'attribution. Le niveau n'est pas un rôle applicatif
  //  (ROLE_CONFIG dit qui voit quoi) mais une place dans l'organigramme : on
  //  compare les Directeurs entre eux, les Responsables de pôle entre eux, etc.
  //  — sinon un stagiaire à 3 tâches paraît toujours moins « performant » qu'un
  //  directeur à 40, ce qui ne veut rien dire.
  // ═════════════════════════════════════════════════════════════════
  const HIERARCHY_LEVELS = [
    { n: 1, code: 'PAU', label: 'PAU',                 full: 'Personne autorisée',
      desc: 'Sommet du circuit de décision et d’autorisation.',
      color: '#5b2c8d', grad: 'linear-gradient(135deg,#7b3fbf,#4a2477)' },
    { n: 2, code: 'GE',  label: 'GE',                  full: 'Gérance exécutive',
      desc: 'Direction exécutive de l’entreprise.',
      color: '#1557b0', grad: 'linear-gradient(135deg,#1a73e8,#104386)' },
    { n: 3, code: 'DIR', label: 'Directeurs',          full: 'Les directeurs',
      desc: 'Directions métier (dont DF et DA-RH).',
      color: '#0a8043', grad: 'linear-gradient(135deg,#12a154,#0a6b39)' },
    { n: 4, code: 'RP',  label: 'Resp. pôles',         full: 'Les responsables de pôle',
      desc: 'Encadrement intermédiaire : pôles, départements, chantiers.',
      color: '#b06000', grad: 'linear-gradient(135deg,#f9ab00,#a06400)' },
    { n: 5, code: 'AUT', label: 'Autres',              full: 'Les autres',
      desc: 'Agents et collaborateurs sans fonction d’encadrement.',
      color: '#3c4043', grad: 'linear-gradient(135deg,#5f6368,#33373b)' },
    { n: 6, code: 'STA', label: 'Stagiaires',          full: 'Les stagiaires',
      desc: 'Personnes en stage, quelle que soit la direction d’accueil.',
      color: '#8430ce', grad: 'linear-gradient(135deg,#a457e8,#6b23ab)' }
  ];
  function levelDef(n) {
    return HIERARCHY_LEVELS[Math.max(1, Math.min(6, Number(n) || 5)) - 1];
  }

  // Déduction automatique du niveau à partir de (role_raw, position). L'ORDRE des
  // tests est la règle métier : on descend du plus spécifique au plus général.
  //   • « stagiaire » l'emporte sur tout — c'est le cas réel d'un compte déclaré
  //     « Chef Administrateur » dont la fonction est « Stagiaire RH ANPE » ;
  //   • la gérance exécutive est testée avant les directions, parce qu'une
  //     « Gérante Exécutive » est enregistrée avec le rôle applicatif Directeur ;
  //   • « gérant exécutif » exige bien le mot exécutif, sinon « Gérant ferme »
  //     (un chef de département) remonterait au niveau 2.
  // Les intitulés du terrain restent irréguliers : le Chef et la DA-RH peuvent
  // corriger un niveau à la main (personnel.hierarchy_level), et cette correction
  // gagne toujours — cf. personLevel().
  function autoHierarchyLevel(p) {
    const role = String((p && (p.role || p.roleRaw)) || '').toLowerCase().trim();
    const pos  = String((p && p.position) || '').toLowerCase().trim();
    const both = role + ' ' + pos;
    const norm = (p && p.roleNorm) || '';
    if (/stagiaire|\bstage\b/.test(both)) return 6;
    if (role === 'pau' || pos === 'pau' || /personne autoris/.test(both)) return 1;
    if (role === 'ge' || pos === 'ge'
        || /g[ée]ran[tc][a-z]*\s+ex[ée]cuti/.test(both)
        || /g[ée]rance\s+ex[ée]cutive/.test(both)) return 2;
    if (norm === 'dir' || /directeur|directrice|\bdf\b|\bda-?rh\b|\bdg\b|\bpdg\b/.test(both)) return 3;
    if (norm === 'dept_head' || norm === 'chef' || norm === 'rh'
        || /responsable|\bchef\b|superviseur|coordonnateur|coordinateur|g[ée]rant/.test(both)) return 4;
    return 5;
  }
  // Niveau effectif : correction manuelle si elle existe, sinon déduction.
  function personLevel(p) {
    const fixed = p && p.hierarchyLevel;
    if (fixed >= 1 && fixed <= 6) return Number(fixed);
    return autoHierarchyLevel(p);
  }
  function activePersonnel() {
    return state.personnel.filter(p => String(p.status || '').toLowerCase() !== 'inactif');
  }

  // ── Fenêtres calendaires comparables ─────────────────────────────
  //  Volontairement CALENDAIRES (et non glissantes comme getPeriodBounds) :
  //  « cette semaine vs la semaine passée » n'a de sens que si les deux fenêtres
  //  se découpent sur la même grille. offset = 0 → période en cours, −1 → la
  //  précédente, etc. Les débordements de mois sont gérés par Date lui-même
  //  (new Date(2026, -1, 1) = décembre 2025).
  const PERIOD_UNITS = {
    week:     { label: 'Semaine',   prev: 'Semaine précédente' },
    month:    { label: 'Mois',      prev: 'Mois précédent' },
    quarter:  { label: 'Trimestre', prev: 'Trimestre précédent' },
    semester: { label: 'Semestre',  prev: 'Semestre précédent' },
    year:     { label: 'Année',     prev: 'Année précédente' }
  };
  function periodWindow(unit, offset) {
    const now = new Date(); now.setHours(0, 0, 0, 0);
    offset = offset || 0;
    let from, to, label, longLabel;
    if (unit === 'month') {
      from = new Date(now.getFullYear(), now.getMonth() + offset, 1);
      to   = new Date(from.getFullYear(), from.getMonth() + 1, 0);
      label = from.toLocaleString('fr-FR', { month: 'short', year: '2-digit' });
      longLabel = from.toLocaleString('fr-FR', { month: 'long', year: 'numeric' });
    } else if (unit === 'quarter') {
      const q = Math.floor(now.getMonth() / 3) + offset;
      from = new Date(now.getFullYear(), q * 3, 1);
      to   = new Date(from.getFullYear(), from.getMonth() + 3, 0);
      label = 'T' + (from.getMonth() / 3 + 1) + ' ' + String(from.getFullYear()).slice(2);
      longLabel = 'trimestre ' + (from.getMonth() / 3 + 1) + ' ' + from.getFullYear();
    } else if (unit === 'semester') {
      const s = Math.floor(now.getMonth() / 6) + offset;
      from = new Date(now.getFullYear(), s * 6, 1);
      to   = new Date(from.getFullYear(), from.getMonth() + 6, 0);
      const num = from.getMonth() / 6 + 1;
      label = (num === 1 ? '1er' : '2d') + ' sem. ' + String(from.getFullYear()).slice(2);
      longLabel = (num === 1 ? '1er' : '2d') + ' semestre ' + from.getFullYear();
    } else if (unit === 'year') {
      from = new Date(now.getFullYear() + offset, 0, 1);
      to   = new Date(now.getFullYear() + offset, 11, 31);
      label = String(from.getFullYear());
      longLabel = 'année ' + from.getFullYear();
    } else { // week — lundi → dimanche (ISO)
      const day = now.getDay() || 7;
      from = new Date(now); from.setDate(now.getDate() - (day - 1) + offset * 7);
      to   = new Date(from); to.setDate(from.getDate() + 6);
      label = 'S' + getWeekNum(from);
      longLabel = 'semaine ' + getWeekNum(from) + ' (du '
        + from.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) + ' au '
        + to.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) + ')';
    }
    return { from: ymd(from), to: ymd(to), label: label, longLabel: longLabel };
  }
  // Les `count` dernières fenêtres, de la plus ancienne à la période en cours.
  function periodWindows(unit, count) {
    const out = [];
    for (let i = count - 1; i >= 0; i--) out.push(periodWindow(unit, -i));
    return out;
  }

  // ── Compteurs d'activité (innovation / réflexion) ────────────────
  //  Les tâches sont déjà en mémoire ; les traces écrites (commentaires, idées,
  //  objectifs, rapports) ne le sont pas et leurs policies RLS sont étroites.
  //  Elles arrivent donc agrégées par la RPC activity_events (migration 0019).
  //  Poids assumés, affichés dans l'UI pour que le calcul reste contestable.
  const INNOV_WEIGHTS  = { idea_new: 1, idea_study: 2, idea_kept: 4, idea_dropped: 1 };
  const REFLEX_WEIGHTS = { message: 1, idea_comment: 1, objective_comment: 1, objective: 2, report: 4 };

  // Charge la fenêtre [from,to] si besoin. Renvoie true si les données sont
  // prêtes, false si un chargement vient d'être lancé (onReady rappellera).
  function ensureActivity(from, to, onReady) {
    const key = from + '→' + to;
    const a = state.activity;
    if (a.key === key && !a.loading) return true;
    if (a.loading === key) return false;
    a.loading = key;
    const done = (available, events) => {
      // Une autre granularité a pu être choisie entre-temps : la réponse en vol
      // ne correspond plus à ce qu'on affiche, on la jette.
      if (a.loading !== key) return;
      a.loading = false; a.key = key; a.available = available;
      const by = {};
      (events || []).forEach(e => { (by[e.author] = by[e.author] || []).push(e); });
      a.byAuthor = by;
      if (typeof onReady === 'function') onReady();
    };
    call('getActivityEvents', URL_TOKEN, from, to)
      .then(res => done(!!(res && res.success && res.available !== false), res && res.events))
      .catch(() => done(false, []));
    return false;
  }
  function activityScores(author, w) {
    const evs = state.activity.byAuthor[author] || [];
    let innovation = 0, reflexion = 0, ideas = 0, traces = 0;
    evs.forEach(e => {
      if (e.date < w.from || e.date > w.to) return;
      if (INNOV_WEIGHTS[e.kind])  { innovation += INNOV_WEIGHTS[e.kind]  * e.n; ideas  += e.n; }
      if (REFLEX_WEIGHTS[e.kind]) { reflexion  += REFLEX_WEIGHTS[e.kind] * e.n; traces += e.n; }
    });
    return { innovation: innovation, reflexion: reflexion, ideas: ideas, traces: traces };
  }

  // ── Métriques d'un acteur sur une fenêtre ────────────────────────
  //  Toutes les mesures sont RAPPORTÉES À LA FENÊTRE, sinon la comparaison
  //  période / période précédente n'aurait aucun sens :
  //   • reçues      = tâches qui lui ont été confiées pendant la fenêtre (charge)
  //   • livrées     = tâches qu'il a clôturées pendant la fenêtre (production)
  //   • taux        = part de la charge de la fenêtre déjà terminée
  //   • ponctualité = part des livraisons faites dans les délais
  //   • échéances manquées = dates limites tombées dans la fenêtre, non tenues
  //   • pilotées    = tâches qu'il a confiées à d'autres pendant la fenêtre
  //  Un rendu recalcule les mêmes couples (acteur, fenêtre) plusieurs fois — une
  //  fois pour les cartes, une fois pour le tableau, une fois par point de courbe.
  //  Ce cache, vidé à chaque rendu, évite de reparcourir state.tasks à chaque appel.
  let _statsMemo = {};
  function resetStatsMemo() { _statsMemo = {}; }
  function actorTaskStats(name, w) {
    const memoKey = name + "|" + w.from + "|" + w.to;
    if (_statsMemo[memoKey]) return _statsMemo[memoKey];
    const today = todayStr();
    let recues = 0, terminees = 0, livrees = 0, ponctuelles = 0, manquees = 0,
        sumDelai = 0, nDelai = 0, pilotees = 0, piloteesDone = 0;
    state.tasks.forEach(t => {
      const assignedIn = !!(t.dateAssigned && t.dateAssigned >= w.from && t.dateAssigned <= w.to);
      if (t.recipient === name) {
        if (assignedIn) {
          recues++;
          if (t.status === 'Terminé') terminees++;
        }
        if (t.status === 'Terminé' && t.closeDate && t.closeDate >= w.from && t.closeDate <= w.to) {
          livrees++;
          if (!t.dateLimit || t.closeDate <= t.dateLimit) ponctuelles++;
          if (t.dateAssigned) { sumDelai += Math.max(0, daysBetween(t.dateAssigned, t.closeDate)); nDelai++; }
        }
        if (t.status !== 'Terminé' && t.dateLimit && t.dateLimit >= w.from
            && t.dateLimit <= w.to && t.dateLimit < today) manquees++;
      }
      if (assignedIn && t.assignedByName === name && t.recipient !== name) {
        pilotees++;
        if (t.status === 'Terminé') piloteesDone++;
      }
    });
    return (_statsMemo[memoKey] = {
      recues: recues, terminees: terminees, livrees: livrees, manquees: manquees,
      pilotees: pilotees, piloteesDone: piloteesDone,
      taux: recues ? Math.round(terminees * 100 / recues) : 0,
      ponctualite: livrees ? Math.round(ponctuelles * 100 / livrees) : 0,
      delai: nDelai ? Math.round(sumDelai / nDelai) : 0,
      _delaiSum: sumDelai, _delaiN: nDelai, _ponctuelles: ponctuelles
    });
  }
  // Somme d'un groupe d'acteurs : les taux se recalculent sur les totaux, ils ne
  // se moyennent pas (une moyenne de pourcentages donnerait le même poids à
  // quelqu'un qui a 1 tâche qu'à quelqu'un qui en a 30).
  function sumActorStats(list) {
    const a = { recues:0, terminees:0, livrees:0, manquees:0, pilotees:0, piloteesDone:0,
                _delaiSum:0, _delaiN:0, _ponctuelles:0, innovation:0, reflexion:0, ideas:0, traces:0 };
    list.forEach(s => Object.keys(a).forEach(k => { a[k] += (s[k] || 0); }));
    a.taux        = a.recues  ? Math.round(a.terminees * 100 / a.recues)      : 0;
    a.ponctualite = a.livrees ? Math.round(a._ponctuelles * 100 / a.livrees)  : 0;
    a.delai       = a._delaiN ? Math.round(a._delaiSum / a._delaiN)           : 0;
    return a;
  }
  // Métriques complètes (tâches + activité) d'un acteur sur une fenêtre.
  function actorFullStats(name, w) {
    const s = actorTaskStats(name, w);
    const act = activityScores(name, w);
    s.innovation = act.innovation; s.reflexion = act.reflexion;
    s.ideas = act.ideas; s.traces = act.traces;
    return s;
  }

  // ── Rendu : deltas & mini-graphiques ─────────────────────────────
  //  invert = true quand une BAISSE est une bonne nouvelle (retards, délai).
  function deltaBadge(cur, prev, opts) {
    opts = opts || {};
    const unit = opts.unit || '';
    cur = Number(cur) || 0; prev = Number(prev) || 0;
    if (!cur && !prev) return '<span class="delta flat">—</span>';
    // Rien à comparer : la période précédente était à zéro. On affiche la valeur
    // brute plutôt qu'un pourcentage de progression infini.
    if (!prev) return `<span class="delta ${opts.invert ? 'down' : 'up'}">▲ +${cur}${unit}</span>`;
    const d = cur - prev;
    if (d === 0) return '<span class="delta flat">= stable</span>';
    const good = opts.invert ? d < 0 : d > 0;
    const pct = opts.points ? '' : ' (' + Math.round(Math.abs(d) * 100 / Math.abs(prev)) + '%)';
    return `<span class="delta ${good ? 'up' : 'down'}">${d > 0 ? '▲ +' : '▼ −'}${Math.abs(d)}${unit}${pct}</span>`;
  }
  // Écart en POINTS pour les pourcentages : « +7 pts », jamais « +7 % de 40 % ».
  function deltaPoints(cur, prev, invert) {
    return deltaBadge(cur, prev, { unit: ' pts', points: true, invert: !!invert });
  }
  // Un taux sans dénominateur n'est pas comparable : 0 tâche reçue ne vaut pas
  // « 0 % de réussite ». Sans base des deux côtés, on n'affiche aucun écart.
  function ratioDelta(cur, prev, curBase, prevBase, invert) {
    if (!curBase || !prevBase) return '';
    return deltaPoints(cur, prev, invert);
  }
  function sparkline(values, color) {
    const vals = (values || []).map(v => Number(v) || 0);
    if (!vals.length) return '';
    const W = 96, H = 26, pad = 3;
    const max = Math.max(1, ...vals);
    const stepX = vals.length > 1 ? (W - pad * 2) / (vals.length - 1) : 0;
    const x = i => pad + i * stepX;
    const y = v => H - pad - (v / max) * (H - pad * 2);
    const pts = vals.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
    const last = vals.length - 1;
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8"
                stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>
      <circle cx="${x(last).toFixed(1)}" cy="${y(vals[last]).toFixed(1)}" r="2.8" fill="${color}"/>
    </svg>`;
  }
  // Graphique multi-séries sur les fenêtres successives (même facture que
  // buildEvolutionChart, mais indexé sur des périodes calendaires).
  function buildPeriodChart(windows, series) {
    if (!windows.length) return '<div class="empty">Aucune donnée</div>';
    const niceMax = niceCeil(Math.max(1, ...series.map(s => Math.max(...s.values))));
    const W = Math.max(520, windows.length * 95), H = 220;
    const padL = 38, padR = 14, padT = 18, padB = 34;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    const stepX = windows.length > 1 ? innerW / (windows.length - 1) : innerW;
    const x = i => padL + i * stepX;
    const y = v => padT + innerH - (v / niceMax) * innerH;

    let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;min-height:220px;max-width:${W}px;">`;
    for (let i = 0; i <= 4; i++) {
      const yy = padT + innerH * i / 4;
      svg += `<line x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}" stroke="#e8eaed" stroke-width="1"/>`;
      svg += `<text x="${padL - 6}" y="${yy + 4}" text-anchor="end" font-size="10" fill="#9aa0a6">${Math.round(niceMax * (1 - i / 4))}</text>`;
    }
    // La dernière fenêtre est en cours : on la signale, elle n'est pas comparable
    // à plein régime avec les précédentes.
    svg += `<rect x="${x(windows.length - 1) - stepX / 2}" y="${padT}" width="${stepX / 2}" height="${innerH}" fill="#f8f9fa"/>`;
    windows.forEach((w, i) => {
      svg += `<text x="${x(i)}" y="${H - padB + 15}" text-anchor="middle" font-size="10" fill="#5f6368">${escapeHtml(w.label)}</text>`;
    });
    series.forEach(s => {
      svg += `<polyline points="${s.values.map((v, i) => x(i) + ',' + y(v)).join(' ')}" fill="none"
               stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
      s.values.forEach((v, i) => {
        svg += `<circle cx="${x(i)}" cy="${y(v)}" r="3.2" fill="${s.color}" stroke="#fff" stroke-width="1.5"/>`;
        if (v > 0) svg += `<text x="${x(i)}" y="${y(v) - 8}" text-anchor="middle" font-size="9" fill="${s.color}" font-weight="600">${v}</text>`;
      });
    });
    svg += '</svg>';
    const legend = '<div class="chart-legend">' + series.map(s =>
      `<span class="legend-item"><span class="legend-swatch" style="background:${s.color}"></span>${escapeHtml(s.label)}</span>`
    ).join('') + '<span class="legend-item" style="color:#9aa0a6;">▨ période en cours (incomplète)</span></div>';
    return legend + '<div class="evo-chart-wrap">' + svg + '</div>';
  }

  // ── Vue « Par niveau » ───────────────────────────────────────────
  const LEVEL_HISTORY = 6;   // nombre de périodes affichées sur les courbes

  async function renderLevels() {
    showLoader('Chargement…');
    const ok = await loadTasks();
    await loadPersonnel();
    hideLoader();
    if (!ok) return;

    const u = PERIOD_UNITS[state.levelUnit] || PERIOD_UNITS.week;
    let html = `<div class="page-title">🪜 Évaluation par niveau hiérarchique</div>
      <div class="page-sub">Les tâches lues par strate d'attribution, et l'évolution de chaque acteur d'une période à l'autre</div>
      <div class="cmp-bar">
        <span class="cmp-label">📊 Comparer par</span>
        <select id="lvl-unit">
          ${Object.keys(PERIOD_UNITS).map(k =>
            `<option value="${k}" ${state.levelUnit === k ? 'selected' : ''}>${PERIOD_UNITS[k].label}</option>`).join('')}
        </select>
        <span class="cmp-window prev" id="lvl-win-prev">—</span>
        <span class="cmp-arrow">→</span>
        <span class="cmp-window" id="lvl-win-cur">—</span>
        <span class="period-info" id="lvl-info">—</span>
      </div>
      <div id="lvl-tabs"></div>
      <div id="lvl-body"></div>`;
    $('main-content').innerHTML = html;

    $('lvl-unit').onchange = e => {
      state.levelUnit = e.target.value;
      renderLevelTabs();
      renderLevelBody();
    };
    renderLevelTabs();
    renderLevelBody();
  }

  function renderLevelTabs() {
    const el = $('lvl-tabs');
    if (!el) return;
    const people = activePersonnel();
    const counts = {};
    people.forEach(p => { const n = personLevel(p); counts[n] = (counts[n] || 0) + 1; });

    let html = '<div class="lvl-tabs">';
    html += `<button class="lvl-tab ${state.levelTab === 'all' ? 'active' : ''}" data-lvl="all">
               <span class="lvl-n">TOUS</span>Vue d'ensemble<span class="lvl-cnt">${people.length}</span></button>`;
    HIERARCHY_LEVELS.forEach(L => {
      const c = counts[L.n] || 0;
      const active = String(state.levelTab) === String(L.n);
      html += `<button class="lvl-tab ${active ? 'active' : ''}" data-lvl="${L.n}"
                 style="${active ? 'color:' + L.color + ';' : ''}" title="${escapeHtml(L.full)} — ${escapeHtml(L.desc)}">
                 <span class="lvl-n">NIVEAU ${L.n}</span>${escapeHtml(L.label)}<span class="lvl-cnt">${c}</span></button>`;
    });
    html += '</div>';
    el.innerHTML = html;
    el.querySelectorAll('.lvl-tab').forEach(b => {
      b.onclick = () => {
        const v = b.dataset.lvl;
        state.levelTab = v === 'all' ? 'all' : Number(v);
        renderLevelTabs();
        renderLevelBody();
      };
    });
  }

  function renderLevelBody() {
    const body = $('lvl-body');
    if (!body) return;
    resetStatsMemo();
    const unit = state.levelUnit;
    const wins = periodWindows(unit, LEVEL_HISTORY);
    const cur  = wins[wins.length - 1];
    const prev = wins[wins.length - 2];

    const winCur = $('lvl-win-cur'), winPrev = $('lvl-win-prev');
    if (winCur)  winCur.textContent  = cur.longLabel;
    if (winPrev) winPrev.textContent = prev.longLabel;

    // Les compteurs d'activité couvrent tout l'historique affiché, en un appel.
    const ready = ensureActivity(wins[0].from, cur.to, () => {
      if (state.currentTab === 'Par niveau') renderLevelBody();
    });

    const people = activePersonnel();
    const info = $('lvl-info');
    if (info) info.textContent = ready
      ? people.length + ' personne' + (people.length > 1 ? 's' : '') + ' · ' + LEVEL_HISTORY + ' ' + PERIOD_UNITS[unit].label.toLowerCase() + 's'
      : 'Chargement de l’activité…';

    body.innerHTML = (state.levelTab === 'all')
      ? renderLevelOverview(wins, people, ready)
      : renderLevelDetail(Number(state.levelTab), wins, people, ready);
    wireLevelBody();
  }

  // Statistiques par niveau sur une fenêtre : { [n]: {stats, members:[…]} }
  function levelStatsFor(people, w) {
    const out = {};
    HIERARCHY_LEVELS.forEach(L => { out[L.n] = { members: [], stats: null }; });
    people.forEach(p => {
      const n = personLevel(p);
      const s = actorFullStats(p.name, w);
      s.person = p;
      out[n].members.push(s);
    });
    HIERARCHY_LEVELS.forEach(L => { out[L.n].stats = sumActorStats(out[L.n].members); });
    return out;
  }

  // Carte KPI non cliquable portant son écart avec la période précédente.
  function cmpCard(label, value, sub, mod, delta) {
    return `<div class="kpi-card kpi-static ${mod || ''}">
      <div class="kpi-label">${label}</div><div class="kpi-value">${value}</div>
      ${sub ? `<div class="kpi-sub">${sub}</div>` : ''}${delta || ''}</div>`;
  }

  //  Cellule « innovation » / « réflexion ». L'écart n'est affiché que s'il y a
  //  quelque chose à comparer : « · — » sur une ligne vide n'apprend rien.
  function activityCell(value, ready, cls, prevValue) {
    if (!ready) return '<span class="evo-cell empty">…</span>';
    if (!state.activity.available) return '<span class="evo-cell empty" title="Migration 0019 non appliquée">—</span>';
    const cell = `<span class="evo-cell ${value ? cls : 'empty'}">${value || '·'}</span>`;
    if (prevValue == null || (!value && !prevValue)) return cell;
    return cell + ' ' + deltaBadge(value, prevValue);
  }

  function renderLevelOverview(wins, people, ready) {
    const cur = wins[wins.length - 1], prev = wins[wins.length - 2];
    const byLvlCur  = levelStatsFor(people, cur);
    const byLvlPrev = levelStatsFor(people, prev);
    const totCur  = sumActorStats(HIERARCHY_LEVELS.map(L => byLvlCur[L.n].stats));
    const totPrev = sumActorStats(HIERARCHY_LEVELS.map(L => byLvlPrev[L.n].stats));

    // Cartes globales, chacune avec son écart sur la période précédente.
    const card = cmpCard;
    let html = '<div class="kpi-grid">';
    html += card('Tâches reçues', totCur.recues, 'confiées pendant la période', '',
                 deltaBadge(totCur.recues, totPrev.recues));
    html += card('Livrées', totCur.livrees, 'clôturées pendant la période',
                 totCur.livrees >= totPrev.livrees ? 'ok' : '', deltaBadge(totCur.livrees, totPrev.livrees));
    html += card('Taux de complétion', totCur.recues ? totCur.taux + '%' : '—', 'sur la charge de la période',
                 !totCur.recues ? '' : totCur.taux >= 70 ? 'ok' : totCur.taux >= 40 ? 'warn' : 'danger',
                 ratioDelta(totCur.taux, totPrev.taux, totCur.recues, totPrev.recues));
    html += card('Ponctualité', totCur.livrees ? totCur.ponctualite + '%' : '—', 'livraisons dans les délais',
                 !totCur.livrees ? '' : totCur.ponctualite >= 70 ? 'ok' : totCur.ponctualite >= 40 ? 'warn' : 'danger',
                 ratioDelta(totCur.ponctualite, totPrev.ponctualite, totCur.livrees, totPrev.livrees));
    html += card('Échéances manquées', totCur.manquees, 'dates limites non tenues',
                 totCur.manquees > 0 ? 'danger' : 'ok', deltaBadge(totCur.manquees, totPrev.manquees, { invert: true }));
    html += card('Délai moyen', totCur.delai ? totCur.delai + 'j' : '—', 'de l’attribution à la clôture', '',
                 totCur.delai || totPrev.delai ? deltaBadge(totCur.delai, totPrev.delai, { unit: 'j', invert: true }) : '');
    if (ready && state.activity.available) {
      html += card('💡 Innovation', totCur.innovation, totCur.ideas + ' idée(s) déposée(s)',
                   totCur.innovation > 0 ? 'ok' : '', deltaBadge(totCur.innovation, totPrev.innovation));
      html += card('🧠 Réflexion', totCur.reflexion, totCur.traces + ' contribution(s) écrite(s)',
                   totCur.reflexion > 0 ? 'ok' : '', deltaBadge(totCur.reflexion, totPrev.reflexion));
    }
    html += '</div>';

    // Tableau : une ligne par niveau, avec la courbe des livraisons.
    html += `<div class="dash-section"><h3>🪜 Comparaison des niveaux <span class="count">6</span></h3>
      <div class="table-wrap" style="border:none;"><table><thead><tr>
        <th>Niveau</th><th>Effectif</th><th>Reçues</th><th>Livrées</th><th>Évolution</th>
        <th>Taux</th><th>Ponctualité</th><th>Manquées</th><th>Délai</th><th>💡 Innov.</th><th>🧠 Réflex.</th>
      </tr></thead><tbody>`;
    HIERARCHY_LEVELS.forEach(L => {
      const c = byLvlCur[L.n].stats, p = byLvlPrev[L.n].stats;
      const eff = byLvlCur[L.n].members.length;
      const hist = wins.map(w => sumActorStats(
        people.filter(x => personLevel(x) === L.n).map(x => actorFullStats(x.name, w))
      ).livrees);
      const tauxMod = c.taux >= 70 ? 'ok' : c.taux >= 40 ? 'warn' : (c.recues ? 'danger' : 'empty');
      html += `<tr class="lvl-row-clickable" style="cursor:pointer;" data-lvl="${L.n}">
        <td data-label="Niveau"><strong style="color:${L.color}">N${L.n} · ${escapeHtml(L.label)}</strong></td>
        <td data-label="Effectif">${eff}</td>
        <td data-label="Reçues">${c.recues} ${deltaBadge(c.recues, p.recues)}</td>
        <td data-label="Livrées"><strong>${c.livrees}</strong> ${deltaBadge(c.livrees, p.livrees)}</td>
        <td data-label="Évolution">${sparkline(hist, L.color)}</td>
        <td data-label="Taux"><span class="evo-cell ${tauxMod}">${c.recues ? c.taux + '%' : '·'}</span>
            ${c.recues && p.recues ? deltaPoints(c.taux, p.taux) : ''}</td>
        <td data-label="Ponctualité">${c.livrees ? c.ponctualite + '%' : '<span class="evo-cell empty">·</span>'}</td>
        <td data-label="Manquées">${c.manquees ? '<span class="badge badge-overdue">' + c.manquees + '</span>' : '—'}</td>
        <td data-label="Délai">${c.delai ? c.delai + 'j' : '—'}</td>
        <td data-label="Innovation">${activityCell(c.innovation, ready, 'info', p.innovation)}</td>
        <td data-label="Réflexion">${activityCell(c.reflexion, ready, 'info', p.reflexion)}</td>
      </tr>`;
    });
    html += '</tbody></table></div></div>';

    // Courbe d'ensemble
    html += `<div class="dash-section"><h3>📈 Évolution de l'entreprise sur ${LEVEL_HISTORY} ${PERIOD_UNITS[state.levelUnit].label.toLowerCase()}s</h3>`;
    const allHist = wins.map(w => sumActorStats(people.map(x => actorFullStats(x.name, w))));
    html += buildPeriodChart(wins, [
      { label: 'Reçues',   color: '#1a73e8', values: allHist.map(s => s.recues) },
      { label: 'Livrées',  color: '#137333', values: allHist.map(s => s.livrees) },
      { label: 'Échéances manquées', color: '#c5221f', values: allHist.map(s => s.manquees) }
    ]);
    html += '</div>';
    html += levelMethodNote(ready);
    return html;
  }

  function renderLevelDetail(n, wins, people, ready) {
    const L = levelDef(n);
    const cur = wins[wins.length - 1], prev = wins[wins.length - 2];
    const members = people.filter(p => personLevel(p) === n);

    let html = `<div class="lvl-head" style="background:${L.grad}">
      <h3>Niveau ${L.n} — ${escapeHtml(L.full)}</h3>
      <div class="lvl-sub">${escapeHtml(L.desc)} · ${members.length} personne${members.length > 1 ? 's' : ''} · ${escapeHtml(cur.longLabel)}</div>
    </div>`;

    if (!members.length) {
      return html + '<div class="empty-state"><div class="icon">🫥</div><h4>Personne à ce niveau</h4>'
        + '<p>Aucun membre du personnel actif n’est classé ici pour l’instant.</p></div>' + levelMethodNote(ready);
    }

    const statsCur  = members.map(p => { const s = actorFullStats(p.name, cur);  s.person = p; return s; });
    const statsPrev = {};
    members.forEach(p => { statsPrev[p.name] = actorFullStats(p.name, prev); });
    const totCur  = sumActorStats(statsCur);
    const totPrev = sumActorStats(members.map(p => statsPrev[p.name]));

    const card = cmpCard;
    html += '<div class="kpi-grid">';
    html += card('Reçues', totCur.recues, '', '', deltaBadge(totCur.recues, totPrev.recues));
    html += card('Livrées', totCur.livrees, '', totCur.livrees >= totPrev.livrees ? 'ok' : '',
                 deltaBadge(totCur.livrees, totPrev.livrees));
    html += card('Taux', totCur.recues ? totCur.taux + '%' : '—', 'de la charge terminée',
                 !totCur.recues ? '' : totCur.taux >= 70 ? 'ok' : totCur.taux >= 40 ? 'warn' : 'danger',
                 ratioDelta(totCur.taux, totPrev.taux, totCur.recues, totPrev.recues));
    html += card('Ponctualité', totCur.livrees ? totCur.ponctualite + '%' : '—', 'livrées dans les délais',
                 !totCur.livrees ? '' : totCur.ponctualite >= 70 ? 'ok' : 'warn',
                 ratioDelta(totCur.ponctualite, totPrev.ponctualite, totCur.livrees, totPrev.livrees));
    html += card('Manquées', totCur.manquees, '', totCur.manquees ? 'danger' : 'ok',
                 deltaBadge(totCur.manquees, totPrev.manquees, { invert: true }));
    html += card('Pilotage', totCur.pilotees, 'tâches confiées à d’autres', '',
                 deltaBadge(totCur.pilotees, totPrev.pilotees));
    if (ready && state.activity.available) {
      html += card('💡 Innovation', totCur.innovation, totCur.ideas + ' idée(s)', totCur.innovation ? 'ok' : '',
                   deltaBadge(totCur.innovation, totPrev.innovation));
      html += card('🧠 Réflexion', totCur.reflexion, totCur.traces + ' contribution(s)', totCur.reflexion ? 'ok' : '',
                   deltaBadge(totCur.reflexion, totPrev.reflexion));
    }
    html += '</div>';

    const hist = wins.map(w => sumActorStats(members.map(p => actorFullStats(p.name, w))));
    html += `<div class="dash-section"><h3>📈 Évolution du niveau ${L.n}</h3>`;
    html += buildPeriodChart(wins, [
      { label: 'Reçues',  color: '#1a73e8', values: hist.map(s => s.recues) },
      { label: 'Livrées', color: L.color,   values: hist.map(s => s.livrees) },
      { label: 'Manquées', color: '#c5221f', values: hist.map(s => s.manquees) }
    ]);
    html += '</div>';

    // Tableau des acteurs — trié par production, puis par charge.
    const canFix = state.user.role === 'chef' || state.user.role === 'rh';
    statsCur.sort((a, b) => (b.livrees - a.livrees) || (b.recues - a.recues) || a.person.name.localeCompare(b.person.name));

    html += `<div class="dash-section"><h3>👥 Acteurs du niveau ${L.n} <span class="count">${members.length}</span></h3>
      <div class="table-wrap" style="border:none;"><table><thead><tr>
        <th>Acteur</th><th>Reçues</th><th>Livrées</th><th>Courbe</th><th>Taux</th>
        <th>Ponctualité</th><th>Manquées</th><th>Délai</th><th>Pilotage</th>
        <th>💡 Innov.</th><th>🧠 Réflex.</th>${canFix ? '<th>Niveau</th>' : ''}
      </tr></thead><tbody>`;
    statsCur.forEach(s => {
      const p = s.person, pv = statsPrev[p.name];
      const curve = wins.map(w => actorTaskStats(p.name, w).livrees);
      const tauxMod = s.taux >= 70 ? 'ok' : s.taux >= 40 ? 'warn' : (s.recues ? 'danger' : 'empty');
      const auto = autoHierarchyLevel(p);
      html += `<tr>
        <td data-label="Acteur">
          <div class="lvl-actor-name lvl-actor-open" style="cursor:pointer;" data-emp="${escapeHtml(p.name)}">
            <strong style="color:#1557b0;">${escapeHtml(p.name)}</strong>
            <span class="fn">${escapeHtml(p.position || p.role || '—')}${p.dept ? ' · ' + escapeHtml(p.dept) : ''}</span>
          </div></td>
        <td data-label="Reçues">${s.recues} ${deltaBadge(s.recues, pv.recues)}</td>
        <td data-label="Livrées"><strong>${s.livrees}</strong> ${deltaBadge(s.livrees, pv.livrees)}</td>
        <td data-label="Courbe">${sparkline(curve, L.color)}</td>
        <td data-label="Taux"><span class="evo-cell ${tauxMod}">${s.recues ? s.taux + '%' : '·'}</span></td>
        <td data-label="Ponctualité">${s.livrees ? s.ponctualite + '%' : '<span class="evo-cell empty">·</span>'}</td>
        <td data-label="Manquées">${s.manquees ? '<span class="badge badge-overdue">' + s.manquees + '</span>' : '—'}</td>
        <td data-label="Délai">${s.delai ? s.delai + 'j' : '—'}</td>
        <td data-label="Pilotage">${s.pilotees || '—'}</td>
        <td data-label="Innovation">${activityCell(s.innovation, ready, 'info', pv.innovation)}</td>
        <td data-label="Réflexion">${activityCell(s.reflexion, ready, 'info', pv.reflexion)}</td>
        ${canFix ? `<td data-label="Niveau">
          <select class="lvl-fix" data-person="${escapeHtml(p.id || '')}"
                  data-prev="${Number(p.hierarchyLevel) >= 1 ? Number(p.hierarchyLevel) : ''}"
                  title="Corriger le niveau d’attribution — « Auto » revient à la déduction depuis la fonction déclarée">
            <option value="">Auto (N${auto})</option>
            ${HIERARCHY_LEVELS.map(x => `<option value="${x.n}" ${Number(p.hierarchyLevel) === x.n ? 'selected' : ''}>N${x.n} · ${escapeHtml(x.label)}</option>`).join('')}
          </select></td>` : ''}
      </tr>`;
    });
    html += '</tbody></table></div></div>';
    html += levelMethodNote(ready);
    return html;
  }

  // Le calcul doit rester lisible et contestable : on l'écrit sous le tableau.
  function levelMethodNote(ready) {
    const unavailable = ready && !state.activity.available;
    return `<div class="lvl-note">
      <strong>Comment ces chiffres sont calculés.</strong><br>
      <strong>Reçues</strong> : tâches confiées à la personne pendant la période ·
      <strong>Livrées</strong> : tâches qu'elle a clôturées pendant la période ·
      <strong>Taux</strong> : part des reçues déjà terminées ·
      <strong>Ponctualité</strong> : part des livraisons faites au plus tard à l'échéance ·
      <strong>Manquées</strong> : échéances tombées dans la période sans que la tâche soit terminée ·
      <strong>Pilotage</strong> : tâches confiées à d'autres.<br>
      <strong>💡 Innovation</strong> = <code>4×idée retenue + 2×idée à l'étude + 1×idée nouvelle ou écartée</code>
      (le statut retenu est celui d'aujourd'hui, pas celui du jour du dépôt).<br>
      <strong>🧠 Réflexion</strong> = <code>4×rapport + 2×objectif posé + 1×commentaire (tâche, idée, objectif)</code>.<br>
      Les périodes sont <strong>calendaires</strong> (semaine du lundi au dimanche, mois, trimestre, semestre, année civile) :
      la période en cours est forcément incomplète, c'est pourquoi elle est grisée sur les courbes.<br>
      Le niveau est déduit de la fonction déclarée ; le Chef et la DA-RH peuvent le corriger acteur par acteur.
      ${unavailable ? '<br><span style="color:#b06000;"><strong>⚠ Innovation et Réflexion indisponibles</strong> — la migration <code>0019_hierarchy_levels.sql</code> n\'est pas encore appliquée sur la base. Les indicateurs de tâches, eux, restent exacts.</span>' : ''}
    </div>`;
  }

  function wireLevelBody() {
    const body = $('lvl-body');
    if (!body) return;
    body.querySelectorAll('.lvl-row-clickable').forEach(row => {
      row.onclick = () => { state.levelTab = Number(row.dataset.lvl); renderLevelTabs(); renderLevelBody(); };
    });
    // Ouvre la fiche détaillée (mêmes 3 groupes que « Par employé »), calée sur
    // la fenêtre calendaire affichée et non sur la période de l'onglet employé.
    body.querySelectorAll('.lvl-actor-open').forEach(el => {
      el.onclick = () => openLevelActorDetail(el.dataset.emp);
    });
    body.querySelectorAll('.lvl-fix').forEach(sel => {
      sel.onchange = () => saveHierarchyLevel(sel.dataset.person, sel.value, sel);
    });
  }

  // La fiche employé s'appuie sur state.periods[key] : on y projette la fenêtre
  // calendaire courante via une période « custom », le temps de l'ouvrir.
  function openLevelActorDetail(name) {
    if (!name) return;
    const w = periodWindow(state.levelUnit, 0);
    state.periods.level = { mode: 'custom', from: w.from, to: w.to };
    openEmpDetail(name, 'level');
  }

  async function saveHierarchyLevel(personId, value, selectEl) {
    if (!personId) { toast('Personne sans identifiant — rechargez la page.', 'error'); return; }
    const previous = selectEl ? selectEl.getAttribute('data-prev') || '' : '';
    if (selectEl) selectEl.disabled = true;
    const res = await call('setHierarchyLevel', URL_TOKEN, personId, value === '' ? null : Number(value));
    if (selectEl) selectEl.disabled = false;
    if (!res || !res.success) {
      toast((res && res.error) || 'Échec de la modification du niveau', 'error');
      if (selectEl) selectEl.value = previous;
      return;
    }
    const p = state.personnel.find(x => x.id === personId);
    if (p) p.hierarchyLevel = res.level;
    toast('Niveau mis à jour', 'success');
    renderLevelTabs();
    renderLevelBody();
  }

  // ═════════════════════════════════════════════════════════════════
  //  ✨ v6.8 : AUTORISATION DE VERSEMENT DE SALAIRE
  //  Circuit : Demande (RH) → Validation (DF) → Approbation (GE) →
  //  Autorisation (PAU). Chaque étape notifie l'acteur suivant par e-mail.
  // ═════════════════════════════════════════════════════════════════
  let salaryState = null;

  async function renderSalaryAuth() {
    showLoader('Chargement…');
    let res;
    try { res = await call('getSalaryAuthorizations', URL_TOKEN); }
    catch (e) { hideLoader(); $('main-content').innerHTML = '<div class="empty-state"><div class="icon">⚠</div><h4>Erreur de chargement</h4></div>'; return; }
    hideLoader();
    if (!res || !res.success) {
      $('main-content').innerHTML = `<div class="empty-state"><div class="icon">🔒</div><h4>${escapeHtml((res && res.error) || 'Accès refusé')}</h4></div>`;
      return;
    }
    salaryState = res;
    const vf = res.viewerFunction;
    // ✨ v7.2 : « self » = personne hors circuit — elle ne voit et n'agit que sur
    // sa propre demande. La limite est aussi posée en base (policy salary_select),
    // l'affichage ne fait que s'y conformer.
    const isSelf = res.scope === 'self';
    const vfLabel = vf
      ? ({ rh:'DA-RH', df:'Directeur Financier (DF)', ge:'Gérant (GE)', pau:'Personne Autorisée (PAU)' })[vf]
      : (res.isAdmin ? 'Administrateur (supervision, lecture seule)' : 'Bénéficiaire');

    let html = `<div class="page-title">💰 Autorisation de versement de salaire</div>
      <div class="page-sub">Vous êtes connecté comme <strong>${escapeHtml(vfLabel)}</strong>${
        isSelf ? ' — vous pouvez demander une autorisation <strong>pour vous-même</strong> et suivre son avancement' : ''}</div>`;

    html += `<div class="sal-chain">
      <span class="sal-step s-demande">1 · Demande</span><span class="sal-arrow">→</span>
      <span class="sal-step s-valide">2 · Validation (DF)</span><span class="sal-arrow">→</span>
      <span class="sal-step s-approuve">3 · Approbation (GE)</span><span class="sal-arrow">→</span>
      <span class="sal-step s-autorise">4 · Autorisation (PAU)</span>
    </div>`;

    if (isSelf) {
      html += `<div class="lvl-note">Cet écran ne montre que <strong>votre</strong> demande.
        Les demandes de vos collègues, et les montants qui s'y rattachent, ne vous sont pas accessibles.</div>`;
    }

    html += `<div class="toolbar">
      ${isSelf ? '' : '<input type="search" class="search-box" id="sal-search" placeholder="🔍 Rechercher une personne…">'}
      <div class="grow"></div>
      ${res.canSetNotify ? `<button class="btn btn-secondary" id="sal-notify-cfg">⚙️ Paramétrer les notifications</button>` : ''}
      ${vf === 'rh' ? `<button class="btn btn-secondary" id="sal-add-ext">➕ Bénéficiaire externe</button>` : ''}
    </div>`;
