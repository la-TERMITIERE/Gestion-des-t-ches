    html += '<div id="sal-body"></div>';
    $('main-content').innerHTML = html;

    const si = $('sal-search');
    if (si) si.oninput = () => renderSalaryBody(si.value);
    const addBtn = $('sal-add-ext');
    if (addBtn) addBtn.onclick = openAddExternalBeneficiaryModal;
    const cfgBtn = $('sal-notify-cfg');
    if (cfgBtn) cfgBtn.onclick = openSalaryNotifyModal;
    renderSalaryBody('');
  }

  function renderSalaryBody(search) {
    const res = salaryState;
    if (!res) return;
    const q = (search || '').toLowerCase().trim();
    let rows = res.rows || [];
    if (q) rows = rows.filter(r =>
      r.person.toLowerCase().includes(q) ||
      (r.dept || '').toLowerCase().includes(q) ||
      (r.fonction || '').toLowerCase().includes(q));

    const isSelf = res.scope === 'self';
    let html = '';
    // Les compteurs n'ont de sens que sur une liste : sur une seule ligne, ils
    // répéteraient le badge de statut affiché juste en dessous.
    if (!isSelf) {
      const counts = { demande:0, valide:0, approuve:0, autorise:0, rejete:0, none:0 };
      (res.rows || []).forEach(r => { counts[r.statusKey] = (counts[r.statusKey] || 0) + 1; });
      html += '<div class="kpi-grid">';
      html += kpiCardSimple('En attente DF',  counts.demande,  '', counts.demande  ? 'warn' : '');
      html += kpiCardSimple('En attente GE',  counts.valide,   '', counts.valide   ? 'warn' : '');
      html += kpiCardSimple('En attente PAU', counts.approuve, '', counts.approuve ? 'warn' : '');
      html += kpiCardSimple('Autorisés',      counts.autorise, '', counts.autorise ? 'ok' : '');
      html += '</div>';
    }

    html += isSelf
      ? `<div class="dash-section"><h3>💰 Ma demande</h3>`
      : `<div class="dash-section"><h3>👥 Bénéficiaires <span class="count">${rows.length}</span></h3>`;
    html += '<div class="sal-list">';
    rows.forEach(r => {
      const a = r.auth;
      const metaBits = [];
      if (a) {
        if (a.periode)     metaBits.push('Période : ' + escapeHtml(a.periode));
        if (a.montant)     metaBits.push('Montant : ' + escapeHtml(a.montant));
        if (a.requestedBy) metaBits.push('Demande : ' + escapeHtml(a.requestedBy) + (a.requestedAt ? ' (' + escapeHtml(a.requestedAt) + ')' : ''));
        if (a.validatedBy)  metaBits.push('Validé : ' + escapeHtml(a.validatedBy));
        if (a.approvedBy)   metaBits.push('Approuvé : ' + escapeHtml(a.approvedBy));
        if (a.authorizedBy) metaBits.push('Autorisé : ' + escapeHtml(a.authorizedBy));
        if (r.statusKey === 'rejete') metaBits.push('Rejeté par ' + escapeHtml(a.rejectedBy) + ' — ' + escapeHtml(a.rejectReason || ''));
      }

      let actions = '';
      if (r.myAction === 'demander') {
        actions = `<button class="btn btn-primary sal-act" data-act="demander" data-person="${escapeHtml(r.person)}">📝 Demande d'autorisation</button>`;
      } else if (r.myAction && a) {
        const lbl = { valider:'✅ Valider', approuver:'✅ Approuver', autoriser:'✅ Autoriser' }[r.myAction];
        actions = `<button class="btn btn-primary sal-act" data-act="${r.myAction}" data-id="${escapeHtml(a.id)}" data-person="${escapeHtml(r.person)}">${lbl}</button>
                   <button class="btn btn-secondary sal-act" data-act="rejeter" data-id="${escapeHtml(a.id)}" data-person="${escapeHtml(r.person)}" style="color:#c5221f;border-color:#fce8e6;">✗ Rejeter</button>`;
      }
      // ✨ v6.9 : la RH peut retirer un bénéficiaire externe (si aucune demande en cours)
      if (r.isExternal && res.viewerFunction === 'rh' && (r.statusKey === 'none' || r.statusKey === 'autorise' || r.statusKey === 'rejete')) {

  function renderSalaryNotifyList(search) {
    const list = $('saln-list');
    if (!list || !salaryNotifyPeople) return;
    const q = (search || '').toLowerCase().trim();
    const shown = salaryNotifyPeople.filter(p => !q
      || p.name.toLowerCase().includes(q)
      || (p.dept || '').toLowerCase().includes(q)
      || (p.fonction || '').toLowerCase().includes(q));

    list.innerHTML = shown.length ? shown.map(p => `
      <div class="team-member-chk" style="justify-content:space-between;">

          <div style="font-weight:600;">${escapeHtml(p.name)}</div>

        </div>
        <span style="width:82px;text-align:center;">
          <input type="checkbox" class="saln-chk" data-id="${escapeHtml(p.id)}" data-kind="request"

        </span>
        <span style="width:82px;text-align:center;">
          <input type="checkbox" class="saln-chk" data-id="${escapeHtml(p.id)}" data-kind="decision"

        </span>
      </div>`).join('')
      : '<div class="empty" style="padding:12px;">Aucun résultat</div>';

    list.querySelectorAll('.saln-chk').forEach(chk => {
      chk.onchange = () => toggleSalaryNotify(chk.dataset.id, chk.dataset.kind, chk);
    });
    const nReq = salaryNotifyPeople.filter(p => p.onRequest).length;
    const nDec = salaryNotifyPeople.filter(p => p.onDecision).length;
    const c = $('saln-count');
    if (c) c.innerHTML = `<strong>${nReq}</strong> personne(s) prévenue(s) à l'initiation · <strong>${nDec}</strong> aux décisions.`;
  }

  async function toggleSalaryNotify(personId, kind, chk) {
    const p = salaryNotifyPeople.find(x => x.id === personId);
    if (!p) return;
    const before = { onRequest: p.onRequest, onDecision: p.onDecision };
    if (kind === 'request') p.onRequest = chk.checked; else p.onDecision = chk.checked;
    chk.disabled = true;
    const res = await call('setSalaryNotifyRecipient', URL_TOKEN, personId, p.onRequest, p.onDecision);
    chk.disabled = false;
    if (!res || !res.success) {
      // Rollback : la case doit refléter ce que la base a réellement accepté.
      p.onRequest = before.onRequest; p.onDecision = before.onDecision;
      chk.checked = kind === 'request' ? p.onRequest : p.onDecision;
      toast((res && res.error) || 'Modification refusée', 'error');
      return;
    }
    const s = $('saln-search');
    renderSalaryNotifyList(s ? s.value : '');
  }

async function submitChangeRecipient(taskId) {
  const newRecipient = $('cr-new-recipient').value;
  const reason = ($('cr-reason') ? $('cr-reason').value : '').trim();

  if (!newRecipient) {
    toast('Veuillez sélectionner un nouveau destinataire.', 'error');
    return;
  }

  showLoader('Réaffectation en cours…');
  try {
    const res = await call('changeTaskRecipient', URL_TOKEN, taskId, newRecipient, reason);
    if (!res || !res.success) {
      toast((res && res.error) || 'Erreur', 'error');
      return;
    }
    toast(`✅ Tâche réaffectée : ${res.oldRecipient} → ${res.newRecipient}`, 'success');
    // Mise à jour optimiste locale
    const t = state.tasks.find(x => x.id === taskId);
    if (t) {
      t.recipient = res.newRecipient;
      t.status = 'À faire';
      t.progress = 0;
      t.closeDate = '';
      t.employeeComment = '';
    }
    state.loaded.tasks = 0;
    closeModal();
    if (state.currentTab === 'Tâches' || state.currentTab === 'Mes tâches') renderTasksTable();
    if (state.user) renderTabs();
  } catch (e) {
    toast('Erreur : ' + (e.message || e), 'error');
  } finally {
    hideLoader();
  }
}

// ═══════════════════════════════════════════════════════════════════
//  ✨ NOUVEAU : MODAL RETOURNER LA TÂCHE (par le destinataire)
// ═══════════════════════════════════════════════════════════════════
async function openReturnTaskModal(taskId) {
  const t = state.tasks.find(x => x.id === taskId);
  if (!t) return;

  if (!state.personnel.length) {
    showLoader('Chargement…');
    const r = await call('getPersonnel', URL_TOKEN);
    if (r.success) state.personnel = r.personnel || [];
    hideLoader();
  }

  // Exclure soi-même et l'assignateur du dropdown
  // (l'assignateur peut toujours récupérer la tâche, mais le destinataire
  //  peut la transférer vers n'importe qui d'autre, y compris l'assignateur)
  const me = state.user.name;
  const candidates = state.personnel
    .filter(p => p.status !== 'Inactif' && p.name !== me)
    .sort((a, b) => {
      // Mettre l'assignateur en premier pour faciliter le retour direct
      if (a.name === t.assignedByName) return -1;
      if (b.name === t.assignedByName) return 1;
      return a.name.localeCompare(b.name);
    });

  const options = candidates.map(p => {
    const isAssigner = p.name === t.assignedByName;
    const tag = isAssigner ? ' (assignateur original)' : '';
    return `<option value="${escapeHtml(p.name)}" ${isAssigner ? 'selected' : ''}>${escapeHtml(p.name)}${tag} — ${escapeHtml(p.dept || '?')}</option>`;
  }).join('');

  showModal('↩️ Retourner la tâche — ' + taskId, `
    <div class="form-row">
      <label>Tâche</label>
      <div style="background:#f8f9fa;padding:10px;border-radius:4px;font-size:13px;">${escapeHtml(t.description)}</div>
    </div>
    <div class="form-row">
      <label>Assignée par</label>
      <div style="font-size:13px;color:#5f6368;">👤 ${escapeHtml(t.assignedByName)}</div>
    </div>
    <div class="form-row">
      <label>Transférer à *</label>
      <select id="rt-new-recipient" required>
        <option value="">— Sélectionner une personne —</option>
        ${options}
      </select>
      <div class="hint">L'assignateur original (<strong>${escapeHtml(t.assignedByName)}</strong>) est présélectionné. Vous pouvez choisir une autre personne.</div>
    </div>
    <div class="form-row">
      <label>Motif du retour / transfert *</label>
      <textarea id="rt-reason" placeholder="Ex : hors de mes attributions, manque de compétences techniques, je suis en déplacement jusqu'au…" rows="4" required></textarea>
    </div>
    <div style="font-size:12px;color:#9c27b0;background:#f9f0ff;border:1px solid #e1bee7;border-radius:6px;padding:10px;margin-top:8px;">
      ℹ️ <strong>${escapeHtml(t.assignedByName)}</strong> (l'assignateur) sera notifié(e) du retour et de votre motif.<br>
      La personne choisie recevra une notification de transfert.<br>
      La tâche repassera à <strong>« À faire »</strong>.
    </div>
  `, [
    { label: 'Annuler', class: 'btn-secondary', onClick: closeModal },
    { label: '↩️ Confirmer le retour', class: 'btn-primary', onClick: () => submitReturnTask(taskId) }
  ]);
}

async function submitReturnTask(taskId) {
  const newRecipient = $('rt-new-recipient').value;
  const reason = ($('rt-reason') ? $('rt-reason').value : '').trim();

  if (!newRecipient) {
    toast('Veuillez sélectionner une personne à qui transférer la tâche.', 'error');
    return;
  }
  if (!reason) {
    toast('Le motif est obligatoire pour retourner une tâche.', 'error');
    return;
  }

  showLoader('Transfert en cours…');
  try {
    const res = await call('returnTask', URL_TOKEN, taskId, newRecipient, reason);
    if (!res || !res.success) {
      toast((res && res.error) || 'Erreur', 'error');
      return;
    }
    toast(`↩️ Tâche retournée vers ${res.newRecipient} — l'assignateur a été notifié`, 'success');
    // Mise à jour optimiste : si la tâche n'appartient plus à l'utilisateur
    // courant (en tant que destinataire), la retirer de sa vue
    const t = state.tasks.find(x => x.id === taskId);
    if (t) {
      t.recipient = res.newRecipient;
      t.status = 'À faire';
      t.progress = 0;
      t.closeDate = '';
      t.employeeComment = '';
      t.canEdit = (state.user.name === t.assignedByName || state.user.role === 'chef');
    }
    state.loaded.tasks = 0;
    closeModal();
    if (state.currentTab === 'Tâches' || state.currentTab === 'Mes tâches') renderTasksTable();
    if (state.user) renderTabs();
  } catch (e) {
    toast('Erreur : ' + (e.message || e), 'error');
  } finally {
    hideLoader();
  }
}

  // ═════════════════════════════════════════════════════════════════
  //  MODAL HELPERS
  // ═════════════════════════════════════════════════════════════════
  function showModal(title, bodyHtml, buttons) {
    closeModal();
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'modal-overlay';
    overlay.innerHTML = `<div class="modal">
      <div class="modal-header"><h3>${escapeHtml(title)}</h3>
        <button class="btn btn-icon" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>`;
    document.body.appendChild(overlay);
    const footer = $('modal-footer');
    (buttons || []).forEach(b => {
      const btn = document.createElement('button');
      btn.className = 'btn ' + (b.class || 'btn-secondary');
      btn.textContent = b.label;
      btn.onclick = b.onClick;
      footer.appendChild(btn);
    });
    overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
  }
  function closeModal() {
    const o = $('modal-overlay');
    if (o) o.remove();
  }

  // ═════════════════════════════════════════════════════════════════
  //  RAPPORTS — dépôt libre (tout format), visibilité = destinataires
  //  cochés par l'auteur au moment du dépôt (+ Chef, en supervision).
  // ═════════════════════════════════════════════════════════════════
  const REPORT_MAX_BYTES = 20 * 1024 * 1024;   // 20 Mo, tous formats acceptés

  async function renderReports() {
    showLoader('Chargement…');
    const [rRes, pRes] = await Promise.all([
      call('getReports', URL_TOKEN),
      state.personnel.length ? Promise.resolve({ success: true, personnel: state.personnel }) : call('getPersonnel', URL_TOKEN)
    ]);
    hideLoader();
    if (pRes && pRes.success) state.personnel = pRes.personnel || [];
    const reportsLoadError = !rRes || !rRes.success;
    if (reportsLoadError) toast((rRes && rRes.error) || 'Erreur de chargement des rapports', 'error');
    state.reports = reportsLoadError ? [] : (rRes.reports || []);

    const others = state.personnel.filter(p =>
      (p.status || '').toLowerCase() !== 'inactif' && p.name !== state.user.name);

    let html = `<div class="page-title">📄 Rapports</div>
                <div class="page-sub">Dépose un rapport et choisis qui peut le voir</div>`;

    html += `<div class="dash-section">
      <h3>📤 Déposer un rapport</h3>
      <div class="form-row"><label>Titre *</label><input type="text" id="rep-title" placeholder="Ex. Rapport de mission juillet"></div>
      <div class="form-row"><label>Description</label><textarea id="rep-desc" rows="2" placeholder="Optionnel"></textarea></div>
      <div class="form-row"><label>Fichier * (tout format, max 20 Mo)</label><input type="file" id="rep-file"></div>
      <div class="form-row"><label>Qui peut voir ce rapport ? *</label>
        <div id="rep-recipients" style="max-height:220px;overflow:auto;border:1px solid #dadce0;border-radius:8px;padding:8px;">
          ${others.map(p => `
            <label style="display:flex;align-items:center;gap:8px;padding:4px 2px;font-size:13px;font-weight:400;">
              <input type="checkbox" value="${escapeHtml(p.id)}" class="rep-recipient-cb" style="width:auto;flex:none;">
              ${escapeHtml(p.name)} <span style="color:#5f6368;">(${escapeHtml(p.dept || '—')})</span>
            </label>`).join('') || '<div class="hint">Aucun autre employé actif.</div>'}
        </div>
      </div>
      <button class="btn btn-primary" id="btn-submit-report" style="margin-top:10px;">Soumettre</button>
    </div>`;

    html += `<div class="dash-section"><h3>📄 Rapports visibles <span class="count">${state.reports.length}</span></h3>
      <div id="reports-list"></div></div>`;

    $('main-content').innerHTML = html;
    $('btn-submit-report').onclick = submitReport;
    renderReportsList();
  }

  function renderReportsList() {
    const wrap = $('reports-list');
    if (!wrap) return;
    if (!state.reports.length) {
      wrap.innerHTML = '<div class="empty-state"><div class="icon">📭</div><h4>Aucun rapport</h4></div>';
      return;
    }
    let rows = '';
    state.reports.forEach(r => {
      rows += `<div class="dir-card">
        <div class="dir-card-header">
          <div class="dir-avatar">${initials(r.authorName)}</div>
          <div class="dir-card-info">
            <div class="nm">${escapeHtml(r.title)} ${r.isMine ? '<span class="badge badge-role-emp" style="font-size:10px;">Mon dépôt</span>' : ''}</div>
            <div class="dpt">Par ${escapeHtml(r.authorName)} · ${escapeHtml(r.createdAt)} · ${escapeHtml(r.fileName)}</div>
          </div>
        </div>
        ${r.description ? `<div style="font-size:13px;color:#3c4043;margin:6px 0;">${escapeHtml(r.description)}</div>` : ''}
        ${r.recipients && r.recipients.length ? `<div style="font-size:11px;color:#5f6368;margin-bottom:8px;">👁️ Visible par : ${escapeHtml(r.recipients.join(', '))}</div>` : ''}
        <div style="display:flex;gap:8px;">
          <button class="btn btn-secondary rep-download" data-id="${escapeHtml(r.id)}">⬇️ Télécharger</button>
          ${r.canDelete ? `<button class="btn btn-icon danger rep-delete" data-id="${escapeHtml(r.id)}" title="Supprimer">🗑️</button>` : ''}
        </div>
      </div>`;
    });
    wrap.innerHTML = rows;
    wrap.querySelectorAll('.rep-download').forEach(btn =>
      btn.addEventListener('click', () => downloadReport(btn.getAttribute('data-id'))));
    wrap.querySelectorAll('.rep-delete').forEach(btn =>
      btn.addEventListener('click', () => deleteReportConfirm(btn.getAttribute('data-id'))));
  }

  async function submitReport() {
    const title = ($('rep-title').value || '').trim();
    const description = ($('rep-desc').value || '').trim();
    const fileInput = $('rep-file');
    const file = fileInput && fileInput.files && fileInput.files[0];
    const recipientIds = Array.from(document.querySelectorAll('.rep-recipient-cb:checked')).map(cb => cb.value);

    if (!title) { toast('Titre requis', 'error'); return; }
    if (!file) { toast('Choisis un fichier', 'error'); return; }
    if (file.size > REPORT_MAX_BYTES) { toast('Fichier trop volumineux (max 20 Mo)', 'error'); return; }
    if (!recipientIds.length) { toast('Choisis au moins une personne autorisée à voir ce rapport', 'error'); return; }

    if (!beginSubmit('report')) return;   // ✨ v7.0.1 : anti double-clic
    showLoader('Envoi du rapport…');
    try {
      const b64 = await fileToBase64(file);
      const res = await call('createReport', URL_TOKEN, {
        title, description, fileName: file.name, mimeType: file.type || 'application/octet-stream',
        dataBase64: b64, recipientIds
      });
      if (!res || !res.success) { toast((res && res.error) || "Échec de l'envoi", 'error'); return; }
      toast('✅ Rapport déposé', 'success');
      renderReports();
    } catch (e) {
      toast('Erreur : ' + (e && (e.message || e)), 'error');
    } finally {
      hideLoader();
      endSubmit('report');
    }
  }

  async function downloadReport(id) {
    showLoader('Préparation du téléchargement…');
    try {
      const res = await call('getReportDownloadUrl', URL_TOKEN, id);
      hideLoader();
      if (!res || !res.success) { toast((res && res.error) || 'Échec', 'error'); return; }
      window.open(res.url, '_blank');
    } catch (e) {
      hideLoader();
      toast('Erreur : ' + (e && (e.message || e)), 'error');
    }
  }

  function deleteReportConfirm(id) {
    if (!confirm('Supprimer ce rapport ? Cette action est définitive.')) return;
    (async () => {
      showLoader('Suppression…');
      try {
        const res = await call('deleteReport', URL_TOKEN, id);
        hideLoader();
        if (!res || !res.success) { toast((res && res.error) || 'Échec', 'error'); return; }
        toast('Rapport supprimé', 'success');
        state.reports = state.reports.filter(r => r.id !== id);
        renderReportsList();
      } catch (e) {
        hideLoader();
        toast('Erreur : ' + (e && (e.message || e)), 'error');
      }
    })();
  }

  // ═════════════════════════════════════════════════════════════════
  //  INNOVATION — boîte à idées (✨ v7.0)
  //  Ouvert à tous : chacun dépose, tout le monde lit et commente, seul le
  //  Chef fait avancer le statut.
  // ═════════════════════════════════════════════════════════════════
  const INNO_STATUS_COLORS = {
    'Nouvelle':  '#1a73e8',
    "À l'étude": '#e37400',
    'Retenue':   '#137333',
    'Écartée':   '#5f6368'
  };

  function innoBadge(status) {
    const c = INNO_STATUS_COLORS[status] || '#5f6368';
    return `<span style="background:${c};color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold;white-space:nowrap;">${escapeHtml(status)}</span>`;
  }

  async function renderInnovation() {
    showLoader('Chargement…');
    const res = await call('getInnovations', URL_TOKEN);
    hideLoader();
    if (!res || !res.success) {
      toast((res && res.error) || 'Erreur de chargement des idées', 'error');
      state.innovations = [];
    } else {
      state.innovations = res.innovations || [];
      state.innovationCanSetStatus = !!res.canSetStatus;
      state.innovationStatuses = res.statuses || [];
    }

    const counts = {};
    state.innovations.forEach(i => { counts[i.status] = (counts[i.status] || 0) + 1; });
    const chips = ['', ...(state.innovationStatuses || [])].map(s => {
      const active = state.innovationFilter === s;
      const label = s === '' ? `Toutes (${state.innovations.length})` : `${s} (${counts[s] || 0})`;
      const color = s === '' ? '#5f6368' : (INNO_STATUS_COLORS[s] || '#5f6368');
      return `<button class="inno-chip" data-status="${escapeHtml(s)}"
        style="border:1px solid ${color};background:${active ? color : 'transparent'};
               color:${active ? '#fff' : color};padding:5px 12px;border-radius:14px;
               font-size:12px;cursor:pointer;font-weight:${active ? 'bold' : 'normal'};">
        ${escapeHtml(label)}</button>`;
    }).join('');

    let html = `<div class="page-title">💡 Innovation</div>
                <div class="page-sub">Partagez vos idées pour faire avancer LA TERMITIERE — tout le monde les voit et peut les commenter</div>`;

    html += `<div class="dash-section">
      <h3>💡 Proposer une idée</h3>
      <div class="form-row"><label>Titre *</label>
        <input type="text" id="inno-title" placeholder="Ex. Automatiser le rapport hebdomadaire"></div>
      <div class="form-row"><label>Votre idée *</label>
        <textarea id="inno-desc" rows="3" placeholder="Quel problème ça règle ? Qu'est-ce que ça apporte ?"></textarea></div>
      <div class="form-row"><label>Domaine</label>
        <input type="text" id="inno-cat" placeholder="Optionnel — ex. Production, RH, Digital"></div>
      <button class="btn btn-primary" id="btn-submit-inno" style="margin-top:10px;">Proposer</button>
    </div>`;

    html += `<div class="dash-section">
      <h3>💡 Les idées <span class="count">${state.innovations.length}</span></h3>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">${chips}</div>
      <div id="inno-list"></div>
    </div>`;

    $('main-content').innerHTML = html;
    $('btn-submit-inno').onclick = submitInnovation;
    document.querySelectorAll('.inno-chip').forEach(b =>
      b.addEventListener('click', () => {
        state.innovationFilter = b.getAttribute('data-status');
        renderInnovation();
      }));
    renderInnovationList();
  }

  function renderInnovationList() {
    const wrap = $('inno-list');
    if (!wrap) return;
    const list = state.innovationFilter
      ? state.innovations.filter(i => i.status === state.innovationFilter)
      : state.innovations;

    if (!list.length) {
      wrap.innerHTML = `<div class="empty-state"><div class="icon">💡</div>
        <h4>Aucune idée ${state.innovationFilter ? 'dans ce statut' : 'pour le moment'}</h4>
        <p>Lancez-vous : la première idée est la plus difficile.</p></div>`;
      return;
    }

    wrap.innerHTML = list.map(i => `<div class="dir-card">
      <div class="dir-card-header">
        <div class="dir-avatar">${initials(i.authorName)}</div>
        <div class="dir-card-info">
          <div class="nm">${escapeHtml(i.title)} ${i.isMine ? '<span class="badge badge-role-emp" style="font-size:10px;">Mon idée</span>' : ''}</div>
          <div class="dpt">Par ${escapeHtml(i.authorName)} · ${escapeHtml(i.createdAt)}${i.category ? ' · ' + escapeHtml(i.category) : ''}</div>
        </div>
        <div>${innoBadge(i.status)}</div>
      </div>
      <div style="font-size:13px;color:#3c4043;margin:8px 0;white-space:pre-wrap;">${escapeHtml(i.description)}</div>
      ${i.chefNote ? `<div style="background:#f8f9fa;border-left:4px solid ${INNO_STATUS_COLORS[i.status] || '#5f6368'};padding:10px 14px;margin:8px 0;font-size:13px;">
        <strong>Avis du Chef :</strong> ${escapeHtml(i.chefNote)}</div>` : ''}
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-secondary inno-comments" data-id="${escapeHtml(i.id)}">💬 Commentaires${i.commentsCount ? ' (' + i.commentsCount + ')' : ''}</button>
        ${state.innovationCanSetStatus ? `<button class="btn btn-secondary inno-status" data-id="${escapeHtml(i.id)}">⚖️ Arbitrer</button>` : ''}
        ${i.canDelete ? `<button class="btn btn-icon danger inno-delete" data-id="${escapeHtml(i.id)}" title="Supprimer">🗑️</button>` : ''}
      </div>
    </div>`).join('');

    wrap.querySelectorAll('.inno-comments').forEach(b =>
      b.addEventListener('click', () => openInnovationComments(b.getAttribute('data-id'))));
    wrap.querySelectorAll('.inno-status').forEach(b =>
      b.addEventListener('click', () => openInnovationStatusModal(b.getAttribute('data-id'))));
    wrap.querySelectorAll('.inno-delete').forEach(b =>
      b.addEventListener('click', () => deleteInnovationConfirm(b.getAttribute('data-id'))));
  }

  async function submitInnovation() {
    const title = ($('inno-title').value || '').trim();
    const description = ($('inno-desc').value || '').trim();
    const category = ($('inno-cat').value || '').trim();
    if (!title) { toast('Donnez un titre à votre idée', 'error'); return; }
    if (!description) { toast('Décrivez votre idée', 'error'); return; }

    if (!beginSubmit('innovation')) return;   // ✨ v7.0.2 : anti double-clic
    showLoader('Envoi de votre idée…');
    try {
      const res = await call('addInnovation', URL_TOKEN, { title, description, category });
      hideLoader();
      if (!res || !res.success) { toast((res && res.error) || "Échec de l'envoi", 'error'); return; }
      toast('✅ Idée proposée — merci !', 'success');
      renderInnovation();
    } catch (e) {
      hideLoader(); toast('Erreur : ' + (e.message || e), 'error');
    } finally {
      endSubmit('innovation');
    }
  }

  function openInnovationStatusModal(id) {
    const i = state.innovations.find(x => x.id === id);
    if (!i) return;
    const opts = (state.innovationStatuses || []).map(s =>
      `<option value="${escapeHtml(s)}" ${s === i.status ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('');
    showModal('⚖️ Arbitrer — ' + i.title, `
      <div class="form-row"><label>Statut</label>
        <select id="inno-new-status">${opts}</select></div>
      <div class="form-row"><label>Avis (visible par tous, envoyé à l'auteur)</label>
        <textarea id="inno-new-note" rows="3">${escapeHtml(i.chefNote || '')}</textarea></div>
    `, [
      { label: 'Annuler', class: 'btn-secondary', onClick: closeModal },
      { label: 'Enregistrer', class: 'btn-primary', onClick: async () => {
          const status = $('inno-new-status').value;
          const chefNote = ($('inno-new-note').value || '').trim();
          closeModal();
          showLoader('Enregistrement…');
          try {
            const res = await call('updateInnovation', URL_TOKEN, { id, status, chefNote });
            hideLoader();
            if (!res || !res.success) { toast((res && res.error) || 'Échec', 'error'); return; }
            toast('✅ Idée mise à jour', 'success');
            renderInnovation();
          } catch (e) {
            hideLoader(); toast('Erreur : ' + (e.message || e), 'error');
          }
      }}
    ]);
  }

  function deleteInnovationConfirm(id) {
    if (!confirm('Supprimer cette idée et ses commentaires ? Cette action est définitive.')) return;
    (async () => {
      showLoader('Suppression…');
      try {
        const res = await call('deleteInnovation', URL_TOKEN, id);
        hideLoader();
        if (!res || !res.success) { toast((res && res.error) || 'Échec', 'error'); return; }
        toast('Idée supprimée', 'success');
        state.innovations = state.innovations.filter(i => i.id !== id);
        renderInnovationList();
      } catch (e) {
        hideLoader(); toast('Erreur : ' + (e.message || e), 'error');
      }
    })();
  }

  async function openInnovationComments(id) {
    const i = state.innovations.find(x => x.id === id);
    if (!i) return;
    showLoader('Chargement des commentaires…');
    const res = await call('getInnovationComments', URL_TOKEN, id);
    hideLoader();
    if (!res || !res.success) { toast((res && res.error) || 'Échec', 'error'); return; }

    const comments = res.comments || [];
    const body = `
      <div id="inno-cmt-list" style="max-height:280px;overflow:auto;margin-bottom:12px;">
        ${comments.length ? comments.map(c => `
          <div style="border-bottom:1px solid #e8eaed;padding:8px 0;">
            <div style="font-size:12px;color:#5f6368;display:flex;justify-content:space-between;gap:8px;">
              <strong>${escapeHtml(c.author)}</strong><span>${escapeHtml(c.date)}</span>
            </div>
            <div style="font-size:13px;color:#3c4043;white-space:pre-wrap;">${escapeHtml(c.text)}</div>
            ${c.canDelete ? `<button class="btn btn-icon danger inno-cmt-del" data-id="${escapeHtml(c.id)}"
                              style="font-size:11px;margin-top:4px;" title="Supprimer">🗑️</button>` : ''}
          </div>`).join('')
          : '<div class="hint">Aucun commentaire — soyez le premier à réagir.</div>'}
      </div>
      <div class="form-row">
        <label>Votre commentaire</label>
        <textarea id="inno-cmt-text" rows="2" placeholder="Réagissez à cette idée…"></textarea>
      </div>`;

    showModal('💬 ' + i.title, body, [
      { label: 'Fermer', class: 'btn-secondary', onClick: closeModal },
      { label: 'Publier', class: 'btn-primary', onClick: async () => {
          const text = ($('inno-cmt-text').value || '').trim();
          if (!text) { toast('Commentaire vide', 'error'); return; }
          showLoader('Publication…');
          try {
            const r = await call('postInnovationComment', URL_TOKEN, id, text);
            hideLoader();
            if (!r || !r.success) { toast((r && r.error) || 'Échec', 'error'); return; }
            i.commentsCount = Number(i.commentsCount || 0) + 1;
            closeModal();
            renderInnovationList();
            toast('✅ Commentaire publié', 'success');
          } catch (e) {
            hideLoader(); toast('Erreur : ' + (e.message || e), 'error');
          }
      }}
    ]);

    document.querySelectorAll('.inno-cmt-del').forEach(b =>
      b.addEventListener('click', async () => {
        if (!confirm('Supprimer ce commentaire ?')) return;
        const r = await call('deleteInnovationComment', URL_TOKEN, b.getAttribute('data-id'));
        if (!r || !r.success) { toast((r && r.error) || 'Échec', 'error'); return; }
        i.commentsCount = Math.max(0, Number(i.commentsCount || 0) - 1);
        closeModal();
        renderInnovationList();
        toast('Commentaire supprimé', 'success');
      }));
  }

  // ═════════════════════════════════════════════════════════════════
  //  EXPOSER LES FONCTIONS POUR onclick=…
  // ═════════════════════════════════════════════════════════════════
  window.openNewTaskModal    = openNewTaskModal;
  window.openEditTaskModal   = openEditTaskModal;
  window.openEditCommentModal= openEditCommentModal;
  window.openChefCommentModal= openChefCommentModal;
  window.viewCommentPopup    = viewCommentPopup;
  window.viewAppreciationPopup = viewAppreciationPopup;
  window.confirmDeleteTask   = confirmDeleteTask;
  window.updateTaskField     = updateTaskField;
  window.openEmployeeModal   = openEmployeeModal;
  window.showAccessLink      = showAccessLink;
  window.confirmDeactivate   = confirmDeactivate;
  window.copyToClipboard     = copyToClipboard;
  window.closeModal          = closeModal;
  window.openDetail          = openDetail;
  window.closeDetailDrawer   = closeDetailDrawer;
  window.openEmpDetail       = openEmpDetail;
  window.openDirDetail       = openDirDetail;
  window.openPerDirSummaryDetail = openPerDirSummaryDetail;
  // ✨ v5.5
  window.openChatModal       = openChatModal;
  window.closeChatModal      = closeChatModal;
  window.sendChatMessage     = sendChatMessage;
  window.deleteChatMessage   = deleteChatMessage;
  window.openNewTeamTaskModal = openNewTeamTaskModal;
  window.switchTeamMode      = switchTeamMode;
  window.onTeamDeptChange    = onTeamDeptChange;
  window.onTeamMemberToggle  = onTeamMemberToggle;
  window.openNewObjectifModal = openNewObjectifModal;
  window.openEditObjectifModal = openEditObjectifModal;
  window.confirmDeleteObjectif = confirmDeleteObjectif;
  // ✨ v6.0
  window.openObjectifDetailModal = openObjectifDetailModal;
  window.sendObjectifComment = sendObjectifComment;
  window.deleteObjComment = deleteObjComment;
  window.openTeamTaskMembersDetail = openTeamTaskMembersDetail;
  window.updateMemberSubStatus = updateMemberSubStatus;
  window.openMemberReportModal = openMemberReportModal;
  window.saveMemberReportLink = saveMemberReportLink;
  window.openReportLinkModal = openReportLinkModal;
  window.saveReportLink = saveReportLink;
  window.setTab = setTab;
  window.refreshTeamLeaderDropdown = refreshTeamLeaderDropdown;
  window.forceRefresh = forceRefresh;
  window.openTaskDetail      = openTaskDetail;
  window.closeTdc            = closeTdc;
  window.deleteAttachmentNow = deleteAttachmentNow;
  window.openRejectTaskModal = openRejectTaskModal;
  window.gotoPage            = gotoPage;
  window.filterEmpDetail     = filterEmpDetail;
  window.renderEmpDetailTable = renderEmpDetailTable;
  window.openChangeRecipientModal = openChangeRecipientModal;
  window.openReturnTaskModal      = openReturnTaskModal;
  // ✨ v6.7 : routine journalière
  window.toggleDaily          = toggleDaily;
  window.openManageDailyModal = openManageDailyModal;
  window.addDailyNow          = addDailyNow;
  window.archiveDailyNow      = archiveDailyNow;
  window.openDailyDetail      = openDailyDetail;
  window.openArchiveDetail    = openArchiveDetail;


  // ═════════════════════════════════════════════════════════════════
  //  START
  // ═════════════════════════════════════════════════════════════════
  window.addEventListener('DOMContentLoaded', bootstrap);
</script>
