  // ═════════════════════════════════════════════════════════════════
  //  ✨ v5.5 : MESSAGERIE PAR TÂCHE (CHAT)
  // ═════════════════════════════════════════════════════════════════
  let chatCurrentTaskId = null;
  let chatCurrentMessages = [];
  let chatPollingTimer = null;

  async function openChatModal(taskId) {
    const t = state.tasks.find(x => x.id === taskId);
    if (!t) return;
    chatCurrentTaskId = taskId;
    chatCurrentMessages = [];

    const title = t.groupId
      ? `💬 Chat — ${taskId} (groupe ${t.groupId})`
      : `💬 Chat — ${taskId}`;

    showModal(title, `
      <div class="form-row">
        <label>Tâche</label>
        <div style="background:#f8f9fa;padding:10px;border-radius:4px;font-size:13px;">${escapeHtml(t.description)}</div>
        ${t.groupId ? `<div style="margin-top:6px;font-size:11px;color:#137333;">👥 Ce chat est partagé avec tous les membres du groupe ${t.groupId}.</div>` : ''}
      </div>
      <div id="chat-container" class="chat-container">
        <div class="chat-empty">Chargement…</div>
      </div>
      <div class="chat-form">
        <textarea id="chat-input" placeholder="Écrire un message…" maxlength="2000"></textarea>
        <button class="btn btn-primary" onclick="sendChatMessage()">📤 Envoyer</button>
      </div>
    `, [{ label: 'Fermer', class: 'btn-secondary', onClick: closeChatModal }]);

    await loadChatMessages();

    // Polling toutes les 15 secondes pour recevoir nouveaux messages
    if (chatPollingTimer) clearInterval(chatPollingTimer);
    chatPollingTimer = setInterval(() => {
      if (chatCurrentTaskId) loadChatMessages(true);
    }, 15000);

    // Entrée pour envoyer (Shift+Entrée pour saut de ligne)
    setTimeout(() => {
      const input = $('chat-input');
      if (input) {
        input.focus();
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendChatMessage();
          }
        });
      }
    }, 100);
  }

  function closeChatModal() {
    if (chatPollingTimer) { clearInterval(chatPollingTimer); chatPollingTimer = null; }
    chatCurrentTaskId = null;
    chatCurrentMessages = [];
    closeModal();
  }

  async function loadChatMessages(silent) {
    if (!chatCurrentTaskId) return;
    try {
      const res = await call('getTaskMessages', URL_TOKEN, chatCurrentTaskId);
      if (!res.success) {
        if (!silent) toast(res.error || 'Erreur', 'error');
        return;
      }
      chatCurrentMessages = res.messages || [];
      renderChatMessages();
    } catch (e) {
      if (!silent) toast('Erreur : ' + (e.message || e), 'error');
    }
  }

  function renderChatMessages() {
    const container = $('chat-container');
    if (!container) return;

    if (chatCurrentMessages.length === 0) {
      container.innerHTML = '<div class="chat-empty">Aucun message pour le moment. Soyez le premier à écrire !</div>';
      return;
    }

    const me = state.user.name;
    const isChef = state.user.role === 'chef';

    let html = '';
    chatCurrentMessages.forEach(m => {
      const isOwn = m.author === me;
      const canDelete = isOwn || isChef;
      const dateShort = m.date ? m.date.substring(5, 16).replace('T', ' ') : '';

      html += `<div class="chat-message ${isOwn ? 'own' : ''}">
        ${canDelete ? `<div class="chat-message-actions"><button onclick="deleteChatMessage('${escapeHtml(m.id)}')" title="Supprimer">🗑</button></div>` : ''}
        <div class="chat-message-header">
          <span class="chat-message-author">${escapeHtml(m.author)}</span>
          <span class="chat-message-date">${escapeHtml(dateShort)}</span>
        </div>
        <div class="chat-message-text">${escapeHtml(m.message)}</div>
      </div>`;
    });
    container.innerHTML = html;

    // Scroll automatique vers le bas
    container.scrollTop = container.scrollHeight;
  }

  async function sendChatMessage() {
    const input = $('chat-input');
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;

    input.disabled = true;
    try {
      const res = await call('postTaskMessage', URL_TOKEN, chatCurrentTaskId, text);
      if (!res.success) {
        toast(res.error || 'Erreur', 'error');
        input.disabled = false;
        return;
      }
      input.value = '';
      input.disabled = false;
      input.focus();
      // Ajouter le message localement pour affichage immédiat
      chatCurrentMessages.push(res.message);
      renderChatMessages();

      // Mettre à jour le compteur dans state.tasks
      const t = state.tasks.find(x => x.id === chatCurrentTaskId);
      if (t) t.messagesCount = (t.messagesCount || 0) + 1;
    } catch (e) {
      input.disabled = false;
      toast('Erreur : ' + (e.message || e), 'error');
    }
  }

  async function deleteChatMessage(messageId) {
    if (!confirm('Supprimer ce message ?')) return;
    try {
      const res = await call('deleteTaskMessage', URL_TOKEN, messageId);
      if (!res.success) { toast(res.error || 'Erreur', 'error'); return; }
      chatCurrentMessages = chatCurrentMessages.filter(m => m.id !== messageId);
      renderChatMessages();
      const t = state.tasks.find(x => x.id === chatCurrentTaskId);
      if (t) t.messagesCount = Math.max(0, (t.messagesCount || 1) - 1);
      toast('✅ Message supprimé', 'success');
    } catch (e) {
      toast('Erreur : ' + (e.message || e), 'error');
    }
  }

  function switchTeamMode(mode) {
    teamModalMode = mode;

  function renderTeamModeContent() {
    const wrap = $('team-mode-content');
    if (!wrap) return;
    const me = state.user.name;

    if (teamModalMode === 'department') {
      const depts = window._teamDepts || [];
      wrap.innerHTML = `
        <div class="form-row">
          <label>Département *</label>
          <select id="tm-dept" onchange="onTeamDeptChange(this.value)">

    } else {
      // Mode custom : liste de cases à cocher
      const candidates = state.personnel
        .filter(p => p.status !== 'Inactif')
        .sort((a, b) => {
          if (a.name === me) return -1;
          if (b.name === me) return 1;
          return a.name.localeCompare(b.name);
        });

      wrap.innerHTML = `
        <div class="form-row">
          <label>Membres de l'équipe * (au moins 2 personnes)</label>

              </label>`;
            }).join('')}
          </div>
        </div>`;

            const matches = !q || el.dataset.name.includes(q) || el.dataset.dept.includes(q);

  function onTeamDeptChange(value) {
    teamSelectedDept = value;
    if (!value) { teamSelectedMembers = []; renderTeamSummary(); return; }
    // Pré-calculer les membres du département
    teamSelectedMembers = state.personnel
      .filter(p => p.status !== 'Inactif' && p.dept && p.dept.toLowerCase() === value.toLowerCase())
      .map(p => p.name);
    renderTeamSummary();
  }

  function onTeamMemberToggle(input) {
    const name = input.value;
    if (input.checked) {
      if (!teamSelectedMembers.includes(name)) teamSelectedMembers.push(name);
    } else {
      teamSelectedMembers = teamSelectedMembers.filter(n => n !== name);
    }
    renderTeamSummary();
  }

  function renderTeamSummary() {
    const wrap = $('team-summary-wrap');
    if (!wrap) return;
    // ✨ v6.0 : MAJ aussi le dropdown chef de groupe
    refreshTeamLeaderDropdown();
    if (teamSelectedMembers.length === 0) { wrap.innerHTML = ''; return; }
    const list = teamSelectedMembers.slice(0, 10).join(', ');
    const more = teamSelectedMembers.length > 10 ? `, et ${teamSelectedMembers.length - 10} autres` : '';
    wrap.innerHTML = `<div class="team-summary">
      <strong>👥 ${teamSelectedMembers.length} membre${teamSelectedMembers.length > 1 ? 's' : ''}</strong>

      <span style="font-size:12px;">${escapeHtml(list)}${more}</span>

  }

  // ✨ v6.0 : met à jour la liste déroulante du chef de groupe
  function refreshTeamLeaderDropdown() {
    const leaderSel = $('tm-leader');
    if (!leaderSel) return;
    const prevValue = leaderSel.value;
    if (teamSelectedMembers.length === 0) {
      leaderSel.innerHTML = '<option value="">— D\'abord sélectionner les membres —</option>';
      return;
    }
    const me = state.user.name;
    leaderSel.innerHTML = '<option value="">— Choisir un chef de groupe —</option>'
      + teamSelectedMembers.map(name => {
          const sel = name === prevValue ? 'selected' : '';
          const tag = name === me ? ' (moi-même)' : '';
          return `<option value="${escapeHtml(name)}" ${sel}>${escapeHtml(name)}${tag}</option>`;
        }).join('');
    // Si aucun chef sélectionné mais on est dans la liste, se proposer par défaut
    if (!prevValue && teamSelectedMembers.includes(me)) {
      leaderSel.value = me;
    }
  }

  async function submitTeamTask() {
    const description = $('tm-desc').value.trim();
    const dateLimit = $('tm-date').value;
    const dateStart = $('tm-datestart').value;
    const leaderName = $('tm-leader').value;
    const reportRequired = $('tm-report-required').checked;

    if (!description || !dateLimit) {
      toast('Description et date limite obligatoires.', 'error');
      return;
    }
    if (teamModalMode === 'department' && !teamSelectedDept) {
      toast('Veuillez sélectionner un département.', 'error');
      return;
    }
    if (teamModalMode === 'custom' && teamSelectedMembers.length < 2) {
      toast('Sélectionnez au moins 2 membres.', 'error');
      return;
    }
    if (!leaderName) {
      toast('Veuillez désigner un chef de groupe.', 'error');
      return;
    }
    if (!teamSelectedMembers.includes(leaderName)) {
      toast('Le chef de groupe doit faire partie de l\'équipe.', 'error');
      return;
    }

    const payload = {
      mode: teamModalMode,
      description: description,
      expectedResult: $('tm-expected').value.trim(),   // ✨ v6.7
      dateLimit: dateLimit,
      dateStart: dateStart,
      priority: $('tm-prio').value,
      category: $('tm-cat').value.trim(),
      chefNote: $('tm-note').value.trim(),
      leaderName: leaderName,
      reportRequired: reportRequired
    };
    if (teamModalMode === 'department') {
      payload.department = teamSelectedDept;
    } else {
      payload.memberNames = teamSelectedMembers;
    }

    // ✨ v7.0.1 : la modale reste ouverte en cas d'erreur — sans ce verrou, un
    // second clic recréait la tâche (doublons observés en production).
    if (!beginSubmit('team')) return;
    showLoader('Création de la tâche d\'équipe…');
    try {
      const r = await call('addTaskTeam', URL_TOKEN, payload);
      hideLoader();
      if (!r.success) { toast(r.error || 'Erreur', 'error'); return; }
      toast(`✅ Tâche ${r.id} créée pour ${r.memberCount} membres (groupe ${r.groupId})`, 'success');
      closeModal();
      await loadTasks(true);
      renderTasksTable();
    } catch (e) {
      hideLoader(); toast('Erreur : ' + (e.message || e), 'error');
    } finally {
      endSubmit('team');
    }
  }

  function renderObjectifsContent() {
    const me = state.user.name;
    const role = state.user.role;
    const filterType = $('obj-filter-type').value;
    const filterStatus = $('obj-filter-status').value;

    let list = state.objectifs.slice();
    if (filterType)   list = list.filter(o => o.type === filterType);
    if (filterStatus) list = list.filter(o => o.status === filterStatus);

    // ✨ v6.0 : filtre par période (sur les dates de début/fin de l'objectif)
    const period = state.periods && state.periods.objectifs;
    if (period && period.mode !== 'all') {
      const bounds = getPeriodBounds(period);
      if (bounds.from || bounds.to) {
        list = list.filter(o => {
          // Un objectif est dans la période s'il chevauche [from, to]
          const oStart = o.dateStart || '0000-00-00';
          const oEnd = o.dateEnd || '9999-12-31';
          if (bounds.from && oEnd < bounds.from) return false;
          if (bounds.to && oStart > bounds.to) return false;
          return true;
        });
      }
    }

    const infoEl = $('ps-info-objectifs');
    if (infoEl) infoEl.textContent = `${list.length} objectif${list.length > 1 ? 's' : ''}`;

    // ✨ v6.0 : Mini-dashboard
    const dashHtml = buildObjectifsDashboard(list);
    $('obj-dashboard').innerHTML = dashHtml;

    if (!list.length) {
      $('obj-content').innerHTML = `<div class="empty-state">
        <div class="icon">🎯</div><h4>Aucun objectif</h4>
        <p>Commencez par créer votre premier objectif.</p>
      </div>`;
      return;
    }

    // ✨ Affichage = liste de noms (personnes / départements), pas de cartes en
    // vrac. On clique sur un nom pour voir le mini tableau de bord de ses
    // objectifs sur la période sélectionnée.
    const byTarget = {};
    list.forEach(o => { (byTarget[o.target] = byTarget[o.target] || []).push(o); });
    const targets = Object.keys(byTarget).sort((a, b) => {
      if (a === me) return -1;
      if (b === me) return 1;
      return a.localeCompare(b);
    });
    window._objByTarget = byTarget;

    let html = `<div class="dash-section">
      <div class="table-wrap" style="border:none;"><table>
        <thead><tr>
          <th>Nom</th><th>Type</th><th>Total</th><th>Atteints</th><th>En cours</th><th>Progression moy.</th>
        </tr></thead><tbody>
          ${targets.map(t => {
            const items = byTarget[t];
            const isDept = items[0].type === 'dept';
            const atteint = items.filter(o => o.status === 'Atteint').length;
            const enCours = items.filter(o => o.status === 'En cours').length;
            const avg = Math.round(items.reduce((s, o) => s + (o.progress || 0), 0) / items.length);
            return `<tr style="cursor:pointer;" class="obj-target-row" data-target="${escapeHtml(t)}">
              <td data-label="Nom"><strong>${isDept ? '🏢 ' : '👤 '}${escapeHtml(t)}${t === me ? ' (moi)' : ''}</strong></td>
              <td data-label="Type">${isDept ? 'Département' : 'Personnel'}</td>
              <td data-label="Total">${items.length}</td>
              <td data-label="Atteints"><span class="evo-cell ok">${atteint}</span></td>
              <td data-label="En cours"><span class="evo-cell info">${enCours}</span></td>
              <td data-label="Progression moy."><strong>${avg}%</strong></td>
            </tr>`;
          }).join('')}
        </tbody></table></div>
    </div>`;
    $('obj-content').innerHTML = html;

    $('obj-content').querySelectorAll('.obj-target-row').forEach(row => {
      row.addEventListener('click', () => openObjectifsByTarget(row.getAttribute('data-target')));
    });
  }

  // ✨ Détail des objectifs d'une personne ou d'un département (clic depuis la
  // liste) : mini tableau de bord (KPIs) + le détail de chaque objectif.
  function openObjectifsByTarget(target) {
    const items = (window._objByTarget && window._objByTarget[target]) || [];
    if (!items.length) return;
    const isDept = items[0].type === 'dept';
    const body = buildObjectifsDashboard(items) + `<div class="obj-grid" style="margin-top:12px;">${items.map(buildObjectifCard).join('')}</div>`;
    showModal((isDept ? '🏢 ' : '👤 ') + target, body, [
      { label: 'Fermer', class: 'btn-primary', onClick: closeModal }
    ]);
  }

  // ✨ v6.0 : mini-dashboard pour les objectifs filtrés
  function buildObjectifsDashboard(list) {
    if (!list.length) return '';
    const total = list.length;
    const atteint = list.filter(o => o.status === 'Atteint').length;
    const enCours = list.filter(o => o.status === 'En cours').length;
    const echec = list.filter(o => o.status === 'Échec').length;
    const today = todayStr();
    const enRetard = list.filter(o => o.status === 'En cours' && o.dateEnd && o.dateEnd < today).length;
    const avgProgress = total ? Math.round(list.reduce((s,o) => s + (o.progress || 0), 0) / total) : 0;
    const successRate = total ? Math.round(atteint * 100 / total) : 0;

    return `<div class="obj-dashboard">
      ${kpiCardSimple('Total', total, '', '')}
      ${kpiCardSimple('Atteints', atteint, successRate + '%', successRate >= 50 ? 'ok' : (successRate >= 25 ? 'warn' : 'danger'))}
      ${kpiCardSimple('En cours', enCours, '', '')}
      ${kpiCardSimple('Échec', echec, '', echec > 0 ? 'danger' : '')}
      ${kpiCardSimple('En retard', enRetard, '', enRetard > 0 ? 'danger' : 'ok')}
      ${kpiCardSimple('Progression moy.', avgProgress + '%', '', avgProgress >= 60 ? 'ok' : 'warn')}
    </div>`;
  }

  function buildObjectifCard(o) {
    const typeLabel = o.type === 'perso' ? '📌 Perso' : '🏢 Dépt';
    const statusKey = (o.status || 'En cours')
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/\s/g, '');
    const today = todayStr();
    const isExpired = o.dateEnd && o.dateEnd < today && o.status === 'En cours';
    return `<div class="obj-card type-${o.type}" onclick="openObjectifDetailModal('${escapeHtml(o.id)}')">
      <div class="obj-type-badge">${typeLabel}</div>
      <div class="obj-title">${escapeHtml(o.title)}</div>
      <div class="obj-target">${o.type === 'perso' ? '👤 ' : '🏢 '} ${escapeHtml(o.target)}</div>
      ${o.description ? `<div class="obj-desc">${escapeHtml(o.description)}</div>` : ''}
      <div class="obj-progress-wrap">
        <div class="obj-progress-fill ${o.progress >= 100 ? 'full' : ''}" style="width:${o.progress}%"></div>
      </div>
      <div class="obj-meta">
        <span><strong>${o.progress}%</strong></span>
        <span class="obj-status-badge obj-status-${statusKey}">${escapeHtml(o.status)}</span>
      </div>
      <div class="obj-dates">📅 ${escapeHtml(o.dateStart)} → ${escapeHtml(o.dateEnd)}${isExpired ? ' <span style="color:#c5221f;font-weight:600;">⚠ Échéance dépassée</span>' : ''}</div>
      <div class="obj-actions">
        <button class="btn btn-icon" onclick="event.stopPropagation();openObjectifDetailModal('${escapeHtml(o.id)}')" title="Voir détails">👁</button>
        ${o.canEdit ? `<button class="btn btn-icon" onclick="event.stopPropagation();openEditObjectifModal('${escapeHtml(o.id)}')" title="Modifier">✏️</button>` : ''}
        ${o.canEdit ? `<button class="btn btn-icon danger" onclick="event.stopPropagation();confirmDeleteObjectif('${escapeHtml(o.id)}')" title="Supprimer">🗑️</button>` : ''}
      </div>
    </div>`;
  }

  async function openNewObjectifModal() {
    if (!state.personnel.length) {
      showLoader('Chargement…');
      const r = await call('getPersonnel', URL_TOKEN);
      if (r.success) state.personnel = r.personnel || [];
      hideLoader();
    }
    showObjectifModal(null);
  }

  async function openEditObjectifModal(objId) {
    const o = state.objectifs.find(x => x.id === objId);
    if (!o) return;
    if (!state.personnel.length) {
      showLoader('Chargement…');
      const r = await call('getPersonnel', URL_TOKEN);
      if (r.success) state.personnel = r.personnel || [];
      hideLoader();
    }
    showObjectifModal(o);
  }

  function showObjectifModal(existing) {
    const isEdit = !!existing;
    const role = state.user.role;
    const me = state.user.name;
    const myDept = state.user.dept || '';

    // Quels types l'utilisateur peut-il créer ?
    const canCreateDept = role !== 'emp';

    // Pour cible "perso" : qui peut être ciblé ?
    let personOptions = [];
    if (role === 'chef' || role === 'rh') {
      personOptions = state.personnel.filter(p => p.status !== 'Inactif');
    } else if (role === 'dir' || role === 'dept_head') {
      personOptions = state.personnel.filter(p =>
        p.status !== 'Inactif' &&
        (p.name === me || (p.dept && p.dept.toLowerCase() === myDept.toLowerCase()))
      );
    } else {
      personOptions = state.personnel.filter(p => p.name === me);
    }
    personOptions.sort((a,b) => a.name === me ? -1 : (b.name === me ? 1 : a.name.localeCompare(b.name)));

    // Pour cible "dept" : quels départements ?
    let deptOptions = [];
    if (role === 'chef' || role === 'rh') {
      const set = new Set();
      state.personnel.forEach(p => { if (p.dept && p.status !== 'Inactif') set.add(p.dept); });
      deptOptions = Array.from(set).sort();
    } else if ((role === 'dir' || role === 'dept_head') && myDept) {
      deptOptions = [myDept];
    }

    const currentType = isEdit ? existing.type : 'perso';

    showModal(isEdit ? `✏️ Modifier l'objectif ${existing.id}` : '🎯 Nouvel objectif', `
      <div class="form-row">
        <label>Type d'objectif *</label>
        <select id="obj-type" ${isEdit ? 'disabled' : ''}>
          <option value="perso" ${currentType === 'perso' ? 'selected' : ''}>📌 Objectif personnel</option>
          ${canCreateDept ? `<option value="dept" ${currentType === 'dept' ? 'selected' : ''}>🏢 Objectif de département</option>` : ''}
        </select>
      </div>
      <div class="form-row" id="obj-target-wrap">
        <!-- Rempli par updateObjTarget -->
      </div>
      <div class="form-row">
        <label>Titre *</label>
        <input type="text" id="obj-title" placeholder="Ex: Augmenter le CA de 15%" value="${isEdit ? escapeHtml(existing.title) : ''}">
      </div>
      <div class="form-row">
        <label>Description</label>
        <textarea id="obj-desc" placeholder="Détaillez l'objectif, les indicateurs de succès…">${isEdit ? escapeHtml(existing.description) : ''}</textarea>
      </div>
      <div class="form-row two-cols">
        <div><label>Date début *</label><input type="date" id="obj-datestart" value="${isEdit ? existing.dateStart : todayStr()}"></div>
        <div><label>Date fin *</label><input type="date" id="obj-dateend" value="${isEdit ? existing.dateEnd : ''}"></div>
      </div>
      <div class="form-row two-cols">
        <div><label>Avancement (%)</label><input type="number" id="obj-progress" min="0" max="100" value="${isEdit ? existing.progress : 0}"></div>
        <div><label>Statut</label>
          <select id="obj-status">
            <option ${isEdit && existing.status==='En cours'?'selected':''}>En cours</option>
            <option ${isEdit && existing.status==='Atteint'?'selected':''}>Atteint</option>
            <option ${isEdit && existing.status==='Échec'?'selected':''}>Échec</option>
            <option ${isEdit && existing.status==='Abandonné'?'selected':''}>Abandonné</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <label>Commentaire / Note de suivi</label>
        <textarea id="obj-comment" placeholder="Comment ça avance ? Quels obstacles ?">${isEdit ? escapeHtml(existing.comment) : ''}</textarea>
      </div>
    `, [
      { label: 'Annuler', class: 'btn-secondary', onClick: closeModal },
      { label: isEdit ? 'Enregistrer' : 'Créer', class: 'btn-primary',
        onClick: () => submitObjectif(isEdit ? existing.id : null) }
    ]);

    // Stocker pour réutilisation
    window._objPersonOpts = personOptions;
    window._objDeptOpts = deptOptions;
    window._objExisting = existing;

    const typeSel = $('obj-type');
    typeSel.onchange = () => updateObjTarget(typeSel.value);
    updateObjTarget(currentType);
  }

  function updateObjTarget(type) {
    const wrap = $('obj-target-wrap');
    if (!wrap) return;
    const existing = window._objExisting;
    const me = state.user.name;
    const myDept = state.user.dept || '';

    if (type === 'perso') {
      const opts = window._objPersonOpts || [];
      wrap.innerHTML = `<label>Cible (employé) *</label>
        <select id="obj-target">
          ${opts.map(p => {
            const sel = existing && existing.target === p.name ? 'selected' : (!existing && p.name === me ? 'selected' : '');
            const tag = p.name === me ? ' (moi-même)' : '';
            return `<option value="${escapeHtml(p.name)}" ${sel}>${escapeHtml(p.name)}${tag}</option>`;
          }).join('')}
        </select>`;
    } else {
      const opts = window._objDeptOpts || [];
      wrap.innerHTML = `<label>Cible (département) *</label>
        <select id="obj-target">
          ${opts.map(d => {
            const sel = existing && existing.target === d ? 'selected' : (!existing && d === myDept ? 'selected' : '');
            return `<option value="${escapeHtml(d)}" ${sel}>${escapeHtml(d)}</option>`;
          }).join('')}
        </select>`;
    }
  }

  async function submitObjectif(objId) {
    const payload = {
      type: $('obj-type').value,
      target: $('obj-target').value,
      title: $('obj-title').value.trim(),
      description: $('obj-desc').value.trim(),
      dateStart: $('obj-datestart').value,
      dateEnd: $('obj-dateend').value,
      progress: Number($('obj-progress').value) || 0,
      status: $('obj-status').value,
      comment: $('obj-comment').value.trim()
    };
    if (!payload.title || !payload.dateStart || !payload.dateEnd) {
      toast('Titre, dates début et fin obligatoires.', 'error');
      return;
    }
    if (!payload.target) {
      toast('Veuillez sélectionner une cible.', 'error');
      return;
    }
    showLoader(objId ? 'Mise à jour…' : 'Création…');
    try {
      const r = objId
        ? await call('updateObjectif', URL_TOKEN, { id: objId, ...payload })
        : await call('addObjectif', URL_TOKEN, payload);
      hideLoader();
      if (!r.success) { toast(r.error || 'Erreur', 'error'); return; }
      toast(objId ? '✅ Objectif mis à jour' : '✅ Objectif créé', 'success');
      closeModal();
      state.loaded.objectifs = 0;   // ✨ v6.3 : invalider le cache après mutation
      renderObjectifs();
    } catch (e) {
      hideLoader(); toast('Erreur : ' + (e.message || e), 'error');
    }
  }

  function confirmDeleteObjectif(objId) {
    if (!confirm('Supprimer définitivement cet objectif ?')) return;
    deleteObjectifNow(objId);
  }
  async function deleteObjectifNow(objId) {
    showLoader('Suppression…');
    try {
      const r = await call('deleteObjectif', URL_TOKEN, objId);
      hideLoader();
      if (!r.success) { toast(r.error || 'Erreur', 'error'); return; }
      toast('✅ Objectif supprimé', 'success');
      state.loaded.objectifs = 0;   // ✨ v6.3 : invalider le cache après mutation
      renderObjectifs();
    } catch (e) {
      hideLoader(); toast('Erreur : ' + (e.message || e), 'error');
    }
  }

  let _archSearchTimer = null;

                <div class="page-sub">Tâches terminées archivées (plus d'un mois). Consultation en lecture seule.</div>
      <div class="toolbar">
        <input type="text" id="arch-search" class="filter-sel" style="min-width:240px;flex:1;"
               placeholder="🔍 Rechercher (description, destinataire, ID…)">
        <span class="grow"></span>
        <span class="period-info" id="arch-info"></span>
      </div>
      <div id="arch-content"></div>`;
    $('main-content').innerHTML = html;

    $('arch-search').oninput = (e) => {
      const q = e.target.value;
      clearTimeout(_archSearchTimer);
      _archSearchTimer = setTimeout(() => loadArchives(q), 350);
    };
    loadArchives('');
  }

  async function loadArchives(q) {
    $('arch-content').innerHTML = `<div class="empty-state"><div class="icon">⏳</div><p>Chargement des archives…</p></div>`;

        <div class="icon">🗄️</div><h4>Aucune archive</h4>

      ${row('Département', escapeHtml(t.department))}
      ${row('Catégorie', escapeHtml(t.category))}
      ${row('Priorité', escapeHtml(t.priority))}
      ${row('Statut', escapeHtml(t.status))}
      ${row('Assignée le', escapeHtml(t.dateAssigned))}
      ${row('Échéance', escapeHtml(t.dateLimit))}
      ${row('Clôturée le', escapeHtml(t.closeDate))}

  // ═════════════════════════════════════════════════════════════════
  //  ✨ v6.7 : ROUTINE JOURNALIÈRE (TÂCHES QUOTIDIENNES)
  // ═════════════════════════════════════════════════════════════════
  function canSeeDailyTeam() {
    return ['chef', 'rh', 'dir', 'dept_head'].includes(state.user.role);
  }

  async function loadDaily(force) {
    if (!force && state.daily !== null && cacheFresh('daily')) return true;
    const res = await call('getDailyTasks', URL_TOKEN);
    if (!res || !res.success) { state.daily = state.daily || { date: todayStr(), tasks: [] }; return false; }
    state.daily = { date: res.date, tasks: res.tasks || [], isSelf: true, canManage: true };
    state.loaded.daily = Date.now();
    return true;
  }

  async function renderDaily() {
    if (!(state.daily !== null && cacheFresh('daily'))) {
      showLoader('Chargement de la routine…');
      await loadDaily();
      hideLoader();
    }

    let html = `<div class="page-title">🔁 Routine journalière</div>
                <div class="page-sub">Vos tâches récurrentes du jour — cochez-les au fur et à mesure. La liste réapparaît vierge chaque matin.</div>`;

    if (canSeeDailyTeam()) {
      html += `<div class="daily-modes">
        <button class="dm-btn ${state.dailyMode==='mine'?'active':''}" id="dm-mine">📋 Ma routine</button>
        <button class="dm-btn ${state.dailyMode==='team'?'active':''}" id="dm-team">📊 Suivi de l'équipe</button>
      </div>`;
    }
    html += `<div id="daily-body"></div>`;
    $('main-content').innerHTML = html;

    if (canSeeDailyTeam()) {
      $('dm-mine').onclick = () => { state.dailyMode = 'mine'; renderDaily(); };
      $('dm-team').onclick = () => { state.dailyMode = 'team'; renderDaily(); };
    }

    if (state.dailyMode === 'team' && canSeeDailyTeam()) {
      renderDailyCompliance();
    } else {
      renderDailyMine();
    }
  }

  function renderDailyMine() {
    const data = state.daily || { tasks: [] };
    const tasks = data.tasks || [];
    const total = tasks.length;
    const done = tasks.filter(t => t.done).length;
    const pct = total ? Math.round(done * 100 / total) : 0;

    let html = `<div class="daily-toolbar">
      <div class="daily-progress-block">
        <div class="daily-progress-head">
          <span>Aujourd'hui — <strong>${done}/${total}</strong> faite${done>1?'s':''}</span>
          <span class="daily-pct ${pct===100&&total?'full':''}">${pct}%</span>
        </div>
        <div class="daily-progress-wrap"><div class="daily-progress-fill ${pct===100&&total?'full':''}" style="width:${pct}%"></div></div>
      </div>
      <button class="btn btn-primary" onclick="openManageDailyModal()">⚙️ Gérer mes tâches</button>
    </div>`;

    if (!total) {
      html += `<div class="empty-state">
        <div class="icon">🔁</div><h4>Aucune tâche journalière</h4>
        <p>Définissez votre routine quotidienne une fois — elle réapparaîtra chaque jour.</p>
        <button class="btn btn-primary" style="margin-top:12px" onclick="openManageDailyModal()">⚙️ Configurer ma routine</button>
      </div>`;
      $('daily-body').innerHTML = html;
      return;
    }

    html += `<div class="daily-list">` + tasks.map(buildDailyRow).join('') + `</div>`;
    $('daily-body').innerHTML = html;
  }

  function buildDailyRow(t) {
    return `<div class="daily-item ${t.done?'done':''}" id="daily-item-${escapeHtml(t.id)}" onclick="toggleDaily('${escapeHtml(t.id)}')">
      <div class="daily-check ${t.done?'checked':''}">${t.done?'✓':''}</div>
      <div class="daily-text">
        <div class="daily-label">${escapeHtml(t.label)}</div>
        ${t.description?`<div class="daily-desc">${escapeHtml(t.description)}</div>`:''}
      </div>
      <div class="daily-time">${t.done && t.checkedAt ? '🕒 '+escapeHtml(t.checkedAt.slice(11)) : ''}</div>
    </div>`;
  }

  // Coche optimiste : bascule l'UI tout de suite, synchronise en arrière-plan.
  async function toggleDaily(taskId) {
    const t = (state.daily.tasks || []).find(x => x.id === taskId);
    if (!t) return;
    const newDone = !t.done;
    t.done = newDone;
    if (newDone) t.checkedAt = todayStr() + ' ' + new Date().toTimeString().slice(0,5);
    else t.checkedAt = '';
    renderDailyMine();
    try {
      const r = await call('toggleDailyCheck', URL_TOKEN, taskId, newDone);
      if (!r || !r.success) throw new Error(r && r.error);
      // resync précis de l'horodatage serveur au prochain chargement
      state.loaded.daily = 0;
    } catch (e) {
      t.done = !newDone;            // rollback
      renderDailyMine();
      toast('Synchronisation impossible, réessayez.', 'error');
    }
  }

  // ── Gestion de la liste (ajout / renommage / archivage) ──
  async function openManageDailyModal(forEmployee) {
    const canPickEmp = canSeeDailyTeam();
    let employee = forEmployee || state.user.name;

    showLoader('Chargement…');
    if (canPickEmp && !state.personnel.length) {
      const r = await call('getPersonnel', URL_TOKEN);
      if (r.success) state.personnel = r.personnel || [];
    }
    const res = await call('getDailyTasks', URL_TOKEN, null, employee);
    hideLoader();
    if (!res || !res.success) { toast(res && res.error || 'Erreur', 'error'); return; }

    window._dailyManageEmp = employee;
    window._dailyManageList = res.tasks || [];
    showManageDailyModal(canPickEmp, employee);
  }

  function showManageDailyModal(canPickEmp, employee) {
    const me = state.user.name;
    const list = window._dailyManageList || [];

    let empSelector = '';
    if (canPickEmp) {
      const opts = state.personnel
        .filter(p => p.status !== 'Inactif')
        .filter(p => state.user.role === 'chef' || state.user.role === 'rh'
                  || p.name === me || (p.dept && p.dept.toLowerCase() === (state.user.dept||'').toLowerCase()))
        .sort((a,b) => a.name===me?-1:(b.name===me?1:a.name.localeCompare(b.name)));
      empSelector = `<div class="form-row">
        <label>Routine de</label>
        <select id="md-emp">${opts.map(p=>`<option value="${escapeHtml(p.name)}" ${p.name===employee?'selected':''}>${escapeHtml(p.name)}${p.name===me?' (moi-même)':''}</option>`).join('')}</select>
      </div>`;
    }

    const rows = list.length ? list.map(t => `
      <div class="md-row" data-id="${escapeHtml(t.id)}">
        <input class="md-label" type="text" value="${escapeHtml(t.label)}" data-id="${escapeHtml(t.id)}">
        <button class="btn btn-icon danger" title="Archiver" onclick="archiveDailyNow('${escapeHtml(t.id)}')">🗑️</button>
      </div>`).join('')
      : `<div class="md-empty">Aucune tâche pour l'instant. Ajoutez-en une ci-dessous.</div>`;

    showModal('⚙️ Gérer la routine journalière', `
      ${empSelector}
      <div class="md-hint">Les tâches archivées ne sont jamais supprimées : l'historique du suivi reste intact.</div>
      <div id="md-list">${rows}</div>
      <div class="md-add">
        <input id="md-new" type="text" placeholder="Nouvelle tâche journalière…" onkeydown="if(event.key==='Enter')addDailyNow()">
        <button class="btn btn-primary" onclick="addDailyNow()">+ Ajouter</button>
      </div>
    `, [
      { label: 'Fermer', class: 'btn-secondary', onClick: () => { closeManageDaily(); } }
    ]);

    if (canPickEmp) {
      $('md-emp').onchange = () => openManageDailyModal($('md-emp').value);
    }
    // Renommage à la volée (au blur ou Enter)
    document.querySelectorAll('.md-label').forEach(inp => {
      inp.onchange = () => renameDailyNow(inp.dataset.id, inp.value);
    });
  }

  function closeManageDaily() {
    closeModal();
    // si on a touché à SA propre routine, on rafraîchit l'écran
    if (window._dailyManageEmp === state.user.name) {
      state.loaded.daily = 0;
      if (state.currentTab === 'Routine journalière') renderDaily();
    }
  }

  async function addDailyNow() {
    const inp = $('md-new');
    const label = inp.value.trim();
    if (!label) return;
    const employee = window._dailyManageEmp;
    inp.disabled = true;
    const r = await call('addDailyTask', URL_TOKEN, { label, employee });
    inp.disabled = false;
    if (!r || !r.success) { toast(r && r.error || 'Erreur', 'error'); return; }
    inp.value = '';
    openManageDailyModal(employee);   // recharge la liste
  }

  async function renameDailyNow(id, label) {
    if (!label.trim()) { toast('Le libellé ne peut pas être vide.', 'error'); return; }
    const r = await call('updateDailyTask', URL_TOKEN, { id, label: label.trim() });
    if (!r || !r.success) { toast(r && r.error || 'Erreur', 'error'); return; }
    toast('✅ Modifié', 'success');
    if (window._dailyManageEmp === state.user.name) state.loaded.daily = 0;
  }

  async function archiveDailyNow(id) {
    if (!confirm('Archiver cette tâche journalière ? (elle ne sera plus proposée, mais l\'historique reste conservé)')) return;
    const employee = window._dailyManageEmp;
    const r = await call('setDailyTaskActive', URL_TOKEN, id, false);
    if (!r || !r.success) { toast(r && r.error || 'Erreur', 'error'); return; }
    openManageDailyModal(employee);
  }

  // ── Suivi de l'équipe (conformité) ──
  async function renderDailyCompliance() {
    const body = $('daily-body');
    body.innerHTML = renderPeriodSelector('daily', 'ps-info-daily') + `<div id="daily-comp"></div>`;
    if (!state.periods.daily) state.periods.daily = { mode: 'week', from: null, to: null };
    wirePeriodSelector('daily', loadAndRenderCompliance);
    loadAndRenderCompliance();
  }

  async function loadAndRenderCompliance() {
    const bounds = getPeriodBounds(state.periods.daily);
    const today = todayStr();
    const from = bounds.from || today;
    const to = bounds.to || today;
    $('daily-comp').innerHTML = `<div class="empty-state"><div class="icon">⏳</div><p>Calcul du suivi…</p></div>`;
    const res = await call('getDailyCompliance', URL_TOKEN, from, to);
    if (!res || !res.success) { $('daily-comp').innerHTML = `<div class="empty-state"><p>Erreur de chargement.</p></div>`; return; }

    const wd = res.workingDays != null ? res.workingDays : 0;
    const infoEl = $('ps-info-daily');
    if (infoEl) infoEl.textContent = `${res.rows.length} collaborateur${res.rows.length>1?'s':''} · ${wd} jour${wd>1?'s':''} travaillé${wd>1?'s':''} (hors dimanches & fériés)`;
    // mémoriser la période courante pour le détail au clic
    window._dailyComp = { from: from, to: to };

    const rows = res.rows;
    if (!rows.length) { $('daily-comp').innerHTML = `<div class="empty-state"><div class="icon">📊</div><p>Aucun collaborateur dans votre périmètre.</p></div>`; return; }

    // Mini-KPI global
    const withTasks = rows.filter(r => r.activeCount > 0);
    const avgToday = withTasks.length ? Math.round(withTasks.reduce((s,r)=>s+(r.rateToday||0),0)/withTasks.length) : 0;
    const fullyToday = withTasks.filter(r => r.rateToday === 100).length;
    const noneToday = withTasks.filter(r => (r.doneToday||0) === 0).length;

    let html = `<div class="obj-dashboard">
      ${kpiCardSimple('Collaborateurs suivis', withTasks.length, '', '')}
      ${kpiCardSimple("Taux moyen aujourd'hui", avgToday+'%', '', avgToday>=70?'ok':(avgToday>=40?'warn':'danger'))}
      ${kpiCardSimple('Routine complète', fullyToday, '', fullyToday>0?'ok':'')}
      ${kpiCardSimple("Rien fait aujourd'hui", noneToday, '', noneToday>0?'danger':'ok')}
    </div>`;

    html += `<div class="table-wrap"><table class="daily-comp-table">
      <thead><tr>
        <th>Collaborateur</th><th>Département</th><th>Tâches</th>
        <th>Aujourd'hui</th><th>Sur la période</th><th></th>
      </tr></thead><tbody>`;
    html += rows.map(r => {
      if (!r.activeCount) {
        return `<tr class="comp-empty"><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.dept||'—')}</td>
          <td colspan="4" class="comp-none">Aucune routine définie</td></tr>`;
      }
      return `<tr class="comp-clickable" onclick="openDailyDetail('${escapeHtml(r.name)}')" title="Voir le détail jour par jour">
        <td><strong>${escapeHtml(r.name)}</strong></td>
        <td>${escapeHtml(r.dept||'—')}</td>
        <td>${r.activeCount}</td>
        <td>${compBar(r.doneToday, r.activeCount, r.rateToday)}</td>
        <td>${compBar(r.donePeriod, r.expectedPeriod, r.ratePeriod)}</td>
        <td class="comp-chevron">›</td>
      </tr>`;
    }).join('');
    html += `</tbody></table></div>`;
    $('daily-comp').innerHTML = html;
  }

  // Détail jour par jour d'un collaborateur sur la période courante.
  async function openDailyDetail(name) {
    const period = window._dailyComp || { from: todayStr(), to: todayStr() };
    showLoader('Chargement du détail…');
    const res = await call('getDailyDetail', URL_TOKEN, name, period.from, period.to);
    hideLoader();
    if (!res || !res.success) { toast(res && res.error || 'Erreur', 'error'); return; }

    const rateCls = res.rate == null ? '' : (res.rate >= 70 ? 'ok' : (res.rate >= 40 ? 'warn' : 'danger'));
    let body = `<div class="dd-head">
      <div class="dd-period">📅 du <strong>${escapeHtml(res.from)}</strong> au <strong>${escapeHtml(res.to)}</strong></div>
      <div class="dd-summary">
        <span class="dd-rate ${rateCls}">${res.rate == null ? '—' : res.rate + '%'}</span>
        <span class="dd-sub">${res.totalDone}/${res.totalExpected} cochages · ${res.activeCount} tâche${res.activeCount>1?'s':''} active${res.activeCount>1?'s':''}</span>
      </div>
    </div>`;

    // ✨ v6.7 : intitulés des tâches journalières de la personne
    if (res.tasks && res.tasks.length) {
      body += `<div class="dd-tasks">
        <div class="dd-tasks-title">🔁 Tâches journalières (${res.tasks.length})</div>
        <ol class="dd-tasks-list">${res.tasks.map(t => `<li>${escapeHtml(t.label)}</li>`).join('')}</ol>
      </div>`;
    } else {
      body += `<div class="md-empty">Aucune tâche journalière active pour cette personne.</div>`;
    }

    if (!res.days.length) {
      body += `<div class="md-empty">Aucun jour dans la période.</div>`;
    } else {
      body += `<div class="dd-days">` + res.days.map(d => {
        if (d.type === 'sunday' || d.type === 'holiday') {
          const lbl = d.type === 'sunday' ? 'Dimanche' : ('Férié' + (d.holidayName ? ' — ' + escapeHtml(d.holidayName) : ''));
          return `<div class="dd-day off">
            <div class="dd-date">${escapeHtml(d.weekday)} ${escapeHtml(d.date)}${d.isToday?' <span class="dd-today">aujourd&#39;hui</span>':''}</div>
            <div class="dd-off-label">🚫 ${lbl} — non comptabilisé</div>
          </div>`;
        }
        const pct = d.total ? Math.round(d.doneCount * 100 / d.total) : 0;
        const cls = pct >= 70 ? 'ok' : (pct >= 40 ? 'warn' : 'danger');
        const doneSet = {};
        (d.doneIds || []).forEach(id => { doneSet[id] = true; });
        const taskLines = (res.tasks || []).map(t => {
          const ok = !!doneSet[t.id];
          return `<div class="dd-task ${ok?'ok':'miss'}"><span class="dd-task-ico">${ok?'✓':'✗'}</span>${escapeHtml(t.label)}</div>`;
        }).join('');
        return `<div class="dd-day work-day ${d.isToday?'is-today':''}" onclick="this.classList.toggle('open')">
          <div class="dd-day-main">
            <div class="dd-date">${escapeHtml(d.weekday)} ${escapeHtml(d.date)}${d.isToday?' <span class="dd-today">aujourd&#39;hui</span>':''}</div>
            <div class="comp-cell">
              <div class="comp-bar"><div class="comp-fill ${cls}" style="width:${pct}%"></div></div>
              <span class="comp-num ${cls}">${d.doneCount}/${d.total} · ${pct}%</span>
            </div>
            <span class="dd-expand">▸</span>
          </div>
          <div class="dd-day-tasks">${taskLines}</div>
        </div>`;
      }).join('') + `</div>`;
    }

    showModal('📊 ' + name + ' — détail de la routine', body, [
      { label: 'Fermer', class: 'btn-secondary', onClick: closeModal }
    ]);
  }

  function compBar(done, expected, rate) {
    const r = rate == null ? 0 : rate;
    const cls = r >= 70 ? 'ok' : (r >= 40 ? 'warn' : 'danger');
    return `<div class="comp-cell">
      <div class="comp-bar"><div class="comp-fill ${cls}" style="width:${r}%"></div></div>
      <span class="comp-num ${cls}">${done}/${expected} · ${r}%</span>
    </div>`;
  }

  // ═════════════════════════════════════════════════════════════════
  //  ✨ v6.0 : TABLEAU DE BORD PERSONNEL
  // ═════════════════════════════════════════════════════════════════

  async function renderDashboardPerso() {
    // Pas besoin de loader si on a déjà les tâches en mémoire
    if (!state.tasks || state.tasks.length === 0) {
      showLoader('Chargement…');
      await loadTasks();
      hideLoader();
    }

    // Charger les objectifs si pas encore en mémoire
    if (!state.objectifs) {
      const res = await call('getObjectifs', URL_TOKEN);
      if (res.success) state.objectifs = res.objectifs || [];
      else state.objectifs = [];
    }

    const me = state.user.name;
    const role = state.user.role;
    const today = todayStr();

    // === MES TÂCHES ===
    const myReceivedTasks = state.tasks.filter(t => t.recipient === me);
    const myAssignedTasks = state.tasks.filter(t => t.assignedByName === me && t.recipient !== me);

    const stats = {
      total: myReceivedTasks.length,
      done: myReceivedTasks.filter(t => t.status === 'Terminé').length,
      inProgress: myReceivedTasks.filter(t => t.status === 'En cours').length,
      todo: myReceivedTasks.filter(t => t.status === 'À faire').length,
      overdue: myReceivedTasks.filter(t => t.status !== 'Terminé' && t.dateLimit && t.dateLimit < today).length,
      lateStart: myReceivedTasks.filter(t => t.status === 'À faire' && t.dateStart && t.dateStart <= today).length
    };
    const completionRate = stats.total ? Math.round(stats.done * 100 / stats.total) : 0;

    // === MES OBJECTIFS ===
    const myObjPerso = (state.objectifs || []).filter(o => o.type === 'perso' && o.target === me);
    const objStats = {
      total: myObjPerso.length,
      atteint: myObjPerso.filter(o => o.status === 'Atteint').length,
      enCours: myObjPerso.filter(o => o.status === 'En cours').length,
      echec: myObjPerso.filter(o => o.status === 'Échec').length,
      avgProgress: myObjPerso.length ? Math.round(myObjPerso.reduce((s,o) => s + (o.progress || 0), 0) / myObjPerso.length) : 0
    };

    // === HEADER PERSONNALISÉ ===
    const greeting = getGreeting();
    let html = `<div class="db-perso-header">
      <div class="db-greeting">${greeting}, <strong>${escapeHtml(me)}</strong> !</div>
      <div class="db-subtitle">Voici votre tableau de bord — ${escapeHtml(roleLabel(role))}${state.user.dept ? ' · ' + escapeHtml(state.user.dept) : ''}</div>
    </div>`;

    // === BANDEAUX D'ALERTE ===
    if (stats.overdue > 0) {
      html += `<div class="alert-banner danger">
        <span class="icon">🚨</span>
        <span class="grow"><strong>${stats.overdue}</strong> tâche${stats.overdue>1?'s':''} en retard. <span class="alert-link" onclick="setTab('${myTasksTab()}')">Voir les tâches →</span></span>
      </div>`;
    }
    if (stats.lateStart > 0) {
      html += `<div class="alert-banner warn">
        <span class="icon">⏰</span>
        <span class="grow"><strong>${stats.lateStart}</strong> tâche${stats.lateStart>1?'s':''} à démarrer en retard. <span class="alert-link" onclick="setTab('${myTasksTab()}')">Voir →</span></span>
      </div>`;
    }

    // === KPI TÂCHES ===
    html += `<h2 class="db-section-title">📋 Mes tâches reçues</h2>
    <div class="kpi-grid">`;
    html += kpiCardSimple('Total', stats.total, '', '');
    html += kpiCardSimple('Terminées', stats.done, completionRate + '%', completionRate >= 70 ? 'ok' : (completionRate >= 40 ? 'warn' : 'danger'));
    html += kpiCardSimple('En cours', stats.inProgress, '', '');
    html += kpiCardSimple('À faire', stats.todo, '', '');
    html += kpiCardSimple('En retard', stats.overdue, '', stats.overdue > 0 ? 'danger' : 'ok');
    html += kpiCardSimple('Démarrage tardif', stats.lateStart, '', stats.lateStart > 0 ? 'warn' : 'ok');
    html += `</div>`;

    // === KPI ASSIGNÉES PAR MOI (si applicable) ===
    if (myAssignedTasks.length > 0 && role !== 'emp') {
      const assignedDone = myAssignedTasks.filter(t => t.status === 'Terminé').length;
      const assignedRate = Math.round(assignedDone * 100 / myAssignedTasks.length);
      html += `<h2 class="db-section-title">📤 Tâches que j'ai assignées</h2>
      <div class="kpi-grid">`;
      html += kpiCardSimple('Total assignées', myAssignedTasks.length, '', '');
      html += kpiCardSimple('Terminées', assignedDone, assignedRate + '%', assignedRate >= 70 ? 'ok' : 'warn');
      html += kpiCardSimple('En cours / À faire', myAssignedTasks.length - assignedDone, '', '');
      html += `</div>`;
    }

    // === KPI OBJECTIFS PERSO ===
    if (objStats.total > 0) {
      html += `<h2 class="db-section-title">🎯 Mes objectifs personnels</h2>
      <div class="kpi-grid">`;
      html += kpiCardSimple('Total', objStats.total, '', '');
      html += kpiCardSimple('Atteints', objStats.atteint, '', objStats.atteint > 0 ? 'ok' : '');
      html += kpiCardSimple('En cours', objStats.enCours, '', '');
      html += kpiCardSimple('Progression moyenne', objStats.avgProgress + '%', '', objStats.avgProgress >= 60 ? 'ok' : 'warn');
      html += `</div>`;
    }

    // === ✨ v7.1 : MA COURBE D'ÉVOLUTION ===
    // Ouvert à TOUS les rôles, contrairement à l'onglet « Par niveau » : chacun
    // doit pouvoir mesurer sa propre progression d'une période à l'autre. La RPC
    // activity_events ne renvoie que sa propre activité à qui n'est pas
    // Chef / Directeur / DA-RH, la confidentialité est donc tenue côté base.
    if (hasFeature('hierarchy')) {
      html += `<h2 class="db-section-title">📈 Mon évolution</h2>
        <div class="cmp-bar">
          <span class="cmp-label">📊 Comparer par</span>
          <select id="myevo-unit">
            ${Object.keys(PERIOD_UNITS).map(k =>
              `<option value="${k}" ${state.myEvoUnit === k ? 'selected' : ''}>${PERIOD_UNITS[k].label}</option>`).join('')}
          </select>
          <span class="cmp-window prev" id="myevo-prev">—</span>
          <span class="cmp-arrow">→</span>
          <span class="cmp-window" id="myevo-cur">—</span>
        </div>
        <div id="myevo-body"></div>`;
    }

    // === LISTE URGENTE ===
    const urgentTasks = myReceivedTasks
      .filter(t => t.status !== 'Terminé')
      .sort((a, b) => (a.dateLimit || '9999').localeCompare(b.dateLimit || '9999'))
      .slice(0, 5);

    if (urgentTasks.length > 0) {
      html += `<div class="dash-section">
        <h3>⏰ Mes 5 prochaines échéances</h3>
        <div class="db-task-list">
          ${urgentTasks.map(t => {
            const overdue = isOverdue(t);
            const tCls = overdue ? 'urgent danger' : (t.status === 'En cours' ? 'urgent info' : 'urgent');
            return `<div class="db-task-item ${tCls}" onclick="setTab('${myTasksTab()}')">
              <div class="db-task-id">${escapeHtml(t.id)}</div>
              <div class="db-task-desc">${escapeHtml(t.description)}</div>
              <div class="db-task-meta">
                <span class="badge badge-status-${statusKey(t.status)}">${escapeHtml(t.status)}</span>
                <span class="${overdue ? 'badge badge-overdue' : ''}">${overdue ? '⚠ ' : '📅 '}${escapeHtml(t.dateLimit || '—')}</span>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    }

    // === OBJECTIFS EN COURS ===
    const objInProgress = myObjPerso.filter(o => o.status === 'En cours').slice(0, 4);
    if (objInProgress.length > 0) {
      html += `<div class="dash-section">
        <h3>🎯 Mes objectifs en cours</h3>
        <div class="obj-grid" style="margin-top:8px;">
          ${objInProgress.map(buildObjectifCard).join('')}
        </div>
      </div>`;
    }

    // === ACTIONS RAPIDES ===
    html += `<div class="dash-section">
      <h3>⚡ Actions rapides</h3>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="setTab('${myTasksTab()}');setTimeout(()=>openNewTaskModal(),300)">+ Nouvelle tâche</button>
        ${role !== 'emp' ? `<button class="btn btn-secondary" onclick="setTab('${myTasksTab()}');setTimeout(()=>openNewTeamTaskModal(),300)">👥 Tâche d'équipe</button>` : ''}
        <button class="btn btn-secondary" onclick="setTab('Objectifs');setTimeout(()=>openNewObjectifModal(),300)">🎯 Nouvel objectif</button>
      </div>
    </div>`;

    $('main-content').innerHTML = html;

    if (hasFeature('hierarchy')) {
      const sel = $('myevo-unit');
      if (sel) sel.onchange = e => { state.myEvoUnit = e.target.value; renderMyEvolution(); };
      renderMyEvolution();
    }
  }

  // ✨ v7.1 : « Mon évolution » — même moteur de comparaison que l'onglet
  // « Par niveau », restreint à l'utilisateur connecté.
  function renderMyEvolution() {
    const body = $('myevo-body');
    if (!body) return;
    resetStatsMemo();
    const wins = periodWindows(state.myEvoUnit, LEVEL_HISTORY);
    const cur = wins[wins.length - 1], prev = wins[wins.length - 2];
    const elCur = $('myevo-cur'), elPrev = $('myevo-prev');
    if (elCur)  elCur.textContent  = cur.longLabel;
    if (elPrev) elPrev.textContent = prev.longLabel;

    const ready = ensureActivity(wins[0].from, cur.to, () => {
      if (state.currentTab === 'Tableau de bord') renderMyEvolution();
    });

    const me = state.user.name;
    const c = actorFullStats(me, cur), p = actorFullStats(me, prev);
    const meRow = state.personnel.find(x => x.name === me);
    const L = meRow ? levelDef(personLevel(meRow)) : null;

    let html = '';
    if (L) {
      html += `<div class="lvl-head" style="background:${L.grad};padding:12px 16px;">
        <h3 style="font-size:15px;">Niveau ${L.n} — ${escapeHtml(L.full)}</h3>
        <div class="lvl-sub">Vous êtes comparé aux personnes du même niveau d'attribution.</div>
      </div>`;
    }
    html += '<div class="kpi-grid">';
    html += cmpCard('Reçues', c.recues, 'confiées sur la période', '', deltaBadge(c.recues, p.recues));
    html += cmpCard('Livrées', c.livrees, 'clôturées sur la période',
                    c.livrees >= p.livrees ? 'ok' : '', deltaBadge(c.livrees, p.livrees));
    html += cmpCard('Taux', c.recues ? c.taux + '%' : '—', 'de ma charge terminée',
                    !c.recues ? '' : c.taux >= 70 ? 'ok' : c.taux >= 40 ? 'warn' : 'danger',
                    ratioDelta(c.taux, p.taux, c.recues, p.recues));
    html += cmpCard('Ponctualité', c.livrees ? c.ponctualite + '%' : '—', 'livrées dans les délais',
                    !c.livrees ? '' : c.ponctualite >= 70 ? 'ok' : 'warn',
                    ratioDelta(c.ponctualite, p.ponctualite, c.livrees, p.livrees));
    html += cmpCard('Échéances manquées', c.manquees, '', c.manquees ? 'danger' : 'ok',
                    deltaBadge(c.manquees, p.manquees, { invert: true }));
    html += cmpCard('Délai moyen', c.delai ? c.delai + 'j' : '—', 'attribution → clôture', '',
                    (c.delai || p.delai) ? deltaBadge(c.delai, p.delai, { unit: 'j', invert: true }) : '');
    if (ready && state.activity.available) {
      html += cmpCard('💡 Innovation', c.innovation, c.ideas + ' idée(s) déposée(s)',
                      c.innovation ? 'ok' : '', deltaBadge(c.innovation, p.innovation));
      html += cmpCard('🧠 Réflexion', c.reflexion, c.traces + ' contribution(s) écrite(s)',
                      c.reflexion ? 'ok' : '', deltaBadge(c.reflexion, p.reflexion));
    } else if (!ready) {
      html += cmpCard('💡 Innovation', '…', 'chargement', '', '');
      html += cmpCard('🧠 Réflexion', '…', 'chargement', '', '');
    }
    html += '</div>';

    const hist = wins.map(w => actorFullStats(me, w));
    const series = [
      { label: 'Reçues',  color: '#1a73e8', values: hist.map(s => s.recues) },
      { label: 'Livrées', color: '#137333', values: hist.map(s => s.livrees) },
      { label: 'Échéances manquées', color: '#c5221f', values: hist.map(s => s.manquees) }
    ];
    if (ready && state.activity.available) {
      series.push({ label: '💡 Innovation', color: '#8430ce', values: hist.map(s => s.innovation) });
      series.push({ label: '🧠 Réflexion',  color: '#b06000', values: hist.map(s => s.reflexion) });
    }
    html += `<div class="dash-section">
      <h3>📈 Ma courbe sur ${LEVEL_HISTORY} ${PERIOD_UNITS[state.myEvoUnit].label.toLowerCase()}s</h3>
      ${buildPeriodChart(wins, series)}</div>`;
    html += levelMethodNote(ready);
    body.innerHTML = html;
  }

  function kpiCardSimple(label, value, sub, modifier) {
    const cls = 'kpi-card kpi-static' + (modifier ? ' ' + modifier : '');
    return `<div class="${cls}">
      <div class="kpi-label">${escapeHtml(label)}</div>
      <div class="kpi-value">${escapeHtml(String(value))}</div>
      ${sub ? `<div class="kpi-sub">${escapeHtml(sub)}</div>` : ''}
    </div>`;
  }

  function getGreeting() {
    const h = new Date().getHours();
    if (h < 5) return 'Bonsoir';
    if (h < 12) return 'Bonjour';
    if (h < 18) return 'Bon après-midi';
    return 'Bonsoir';
  }

  async function loadObjectifComments(objId) {
    try {
      const res = await call('getObjectifComments', URL_TOKEN, objId);
      const container = $('obj-comments-container');
      if (!container) return;
      if (!res.success) {
        container.innerHTML = `<div class="chat-empty" style="color:#c5221f;">${escapeHtml(res.error)}</div>`;
        return;
      }
      const me = state.user.name;
      const isChef = state.user.role === 'chef';
      const comments = res.comments || [];
      if (comments.length === 0) {
        container.innerHTML = '<div class="chat-empty">Aucun commentaire pour le moment.</div>';
        return;
      }
      container.innerHTML = comments.map(c => {
        const isOwn = c.author === me;
        const canDelete = isOwn || isChef;
        const dateShort = c.date ? c.date.substring(5, 16).replace('T', ' ') : '';
        return `<div class="chat-message ${isOwn ? 'own' : ''}">
          ${canDelete ? `<div class="chat-message-actions"><button onclick="deleteObjComment('${escapeHtml(c.id)}','${escapeHtml(objId)}')" title="Supprimer">🗑</button></div>` : ''}
          <div class="chat-message-header">
            <span class="chat-message-author">${escapeHtml(c.author)}</span>
            <span class="chat-message-date">${escapeHtml(dateShort)}</span>
          </div>
          <div class="chat-message-text">${escapeHtml(c.comment)}</div>
        </div>`;
      }).join('');
      container.scrollTop = container.scrollHeight;
    } catch (e) {
      const container = $('obj-comments-container');
      if (container) container.innerHTML = `<div class="chat-empty" style="color:#c5221f;">${escapeHtml(e.message || e)}</div>`;
    }
  }

  async function sendObjectifComment(objId) {
    const input = $('obj-comment-input');
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;
    input.disabled = true;
    try {
      const res = await call('postObjectifComment', URL_TOKEN, objId, text);
      if (!res.success) {
        toast(res.error || 'Erreur', 'error');
        input.disabled = false;
        return;
      }
      input.value = '';
      input.disabled = false;
      await loadObjectifComments(objId);
    } catch (e) {
      input.disabled = false;
      toast('Erreur : ' + (e.message || e), 'error');
    }
  }

  async function deleteObjComment(commentId, objId) {
    if (!confirm('Supprimer ce commentaire ?')) return;
    try {
      const res = await call('deleteObjectifComment', URL_TOKEN, commentId);
      if (!res.success) { toast(res.error || 'Erreur', 'error'); return; }
      await loadObjectifComments(objId);
      toast('✅ Commentaire supprimé', 'success');
    } catch (e) {
      toast('Erreur : ' + (e.message || e), 'error');
    }
  }

  // ✨ v6.7 : téléverse 1..N fichiers comme rapport / preuve de la tâche.
  async function uploadReportFiles(taskId, files) {
    if (!files || !files.length) { toast('Aucun fichier sélectionné.', 'error'); return; }
    let lastUrl = '', okCount = 0;
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      showLoader(`Préparation de ${file.name} (${i+1}/${files.length})…`);
      try {
        const built = await buildAttachmentPayload(file);
        if (built.error) { toast(built.error, 'error'); continue; }
        const payload = built.payload;
        showLoader(`Envoi ${i+1}/${files.length} : ${payload.name}…`);
        const res = await call('addAttachment', URL_TOKEN, taskId, {
          name: payload.name, mimeType: payload.mimeType, dataBase64: payload.dataBase64
        });
        if (!res || !res.success) { toast((res && res.error) || ('Échec : ' + payload.name), 'error'); continue; }
        okCount++;
        if (res.attachment && res.attachment.url) lastUrl = res.attachment.url;
      } catch (e) {
        console.error('uploadReportFiles', e);
        toast('Erreur upload : ' + (e && (e.message || e)), 'error');
      }
    }
    hideLoader();
    if (!okCount) return;
    // Le lien « rapport » de la tâche pointe vers le dernier fichier déposé.
    if (lastUrl) { try { await call('updateTaskReportLink', URL_TOKEN, taskId, lastUrl); } catch (e) { console.warn('reportLink', e); } }
    toast(`✅ ${okCount} fichier${okCount>1?'s':''} joint${okCount>1?'s':''}`, 'success');
    const t = state.tasks.find(x => x.id === taskId);
    if (t) { t.reportLink = lastUrl || t.reportLink; t.attachmentsCount = Number(t.attachmentsCount || 0) + okCount; }
    state.loaded.tasks = 0;
    closeModal();
    if (state.currentTab === 'Tâches' || state.currentTab === 'Mes tâches') renderTasksTable();
    if ($('tdc-attachments')) loadAndRenderAttachments(taskId);
  }

  async function rejectTaskNow(taskId) {
    const reason = ($('reject-reason') ? $('reject-reason').value : '').trim();

    showLoader('Renvoi en cours…');

      const res = await call('rejectTask', URL_TOKEN, taskId, reason);
      if (!res || !res.success) { toast((res && res.error) || 'Erreur', 'error'); return; }
      toast('🔄 Tâche renvoyée — le destinataire a été notifié', 'success');
      // Optimiste : refléter le nouvel état localement
      const t = state.tasks.find(x => x.id === taskId);
      if (t) {
        t.status = 'À faire';
        t.progress = 0;
        t.closeDate = '';
        t.chefComment = '🔄 RENVOYÉE par ' + (state.user.name || '') + ' : ' + reason;

      state.loaded.tasks = 0;
      closeModal();
      if (state.currentTab === 'Tâches' || state.currentTab === 'Mes tâches') renderTasksTable();

      // « Terminé ». Sans effet si la fiche n'est pas ouverte (la table est absente).
      refreshEmpDetailIfOpen();
      if (state.user) renderTabs();
    } catch (e) {
      console.error('rejectTaskNow', e);
      toast('Erreur : ' + (e && (e.message || e)), 'error');
    } finally {
      hideLoader();
    }
  }

  async function submitEmployee(rowIndex) {
    const payload = {
      name:      $('emp-name').value.trim(),
      email:     $('emp-email').value.trim(),
      role:      $('emp-role').value,
      dept:      $('emp-dept').value.trim(),
      position:  $('emp-pos').value.trim(),
      startDate: $('emp-date').value,
      status:    $('emp-status').value
    };
    if (!payload.name || !payload.email || !payload.role) {
      toast('Nom, email et rôle sont obligatoires.', 'error'); return;
    }
    showLoader(rowIndex ? 'Mise à jour…' : 'Création…');
    try {
      const r = rowIndex
        ? await call('updateEmployee', URL_TOKEN, { ...payload, rowIndex: rowIndex })
        : await call('addEmployee', URL_TOKEN, payload);
      hideLoader();
      if (!r.success) { toast(r.error || 'Erreur', 'error'); return; }
      if (!rowIndex && r.accessLink) {
        closeModal();
        showAccessLinkModal(payload.name, r.accessLink, payload.email);
      } else {
        toast('✅ Enregistré', 'success');
        closeModal();
        renderPersonnelView();
      }
    } catch (e) {
      hideLoader(); toast('Erreur : ' + (e.message || e), 'error');
    }
  }

  async function showAccessLink(rowIndex) {
    const p = state.personnel.find(x => x.id === rowIndex);
    if (!p) return;
    if (!p.token) {
      if (!confirm('Aucun lien actif. Générer un nouveau lien d\'accès pour ' + p.name + ' ?')) return;
      return regenerateLink(rowIndex);
    }
    const link = window.location.origin + window.location.pathname + '?token=' + encodeURIComponent(p.token);
    showAccessLinkModal(p.name, link, p.email, rowIndex);
  }

  function showAccessLinkModal(name, link, email, rowIndex) {
    const body = `
      <div style="text-align:center;font-size:32px;margin-bottom:8px;">🔗</div>
      <div class="form-row">
        <label>Bénéficiaire</label>
        <div style="font-size:14px;"><strong>${escapeHtml(name)}</strong>${email ? ` <span style="color:#5f6368">(${escapeHtml(email)})</span>` : ''}</div>
      </div>
      <div class="form-row">
        <label>Lien d'accès personnel</label>
        <div class="link-display" id="link-text">${escapeHtml(link)}</div>
        <div class="hint">⚠️ Ce lien est strictement personnel. Le bénéficiaire l'a déjà reçu par email.</div>
      </div>
    `;
    const buttons = [
      { label: '📋 Copier', class: 'btn-secondary', onClick: () => copyToClipboard(link) },
      { label: 'Fermer',    class: 'btn-primary',   onClick: closeModal }
    ];
    if (rowIndex) {
      // ✨ v7.0 : renvoyer le lien existant est l'action courante (« je l'ai perdu ») ;
      // régénérer casse le lien encore en circulation → on garde ce dernier en rouge.
      buttons.unshift({ label: '🔄 Régénérer', class: 'btn-danger', onClick: () => {
        if (confirm('Régénérer le lien ? L\'ancien lien ne fonctionnera plus.')) {
          closeModal(); regenerateLink(rowIndex);
        }
      }});
      if (hasFeature('resendLink')) {
        buttons.unshift({ label: '📧 Renvoyer par email', class: 'btn-secondary',
                          onClick: () => resendLink(rowIndex) });
      }
    }
    showModal('Lien d\'accès', body, buttons);
  }

  async function resendLink(rowIndex) {
    showLoader('Envoi du lien…');
    try {
      const r = await call('resendAccessLink', URL_TOKEN, rowIndex);
      hideLoader();
      if (!r || !r.success) { toast((r && r.error) || 'Erreur', 'error'); return; }
      toast('✅ Lien renvoyé à ' + (r.email || 'la personne'), 'success');
    } catch (e) {
      hideLoader(); toast('Erreur : ' + (e.message || e), 'error');
    }
  }

  async function regenerateLink(rowIndex) {
    showLoader('Génération du lien…');
    try {
      const r = await call('regenerateAccessLink', URL_TOKEN, rowIndex);
      hideLoader();
      if (!r.success) { toast(r.error || 'Erreur', 'error'); return; }
      toast('✅ Nouveau lien envoyé par email', 'success');
      const p = state.personnel.find(x => x.id === rowIndex);
      if (p) p.token = r.token;
      showAccessLinkModal(p ? p.name : '?', r.accessLink, p ? p.email : '', rowIndex);
    } catch (e) {
      hideLoader(); toast('Erreur : ' + (e.message || e), 'error');

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        () => toast('✅ Lien copié', 'success'),
        () => toast('Impossible de copier — sélectionnez et copiez manuellement', 'error'));
      return;
    }
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('✅ Lien copié', 'success'); }
    catch (e) { toast('Impossible de copier', 'error'); }
    ta.remove();
  }

  // ═════════════════════════════════════════════════════════════════
  //  HELPERS PÉRIODE (partagés Pilotage / Par employé / Par directeur / Tâches)
  // ═════════════════════════════════════════════════════════════════
  function ymd(d) {
    const yy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return yy + '-' + mm + '-' + dd;
  }
  function parseYmd(s) {
    if (!s) return null;
    const parts = s.split('-');
    if (parts.length !== 3) return null;
    return new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
  }

  function renderPeriodSelector(viewKey, infoId) {
    const p = periodOf(viewKey);
    return `
      <div class="period-selector">
        <span class="ps-label">📅 Période :</span>
        <select id="ps-mode-${viewKey}">
          <option value="all"     ${p.mode==='all'?'selected':''}>Tout</option>
          <option value="week"    ${p.mode==='week'?'selected':''}>Cette semaine</option>
          <option value="month"   ${p.mode==='month'?'selected':''}>30 derniers jours</option>
          <option value="quarter" ${p.mode==='quarter'?'selected':''}>Ce trimestre</option>
          <option value="year"    ${p.mode==='year'?'selected':''}>Cette année</option>
          <option value="custom"  ${p.mode==='custom'?'selected':''}>Personnalisée…</option>
        </select>
        <span class="custom-range ${p.mode==='custom'?'visible':''}" id="ps-custom-${viewKey}">
          du <input type="date" id="ps-from-${viewKey}" value="${p.from || ''}">
          au <input type="date" id="ps-to-${viewKey}"   value="${p.to   || ''}">
        </span>
        <span class="period-info" id="${infoId}"></span>
      </div>`;
  }

  function wirePeriodSelector(viewKey, refreshFn) {
    const modeEl = $('ps-mode-'+viewKey);
    const fromEl = $('ps-from-'+viewKey);
    const toEl   = $('ps-to-'+viewKey);
    const customEl = $('ps-custom-'+viewKey);
    if (!modeEl) return;

    modeEl.onchange = () => {
      const mode = modeEl.value;
      state.periods[viewKey].mode = mode;
      customEl.classList.toggle('visible', mode === 'custom');
      if (mode !== 'custom') {
        state.periods[viewKey].from = null;
        state.periods[viewKey].to = null;
      }
      refreshFn();
    };
    if (fromEl) fromEl.onchange = () => {
      state.periods[viewKey].from = fromEl.value || null; refreshFn();
    };
    if (toEl) toEl.onchange = () => {
      state.periods[viewKey].to = toEl.value || null; refreshFn();
    };
  }

  function getPeriodBounds(periodObj) {
    const now = new Date(); now.setHours(0,0,0,0);
    let from = null, to = null;
    if (periodObj.mode === 'week') {
      const day = now.getDay() || 7;
      from = new Date(now); from.setDate(now.getDate() - (day - 1));
      to   = new Date(from); to.setDate(from.getDate() + 6);
    } else if (periodObj.mode === 'month') {
      // ✨ "30 derniers jours" glissants (et non le mois calendaire) : ne tombe
      // jamais à vide juste parce qu'on est le 1er du mois.
      from = new Date(now); from.setDate(now.getDate() - 29);
      to   = new Date(now);
    } else if (periodObj.mode === 'quarter') {
      const q = Math.floor(now.getMonth() / 3);
      from = new Date(now.getFullYear(), q * 3, 1);
      to   = new Date(now.getFullYear(), q * 3 + 3, 0);
    } else if (periodObj.mode === 'year') {
      from = new Date(now.getFullYear(), 0, 1);
      to   = new Date(now.getFullYear(), 11, 31);
    } else if (periodObj.mode === 'custom') {
      from = parseYmd(periodObj.from);
      to   = parseYmd(periodObj.to);
    }
    return { from: from ? ymd(from) : null, to: to ? ymd(to) : null };
  }

  function filterTasksByPeriod(tasks, periodObj) {
    const { from, to } = getPeriodBounds(periodObj);
    if (!from && !to) return tasks.slice();
    return tasks.filter(t => {
      const d = t.dateAssigned;
      if (!d) return false;
      if (from && d < from) return false;
      if (to   && d > to)   return false;
      return true;
    });
  }

  function splitPeriodIntoBuckets(periodObj) {
    const { from, to } = getPeriodBounds(periodObj);
    if (!from || !to) {
      const now = new Date();
      const buckets = [];
      for (let i = 5; i >= 0; i--) {
        const d1 = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const d2 = new Date(now.getFullYear(), now.getMonth() - i + 1, 0);
        buckets.push({
          label: d1.toLocaleString('fr-FR', { month: 'short', year: '2-digit' }),
          from: ymd(d1), to: ymd(d2)
        });
      }
      return buckets;
    }
    const start = parseYmd(from), end = parseYmd(to);
    const days = Math.round((end - start) / (1000*60*60*24)) + 1;
    const buckets = [];
    if (days <= 14) {
      let d = new Date(start);
      while (d <= end) {
        buckets.push({
          label: d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' }),
          from: ymd(d), to: ymd(d)
        });
        d.setDate(d.getDate() + 1);
      }
    } else if (days <= 90) {
      let d = new Date(start);
      while (d <= end) {
        const e = new Date(d); e.setDate(d.getDate() + 6);
        if (e > end) e.setTime(end.getTime());
        buckets.push({
          label: 'S' + getWeekNum(d) + ' ' + d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit' }),
          from: ymd(d), to: ymd(e)
        });
        d.setDate(d.getDate() + 7);
      }
    } else {
      let d = new Date(start.getFullYear(), start.getMonth(), 1);
      while (d <= end) {
        const last = new Date(d.getFullYear(), d.getMonth() + 1, 0);
        const bucketEnd = last > end ? end : last;
        const bucketStart = d < start ? start : d;
        buckets.push({
          label: d.toLocaleString('fr-FR', { month: 'short', year: '2-digit' }),
          from: ymd(bucketStart), to: ymd(bucketEnd)
        });
        d = new Date(d.getFullYear(), d.getMonth() + 1, 1);
      }
    }
    return buckets;
  }

  function getWeekNum(d) {
    const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const dayNum = date.getUTCDay() || 7;
    date.setUTCDate(date.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
    return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
  }

  function kpiCard(label, value, sub, modifier, clickKey, hint, handler) {
    const cls = 'kpi-card' + (modifier ? ' ' + modifier : '');
    const fn = handler || 'openDetail';
    const clickAttr = clickKey ? ` onclick="${fn}('${clickKey}')"` : '';
    return `<div class="${cls}"${clickAttr}>
              <div class="kpi-label">${label}</div>
              <div class="kpi-value">${value}</div>
              ${sub ? `<div class="kpi-sub">${sub}</div>` : ''}
              ${hint ? `<div class="kpi-hint">${hint}</div>` : ''}
            </div>`;
  }

  function renderDashboardBody() {
    const period = periodOf('dash');
    const tasks = filterTasksByPeriod(state.tasks, period);
    const { from, to } = getPeriodBounds(period);

    const infoEl = $('ps-info-dash');
    if (infoEl) {
      if (!from && !to) infoEl.textContent = `${tasks.length} tâche${tasks.length>1?'s':''} au total`;
      else infoEl.textContent = `${tasks.length} tâche${tasks.length>1?'s':''} · du ${from} au ${to}`;
    }

    const today = todayStr();
    const totalT  = tasks.length;
    const doneT   = tasks.filter(t => t.status === 'Terminé').length;
    const inProg  = tasks.filter(t => t.status === 'En cours').length;
    const todoT   = tasks.filter(t => t.status === 'À faire').length;
    const overdue = tasks.filter(t => t.status !== 'Terminé' && t.dateLimit && t.dateLimit < today);
    const lateStart = tasks.filter(t => t.status === 'À faire' && t.dateStart && t.dateStart <= today);
    const rate = totalT ? Math.round(doneT * 100 / totalT) : 0;
    const rateMod = rate >= 70 ? 'ok' : (rate >= 40 ? 'warn' : 'danger');

    const completedTasks = tasks.filter(t => t.status === 'Terminé' && t.closeDate && t.dateAssigned);
    const avgDays = completedTasks.length
      ? Math.round(completedTasks.reduce((s,t) => s + Math.max(0, daysBetween(t.dateAssigned, t.closeDate)), 0) / completedTasks.length)
      : 0;
    const lateClose = completedTasks.filter(t => t.dateLimit && t.closeDate > t.dateLimit).length;
    const lateRate  = completedTasks.length ? Math.round(lateClose * 100 / completedTasks.length) : 0;

    let html = '<div class="kpi-grid">';
    html += kpiCard('Total',     totalT,         'Tâches enregistrées',                '', 'all', 'Cliquer pour détail');
    html += kpiCard('Terminées', doneT,          rate + '% de complétion',             rateMod, 'done', 'Cliquer pour détail');
    html += kpiCard('En cours',  inProg,         '',                                   '', 'in_progress', 'Cliquer pour détail');
    html += kpiCard('À faire',   todoT,          '',                                   '', 'todo', 'Cliquer pour détail');
    html += kpiCard('En retard', overdue.length, 'Échéance dépassée',                  overdue.length > 0 ? 'danger' : '', 'overdue', 'Cliquer pour détail');
    html += kpiCard('Démarrage tardif', lateStart.length, 'Pas commencées à temps',    lateStart.length > 0 ? 'warn' : '', 'late_start', 'Cliquer pour détail');
    html += kpiCard('Délai moyen', avgDays + 'j', avgDays > 0 ? 'Pour terminer' : '—', '');
    html += kpiCard('Retard de clôture', lateRate + '%', lateClose + ' livraison(s) en retard sur ' + completedTasks.length, lateRate > 30 ? 'warn' : '');
    html += '</div>';

    // Évolution
    html += `<div class="dash-section">
      <h3>📈 Évolution dans le temps</h3>
      ${buildEvolutionChart(tasks, period)}
      <details class="evo-details"><summary>Voir le tableau détaillé</summary>
        <div>${buildEvolutionTable(tasks, period)}</div>
      </details>
    </div>`;

    // Charge par département
    const byDept = {};
    tasks.forEach(t => {
      if (!t.department) return;
      if (!byDept[t.department]) byDept[t.department] = { total: 0, done: 0, late: 0 };
      byDept[t.department].total++;
      if (t.status === 'Terminé') byDept[t.department].done++;
      if (t.status !== 'Terminé' && t.dateLimit && t.dateLimit < today) byDept[t.department].late++;
    });
    const depts = Object.entries(byDept).sort((a,b) => b[1].total - a[1].total);
    const maxDept = depts.length ? depts[0][1].total : 1;

    html += '<div class="dash-section"><h3>🏢 Charge par département <span class="count">' + depts.length + '</span></h3>';
    if (!depts.length) html += '<div class="empty">Aucune donnée</div>';
    else {
      html += `<div class="table-wrap" style="border:none;"><table>
        <thead><tr><th>Département</th><th>Charge</th><th>Terminées</th><th>En retard</th></tr></thead><tbody>`;
      depts.forEach(([dept, s]) => {
        const completion = s.total ? Math.round(s.done*100/s.total) : 0;
        const pct = Math.round(s.total*100/maxDept);
        html += `<tr>
          <td data-label="Département"><strong>${escapeHtml(dept)}</strong></td>
          <td data-label="Charge"><div class="charge-bar"><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span class="bar-num">${s.total}</span></div></td>
          <td data-label="Terminées">${s.done} (${completion}%)</td>
          <td data-label="En retard">${s.late > 0 ? '<span class="badge badge-overdue">'+s.late+'</span>' : '—'}</td>
        </tr>`;
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';

    // Top retards
    if (overdue.length) {
      const top = overdue.sort((a,b) => (a.dateLimit < b.dateLimit ? -1 : 1)).slice(0, 6);
      html += '<div class="dash-section"><h3>⚠ Top tâches en retard <span class="count">' + overdue.length + '</span></h3>';
      html += `<div class="table-wrap" style="border:none;"><table>
        <thead><tr><th>ID</th><th>Description</th><th>Destinataire</th><th>Échéance</th><th>Retard</th></tr></thead><tbody>`;
      top.forEach(t => {
        const days = daysBetween(t.dateLimit, today);
        html += `<tr>
          <td data-label="ID"><strong>${escapeHtml(t.id)}</strong></td>
          <td data-label="Description">${escapeHtml(t.description)}</td>
          <td data-label="Destinataire">${escapeHtml(t.recipient)}</td>
          <td data-label="Échéance"><span class="badge badge-overdue">${escapeHtml(t.dateLimit)}</span></td>
