  .evo-details { margin-top: 16px; border-top: 1px solid #e8eaed; padding-top: 12px; }
  .evo-details summary { cursor: pointer; font-size: 13px; color: #1a73e8;
                          font-weight: 500; padding: 6px 0; user-select: none;
                          list-style: none; }
  .evo-details summary::-webkit-details-marker { display: none; }
  .evo-details summary::before { content: '▸ '; transition: transform .15s; display: inline-block; }
  .evo-details[open] summary::before { content: '▾ '; }
  .evo-details > div { margin-top: 10px; }

  /* ─────────────── ANNUAIRE ─────────────── */
  .annuaire-card { background: #fff; border: 1px solid #dadce0; border-radius: 8px; padding: 14px;
                   margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
  .annuaire-avatar { width: 44px; height: 44px; border-radius: 50%; background: #1a73e8;
                     color: #fff; display: flex; align-items: center; justify-content: center;
                     font-weight: 500; flex-shrink: 0; }
  .annuaire-info      { flex: 1; min-width: 0; }
  .annuaire-info .nm  { font-weight: 500; }
  .annuaire-info .meta { font-size: 12px; color: #5f6368; }
  .annuaire-mail { font-size: 12px; color: #1a73e8; word-break: break-all; }

  /* ─────────────── EMPTY STATE ─────────────── */
  .empty-state { text-align: center; padding: 50px 20px; color: #5f6368; }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state h4 { font-size: 16px; margin-bottom: 6px; color: #202124; }

  /* ─────────────── ACCESS LINK MODAL ─────────────── */
  .link-display { background: #f8f9fa; border: 1px solid #dadce0; border-radius: 6px;
                  padding: 12px; word-break: break-all; font-family: monospace; font-size: 12px;
                  margin: 12px 0; }

  /* ─────────────── ✨ v5.3 : VUE PAR DIRECTEUR ─────────────── */
  .dir-card { background: #fff; border: 1px solid #dadce0; border-radius: 12px;
              padding: 16px; margin-bottom: 12px; cursor: pointer;
              transition: box-shadow .2s, transform .2s; }
  .dir-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1); transform: translateY(-2px); border-color: #1a73e8; }
  .dir-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .dir-avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg,#137333,#0d652d);
                color: #fff; display: flex; align-items: center; justify-content: center;
                font-weight: bold; font-size: 18px; flex-shrink: 0; }
  .dir-card-info { flex: 1; min-width: 0; }
  .dir-card-info .nm { font-size: 15px; font-weight: 600; color: #202124; margin-bottom: 2px; }
  .dir-card-info .dpt { font-size: 12px; color: #5f6368; }
  .dir-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
  .dir-stat { background: #f8f9fa; border-radius: 6px; padding: 10px; text-align: center; }
  .dir-stat .lbl { font-size: 10px; color: #5f6368; text-transform: uppercase; margin-bottom: 3px; letter-spacing: .3px; }
  .dir-stat .val { font-size: 18px; font-weight: 600; color: #202124; }
  .dir-stat.warn .val { color: #b06000; }
  .dir-stat.danger .val { color: #c5221f; }
  .dir-stat.ok .val { color: #137333; }
  .dir-stat.info .val { color: #1a73e8; }

  .perf-score { display: inline-block; padding: 4px 12px; border-radius: 14px;
                font-weight: 700; font-size: 13px; }
  .perf-score.excellent { background: #e6f4ea; color: #137333; }
  .perf-score.good      { background: #e8f0fe; color: #1967d2; }
  .perf-score.average   { background: #fef7e0; color: #b06000; }
  .perf-score.poor      { background: #fce8e6; color: #c5221f; }

  /* ─────────────── ✨ v5.5 : MESSAGERIE / CHAT ─────────────── */
  .chat-container { background: #f8f9fa; border-radius: 8px; padding: 12px;
                    max-height: 320px; overflow-y: auto; margin-bottom: 12px;
                    border: 1px solid #e8eaed; }
  .chat-message { background: #fff; padding: 10px 12px; border-radius: 8px;
                  margin-bottom: 8px; border: 1px solid #e8eaed; }
  .chat-message.own { background: #e8f0fe; border-color: #c2dafd; margin-left: 20px; }
  .chat-message-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
                          font-size: 12px; color: #5f6368; }
  .chat-message-author { font-weight: 600; color: #1a73e8; }
  .chat-message.own .chat-message-author { color: #137333; }
  .chat-message-date { font-size: 11px; color: #9aa0a6; }
  .chat-message-text { font-size: 13px; color: #202124; white-space: pre-wrap; word-wrap: break-word; line-height: 1.4; }
  .chat-message-actions { float: right; }
  .chat-message-actions button { background: none; border: none; cursor: pointer;
                                  font-size: 12px; padding: 2px 6px; color: #9aa0a6;
                                  border-radius: 3px; }
  .chat-message-actions button:hover { background: #fce8e6; color: #c5221f; }
  .chat-empty { text-align: center; padding: 20px; color: #9aa0a6; font-style: italic; font-size: 13px; }
  .chat-form { display: flex; gap: 8px; }
  .chat-form textarea { flex: 1; min-height: 60px; max-height: 120px; }
  .chat-form button { align-self: stretch; }
  .chat-badge { display: inline-flex; align-items: center; gap: 4px;
                padding: 2px 8px; border-radius: 12px; font-size: 11px;
                background: #e8f0fe; color: #1557b0; font-weight: 500;
                cursor: pointer; transition: all .15s; }
  .chat-badge:hover { background: #d2e3fc; }

  /* ─────────────── ✨ v5.5 : ASSIGNATION ÉQUIPE ─────────────── */
  .team-mode-tabs { display: flex; gap: 4px; margin-bottom: 12px;
                     background: #f1f3f4; padding: 4px; border-radius: 8px; }
  .team-mode-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer;
                    border-radius: 6px; font-size: 13px; font-weight: 500; color: #5f6368;
                    transition: all .15s; user-select: none; }
  .team-mode-tab:hover { background: rgba(255,255,255,.5); }
  .team-mode-tab.active { background: #fff; color: #1a73e8; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .team-members-list { max-height: 200px; overflow-y: auto; border: 1px solid #dadce0;
                        border-radius: 6px; padding: 8px; background: #fafbfc; }
  .team-member-chk { display: flex; align-items: center; gap: 8px; padding: 6px 8px;
                      border-radius: 4px; cursor: pointer; font-size: 13px; }
  .team-member-chk:hover { background: #e8f0fe; }
  .team-member-chk input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; }
  .team-summary { background: #e8f5e9; border-left: 4px solid #137333;
                   padding: 10px 14px; border-radius: 0 6px 6px 0; margin-top: 10px;
                   font-size: 13px; color: #0d652d; }
  .badge-team { background: #137333; color: #fff; font-size: 10px;
                 padding: 2px 6px; margin-left: 6px; }
  .badge-attach { background: #9c27b0; color: #fff; font-size: 10px;
                 padding: 2px 6px; margin-left: 6px; }
  /* ✨ v6.6 : pagination */
  .pager { display: flex; align-items: center; justify-content: center; gap: 14px;
           padding: 12px 8px; flex-wrap: wrap; }
  .pager-btn { background: #fff; border: 1px solid #dadce0; color: #1a73e8;
               border-radius: 8px; padding: 7px 16px; font-size: 13px; font-weight: 600;
               cursor: pointer; font-family: inherit; transition: all .15s; }
  .pager-btn:hover:not(:disabled) { background: #e8f0fe; border-color: #1a73e8; }
  .pager-btn:disabled { color: #bdc1c6; cursor: default; opacity: .6; }
  .pager-info { font-size: 12px; color: #5f6368; }

  /* ─────────────── ✨ v6.0 : TABLEAU DE BORD PERSONNEL ─────────────── */
  .db-perso-header { background: linear-gradient(135deg,#1a73e8,#1557b0);
                      padding: 22px 24px; border-radius: 14px; color: #fff;
                      margin-bottom: 18px; box-shadow: 0 4px 14px rgba(26,115,232,.25); }
  .db-greeting { font-size: 22px; font-weight: 500; margin-bottom: 4px; }
  .db-subtitle { font-size: 13px; opacity: 0.9; }
  .db-section-title { font-size: 17px; font-weight: 600; margin: 22px 0 10px;
                       color: #202124; display: flex; align-items: center; gap: 8px; }
  .kpi-static { cursor: default; }
  .kpi-static::after { content: none; }
  .kpi-static:hover { box-shadow: 0 1px 4px rgba(0,0,0,.08); transform: none; }

  .db-task-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .db-task-item { background: #fff; border: 1px solid #dadce0; border-radius: 8px;
                   padding: 12px 14px; cursor: pointer; transition: all .15s;
                   border-left: 4px solid #1a73e8; }
  .db-task-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); transform: translateX(2px); }
  .db-task-item.urgent.danger { border-left-color: #c5221f; background: #fef7f6; }
  .db-task-item.urgent.info { border-left-color: #1a73e8; }
  .db-task-id { font-size: 11px; color: #5f6368; font-weight: 600; margin-bottom: 2px; }
  .db-task-desc { font-size: 14px; color: #202124; margin-bottom: 6px; }
  .db-task-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; }

  /* ─────────────── ✨ v6.0 : TÂCHE D'ÉQUIPE MEMBRES ─────────────── */
  .team-members-detail { display: flex; flex-direction: column; gap: 8px; }
  .team-member-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px;
                      align-items: center; padding: 10px 12px;
                      background: #fff; border: 1px solid #dadce0; border-radius: 8px; }
  .team-member-row.is-me { background: #e8f0fe; border-color: #c2dafd; }
  .team-member-info { min-width: 0; }
  .team-member-name { font-size: 13px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .team-member-status select { font-size: 11px; padding: 4px 8px; min-height: 26px; }
  .team-member-report { display: flex; gap: 4px; align-items: center; }

  @media (max-width: 640px) {
    .team-member-row { grid-template-columns: 1fr; }
    .team-member-status, .team-member-report { justify-self: stretch; }
  }

  /* ─────────────── ✨ v6.0 : OBJECTIFS ÉTOFFÉS ─────────────── */
  .obj-card { cursor: pointer; }
  .obj-card .obj-actions button { z-index: 2; position: relative; }
  .obj-dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                    gap: 10px; margin-bottom: 18px; }
  .obj-comments-count { display: inline-flex; align-items: center; gap: 3px;
                         font-size: 11px; color: #1a73e8; margin-left: 6px;
                         padding: 2px 6px; background: #e8f0fe; border-radius: 10px; }

  /* ─────────────── ✨ v5.5 : OBJECTIFS ─────────────── */
  .obj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
              gap: 12px; margin-top: 12px; }
  .obj-card { background: #fff; border: 1px solid #dadce0; border-radius: 12px;
              padding: 16px; position: relative; transition: box-shadow .2s; }
  .obj-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.08); }
  .obj-card .obj-type-badge { position: absolute; top: 10px; right: 10px;
                               font-size: 10px; padding: 2px 8px; border-radius: 10px;
                               font-weight: 600; }
  .obj-card.type-perso .obj-type-badge { background: #e8f0fe; color: #1557b0; }
  .obj-card.type-dept  .obj-type-badge { background: #f3e8ff; color: #6f1ea3; }
  .obj-card.type-perso { border-left: 4px solid #1a73e8; }
  .obj-card.type-dept  { border-left: 4px solid #9c27b0; }
  .obj-card .obj-title { font-size: 15px; font-weight: 600; margin-bottom: 4px;
                          padding-right: 80px; color: #202124; }
  .obj-card .obj-target { font-size: 12px; color: #5f6368; margin-bottom: 8px; }
  .obj-card .obj-desc { font-size: 12px; color: #5f6368; line-height: 1.5;
                         margin-bottom: 10px; max-height: 60px; overflow: hidden;
                         display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .obj-card .obj-progress-wrap { background: #f1f3f4; height: 8px; border-radius: 4px;
                                  overflow: hidden; margin-bottom: 6px; }
  .obj-card .obj-progress-fill { height: 100%; background: linear-gradient(90deg,#1a73e8,#137333);
                                  transition: width .3s; }
  .obj-card .obj-progress-fill.full { background: #137333; }
  .obj-card .obj-meta { display: flex; justify-content: space-between; align-items: center;
                         font-size: 11px; color: #5f6368; margin-top: 6px; }
  .obj-card .obj-dates { font-size: 11px; color: #5f6368; }
  .obj-card .obj-actions { display: flex; gap: 4px; margin-top: 10px; padding-top: 10px;
                            border-top: 1px solid #f1f3f4; justify-content: flex-end; }
  .obj-status-badge { display: inline-block; padding: 2px 8px; border-radius: 10px;
                       font-size: 10px; font-weight: 600; }
  .obj-status-encours  { background: #e8f0fe; color: #1967d2; }
  .obj-status-atteint  { background: #e6f4ea; color: #137333; }
  .obj-status-echec    { background: #fce8e6; color: #c5221f; }
  .obj-status-abandon  { background: #f1f3f4; color: #5f6368; }
  .obj-section { margin-bottom: 24px; }
  .obj-section h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px;
                     color: #202124; display: flex; align-items: center; gap: 8px; }
  .obj-section h3 .count { background: #f1f3f4; color: #5f6368; font-size: 11px;
                            padding: 2px 8px; border-radius: 10px; font-weight: 500; }

  /* ─────────────── ✨ v5.4 : SECTIONS DE TÂCHES & ALERTES ─────────────── */
  .task-section { margin-bottom: 18px; }
  .task-section-header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px; border-radius: 8px 8px 0 0;
    background: linear-gradient(135deg,#f0f6ff,#e8f0fe);
    border: 1px solid #c2dafd; border-bottom: none;
    font-weight: 600; color: #1557b0;
    margin-top: 4px;
  }
  .task-section-header .icon { font-size: 18px; }
  .task-section-header .lbl  { flex: 1; font-size: 14px; }
  .task-section-header .count {
    background: #1a73e8; color: #fff; font-size: 12px;
    padding: 2px 10px; border-radius: 10px; font-weight: 600;
  }
  .task-section-header.received  { background: linear-gradient(135deg,#e8f0fe,#d2e3fc); }
  .task-section-header.assigned  { background: linear-gradient(135deg,#e6f4ea,#ceead6); border-color: #b7dfb9; color: #0d652d; }
  .task-section-header.assigned .count { background: #137333; }
  .task-section-header.others   { background: linear-gradient(135deg,#f8f9fa,#f1f3f4); border-color: #dadce0; color: #5f6368; }
  .task-section-header.others .count { background: #5f6368; }

  .task-section-toggle {
    width: 100%; text-align: left; padding: 14px 18px;
    background: linear-gradient(135deg,#f8f9fa,#f1f3f4);
    border: 1px dashed #bdc1c6; border-radius: 8px;
    cursor: pointer; font-family: inherit; font-size: 14px;
    color: #5f6368; transition: all .15s;
    display: flex; align-items: center; gap: 10px;
  }
  .task-section-toggle:hover { background: #e8eaed; border-color: #5f6368; color: #202124; }
  .task-section-toggle .arrow { font-size: 12px; transition: transform .2s; }
  .task-section-toggle.expanded .arrow { transform: rotate(90deg); }

  .alert-banner {
    padding: 10px 14px; margin-bottom: 14px; border-radius: 6px;
    display: flex; align-items: center; gap: 10px; font-size: 13px;
    font-weight: 500;
  }
  .alert-banner.danger {
    background: #fce8e6; border-left: 4px solid #c5221f; color: #c5221f;
  }
  .alert-banner.warn {
    background: #fef7e0; border-left: 4px solid #f9ab00; color: #b06000;
  }
  .alert-banner .icon { font-size: 18px; }
  .alert-banner .grow { flex: 1; }
  .alert-banner .alert-link {
    color: inherit; text-decoration: underline; cursor: pointer; font-weight: 600;
  }

  /* Bandeau coloré sur les lignes en alerte */
  tr.row-overdue td { border-left: 3px solid #c5221f !important; }
  tr.row-overdue td:first-child { box-shadow: inset 3px 0 0 #c5221f; }
  tr.row-late-start td { border-left: 3px solid #f9ab00 !important; }
  tr.row-late-start td:first-child { box-shadow: inset 3px 0 0 #f9ab00; }

  /* Badge compteur d'alertes sur l'onglet Tâches */
  nav.tabs button .tab-badge {
    display: inline-block; margin-left: 6px;
    background: #c5221f; color: #fff; font-size: 11px;
    padding: 1px 8px; border-radius: 10px; font-weight: 600;
    line-height: 1.4;
  }
  nav.tabs button .tab-badge.warn { background: #f9ab00; }

  @media (max-width: 640px) {
    .task-section-header { padding: 8px 12px; font-size: 13px; }
    .task-section-header .lbl { font-size: 13px; }
    .task-section-toggle { padding: 10px 14px; font-size: 13px; }
    .alert-banner { padding: 8px 12px; font-size: 12px; }
    tr.row-overdue td:first-child,
    tr.row-late-start td:first-child { box-shadow: none; }
  }

  @media (max-width: 900px) {
    .kpi-grid  { grid-template-columns: repeat(2, 1fr); }
    .kpi-value { font-size: 22px; }
  }

  @media (max-width: 640px) {
    main    { padding: 12px; }
    header  { padding: 10px 12px; }
    .brand h1 { font-size: 16px; }
    .brand .logo { width: 28px; height: 28px; font-size: 14px; }
    .user-info .role  { display: none; }
    .user-info .name  { max-width: 100px; font-size: 12px; }
    .user-info .avatar { width: 32px; height: 32px; font-size: 12px; }
    nav.tabs { padding: 0 8px; }
    nav.tabs button { padding: 12px 12px; font-size: 13px; }
    .page-title { font-size: 18px; }
    .page-sub   { font-size: 12px; margin-bottom: 14px; }

    .toolbar .grow { display: none; }
    .search-box, .filter-sel { max-width: 100%; min-width: 0; width: 100%; }
    .toolbar button.btn { width: 100%; }
    .form-row.two-cols { grid-template-columns: 1fr; gap: 14px; }

    .kpi-value { font-size: 20px; }
    .kpi-label { font-size: 10px; }
    .kpi-sub   { font-size: 10px; }
    .table-wrap { border: none; border-radius: 0; background: transparent; overflow: visible; }
    .table-wrap table, .table-wrap thead, .table-wrap tbody,
    .table-wrap tr, .table-wrap td { display: block; min-width: 0; }

                     margin-bottom: 10px; padding: 10px 12px; }

    .table-wrap td { padding: 6px 0; border: none; text-align: left !important; white-space: normal;

    .table-wrap td.actions:before { display: none; }

  @media (max-width: 380px) {
    .kpi-grid { grid-template-columns: 1fr; }
    .user-info > div:first-child { display: none; }

  /* ─────────────── DRAWER DÉTAIL TÂCHE ─────────────── */
  .task-detail-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 3000;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; animation: fadeIn .15s ease;
  }
  .task-detail-card {
    background: #fff; width: 100%; max-width: 680px;
    max-height: 90vh; border-radius: 16px; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 8px 40px rgba(0,0,0,.25);

  .tdc-section { margin-bottom: 18px; }

  /* ─────────────── ✨ v6.7 : ROUTINE JOURNALIÈRE ─────────────── */
  .daily-modes { display: flex; gap: 8px; margin: 14px 0 4px; }

  /* Modale de gestion */

  .comp-num { font-size: 11px; font-weight: 600; }
  .comp-num.ok { color: #137333; } .comp-num.warn { color: #b06000; } .comp-num.danger { color: #c5221f; }

  /* Détail jour par jour (modale) */
  .dd-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;

    <div class="brand">
      <div class="logo" id="app-logo">T</div>
      <h1>LA TERMITIERE</h1>
    </div>
    <div class="user-info">
      <div style="text-align:right;min-width:0;">
        <div class="name" id="user-name">—</div>
        <div class="role" id="user-role">—</div>
      </div>
      <div class="avatar" id="user-avatar">?</div>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="main-content"></main>
</div>

<datalist id="depts-datalist"></datalist>
<datalist id="cats-datalist"></datalist>
<script>
  // ═════════════════════════════════════════════════════════════════
  //  RÉCUPÉRATION DU TOKEN
  // ═════════════════════════════════════════════════════════════════
  function getTokenFromUrl() {
    const meta = document.querySelector('meta[name="server-token"]');
    if (meta) {
      const t = (meta.getAttribute('content') || '').trim();
      if (t) return t;
    }
    const hash = window.location.hash;
    if (hash && hash.includes('token=')) {
      try { return decodeURIComponent(hash.split('token=')[1].split('&')[0]); } catch(e) {}
    }
    try {
      const params = new URLSearchParams(window.location.search);
      const fromQuery = params.get('token');
      if (fromQuery) return fromQuery;
    } catch(e) {}
    return '';
  }

  const URL_TOKEN = getTokenFromUrl();

  // ✨ v6.9 : tâche cible d'un lien profond (notification e-mail → tâche précise)
  function getTaskFromUrl() {
    const meta = document.querySelector('meta[name="server-task"]');
    if (meta) {
      const v = (meta.getAttribute('content') || '').trim();
      if (v) return v;
    }
    try {
      const params = new URLSearchParams(window.location.search);
      const fromQuery = params.get('task');
      if (fromQuery) return fromQuery.trim();
    } catch (e) {}
    const hash = window.location.hash;
    if (hash && hash.includes('task=')) {
      try { return decodeURIComponent(hash.split('task=')[1].split('&')[0]).trim(); } catch (e) {}
    }
    return '';
  }
  const URL_TASK = getTaskFromUrl();

  // ✨ v6.9 : onglet cible d'un lien profond (ex. notification salaire → « Autorisation salaire »)
  function getViewFromUrl() {
    const meta = document.querySelector('meta[name="server-view"]');
    if (meta) {
      const v = (meta.getAttribute('content') || '').trim();
      if (v) return v;
    }
    try {
      const params = new URLSearchParams(window.location.search);
      const fromQuery = params.get('view');
      if (fromQuery) return fromQuery.trim();
    } catch (e) {}
    const hash = window.location.hash;
    if (hash && hash.includes('view=')) {
      try { return decodeURIComponent(hash.split('view=')[1].split('&')[0]).trim(); } catch (e) {}
    }
    return '';
  }
  const URL_VIEW = getViewFromUrl();

  // ═════════════════════════════════════════════════════════════════
  //  ÉTAT GLOBAL
  // ═════════════════════════════════════════════════════════════════
  const state = {
    user: null,
    tasks: [],
    personnel: [],
    objectifs: null,
    daily: null,            // ✨ v6.7 : { date, tasks:[{id,label,description,done,checkedAt,note}] }
    dailyMode: 'mine',      // ✨ v6.7 : 'mine' | 'team'
    archives: [],           // ✨ v6.7 : tâches archivées chargées (lecture seule)
    reports: [],            // ✨ rapports visibles pour l'utilisateur courant
    innovations: [],        // ✨ v7.0 : idées (visibles par tout le personnel)
    innovationFilter: '',   // ✨ v7.0 : '' = tous les statuts
    currentTab: '',
    tablePage: { received: 1, assigned: 1, others: 1 },   // ✨ v6.6 : pagination
    // ✨ v6.3 : cache client — horodatage (ms) du dernier chargement réussi de
    // chaque jeu de données. 0 = jamais chargé. Tant que la donnée est plus
    // fraîche que CLIENT_TTL, on évite l'aller-retour serveur (lent sur Apps
    // Script). Toute mutation force le rechargement (loadTasks(true)).
    loaded: { tasks: 0, personnel: 0, objectifs: 0, daily: 0 },
    filter: { search: '', status: '', priority: '', dept: '', taskType: '' },
    periods: {
      // ← "month" = 30 derniers jours glissants (cf. getPeriodBounds) : jamais vide
      // en début de mois calendaire, contrairement à un vrai découpage par mois.
      tasks:    { mode: 'month', from: null, to: null },
      dash:     { mode: 'month', from: null, to: null },
      perEmp:   { mode: 'month', from: null, to: null },
      perDir:   { mode: 'month', from: null, to: null },
      daily:    { mode: 'week', from: null, to: null }     // ✨ v6.7
    },
    // ✨ v7.1 : évaluation par niveau hiérarchique
    levelTab: 'all',        // 'all' | 1..6 — onglet de niveau affiché
    levelUnit: 'week',      // granularité de comparaison (cf. PERIOD_UNITS)
    myEvoUnit: 'week',      // idem pour « Mon évolution » (tableau de bord perso)
    // Cache des compteurs d'activité (RPC activity_events). `key` = fenêtre
    // demandée : tant qu'elle ne change pas, on ne rappelle pas le serveur.
    activity: { key: '', available: false, loading: false, byAuthor: {} }
  };

  function periodOf(view) { return state.periods[view] || state.periods.dash; }

  // ✨ v5.3 : 5 rôles distincts
  //   chef       : voit tout, modifie tout
  //   rh         : voit tout, modifie ce qui la concerne (vue globale via Par directeur)
  //   dir        : Directeur (simple) — voit tout, modifie ce qui le concerne, voit tous les directeurs
  //   dept_head  : Chef de département — ne voit QUE ses tâches assignées/reçues
  //                ✨ v6.8 : plus d'accès à « Par directeur » (réservé aux directeurs + RH)
  //   emp        : Employé — ne voit QUE ses tâches assignées/reçues
  const ROLE_CONFIG = {
    chef:      ['Tableau de bord', 'Tâches', 'Routine journalière', 'Personnel', 'Pilotage', 'Par employé', 'Par directeur', 'Objectifs', 'Rapports', 'Archives'],
    dir:       ['Tableau de bord', 'Tâches', 'Routine journalière', 'Annuaire', 'Par employé', 'Par directeur', 'Objectifs', 'Rapports', 'Archives'],
    dept_head: ['Tableau de bord', 'Tâches', 'Routine journalière', 'Annuaire', 'Objectifs', 'Rapports', 'Archives'],
    rh:        ['Tableau de bord', 'Tâches', 'Routine journalière', 'Personnel', 'Par directeur', 'Objectifs', 'Rapports', 'Archives'],
    emp:       ['Tableau de bord', 'Mes tâches', 'Routine journalière', 'Objectifs', 'Rapports', 'Archives']
  };

  // ═════════════════════════════════════════════════════════════════
  //  UTILITAIRES
  // ═════════════════════════════════════════════════════════════════
  // ✨ v7.0 : ce fichier sert DEUX backends — Apps Script et la plateforme Supabase.
  // Les écrans dont seul Supabase a les handlers sont donc conditionnés à un
  // indicateur que cette couche pose sur la session ; sous Apps Script il est absent
  // et l'écran reste simplement masqué au lieu de casser.
  function hasFeature(name) {
    const u = state.user || {};
    return !!(u.features && u.features[name]);
  }

  // ✨ v7.0.1 : verrou anti double-soumission. Les modales de création restent
  // ouvertes quand le serveur renvoie une erreur ; sans ce garde-fou, un second
  // clic (ou un clic impatient pendant l'envoi) crée un doublon.
  const _submitting = {};
  function beginSubmit(key) {
    if (_submitting[key]) return false;
    _submitting[key] = true;
    return true;
  }
  function endSubmit(key) { delete _submitting[key]; }

  function $(id) { return document.getElementById(id); }
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function initials(name) {
    return String(name || '?').trim().split(/\s+/).slice(0, 2)
      .map(w => w[0] ? w[0].toUpperCase() : '').join('') || '?';
  }
  function showLoader(text) {
    $('loader-text').textContent = text || 'Chargement…';
    $('loader').classList.remove('hidden');
  }
  function hideLoader() { $('loader').classList.add('hidden'); }
  function toast(msg, type) {
    const div = document.createElement('div');
    div.className = 'toast-msg toast-' + (type || 'info');
    div.textContent = msg;
    $('toast').appendChild(div);
    setTimeout(() => { div.style.opacity = '0'; setTimeout(() => div.remove(), 200); }, 3200);
  }
  function call(fnName) {
    const args = Array.prototype.slice.call(arguments, 1);
    // ✨ Migration Supabase : tout passe par la couche API (window.__termitiereCall)
    if (!window.__termitiereCall) return Promise.reject(new Error('API non initialisée'));
    return window.__termitiereCall(fnName, args);
  }
  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function daysBetween(a, b) {
    return Math.floor((new Date(b) - new Date(a)) / (1000*60*60*24));
  }
  function isOverdue(task) {
    if (task.status === 'Terminé') return false;
    if (!task.dateLimit) return false;
    return new Date(task.dateLimit) < new Date(todayStr());
  }

  function startDateState(task) {
    if (!task.dateStart) return 'none';
    if (task.status === 'En cours' || task.status === 'Terminé') return 'started';
    const today = todayStr();
    if (task.dateStart <= today && task.status === 'À faire') return 'late';
    return 'future';
  }

  // ═════════════════════════════════════════════════════════════════
  //  AUTH FLOW
  // ═════════════════════════════════════════════════════════════════
  async function bootstrap() {
    showLoader('Connexion…');
    if (!URL_TOKEN) {
      hideLoader();
      $('magic-page').style.display = 'flex';
      $('magic-error').innerHTML =
        '<div class="msg-err">Aucun token détecté. Utilisez votre lien d\'accès personnel.</div>';
      return;
    }

    // ✨ v6.0 : timeout de sécurité (40 secondes) au cas où l'appel reste bloqué
    let timeoutId = setTimeout(() => {
      hideLoader();
      $('magic-page').style.display = 'flex';
      $('magic-error').innerHTML =
        '<div class="msg-err">⚠ Le chargement prend trop de temps. Causes possibles :<br>' +
        '• La feuille Google Sheet n\'est pas accessible<br>' +
        '• L\'application n\'a pas encore été déployée correctement<br>' +
        '• Une nouvelle autorisation est requise<br><br>' +
        'Essayez de recharger la page. Si le problème persiste, contactez l\'administrateur.</div>';
    }, 40000);

    try {
      // ✨ v6.0 : un seul appel bootstrapApp au lieu de 2 (getCurrentUser + getTasks + getPersonnel)
      const res = await call('bootstrapApp', URL_TOKEN);
      clearTimeout(timeoutId);
      if (!res.success) {
        hideLoader();
        $('magic-page').style.display = 'flex';
        $('magic-error').innerHTML =
          '<div class="msg-err">' + escapeHtml(res.error || 'Erreur d\'authentification') + '</div>';
        return;
      }
      state.user = res.user;
      state.tasks = res.tasks || [];
      state.personnel = res.personnel || [];
      // ✨ v6.3 : bootstrapApp a déjà chargé tâches + personnel → on les marque
      // frais pour éviter un rechargement immédiat au premier rendu d'onglet.
      state.loaded.tasks = Date.now();
      state.loaded.personnel = Date.now();
      // ✨ v6.7 : routine du jour préchargée par bootstrapApp
      if (res.daily) { state.daily = res.daily; state.loaded.daily = Date.now(); }
      refreshCatsDatalist();
      $('user-name').textContent  = state.user.name || '—';
      $('user-role').textContent  = userDisplayRole();
      $('user-avatar').textContent = initials(state.user.name);
      $('app').classList.add('visible');
      renderTabs();
      const tabs = menuTabs();
      // ✨ v6.9 : liens profonds — tâche précise, sinon onglet ciblé, sinon 1er onglet
      if (URL_TASK) openTaskFromDeepLink(URL_TASK);
      else if (URL_VIEW) openViewFromDeepLink(URL_VIEW);
      else if (tabs.length) setTab(tabs[0]);
      hideLoader();
      if (res.warning) toast(res.warning, 'error');
    } catch (err) {
      clearTimeout(timeoutId);
      hideLoader();
      $('magic-page').style.display = 'flex';
      $('magic-error').innerHTML =
        '<div class="msg-err">Erreur réseau : ' + escapeHtml(err.message || err) + '</div>';
    }
  }

  function roleLabel(r) {
    return ({
      chef: 'Chef Administrateur',
      dir: 'Directeur',
      dept_head: 'Chef de département',
      rh: 'DA-RH',
      emp: 'Employé'
    })[r] || 'Utilisateur';
  }

  // ✨ v6.8 : libellé affiché du rôle, en tenant compte des dénominations
  // (PAU / GE / DF / Assistante RH) qui partagent les droits d'un rôle de base.
  function userDisplayRole() {
    const u = state.user || {};
    if (u.salaryRole === 'df')  return 'Directeur Financier (DF)';
    if (u.salaryRole === 'ge')  return 'Gérant (GE)';
    if (u.salaryRole === 'pau') return 'Personne Autorisée (PAU)';
    if (u.role === 'emp' && u.seeAllTasks) return (u.roleRaw || '').trim() || 'Assistante RH';
    return roleLabel(u.role);
  }

  // ✨ v6.8 : onglet « Mes tâches » (employé strict) vs « Tâches » (vue globale).
  function myTasksTab() {
    const u = state.user || {};
    return (u.role === 'emp' && !u.seeAllTasks) ? 'Mes tâches' : 'Tâches';
  }

  // ✨ v6.8 : menu effectif = ROLE_CONFIG + ajustements (Assistante RH → vue
  // globale des tâches ; onglet « Autorisation salaire » pour RH/DF/GE/PAU/admin).
  function menuTabs() {
    const u = state.user || {};
    const base = (ROLE_CONFIG[u.role] || []).slice();
    if (u.role === 'emp' && u.seeAllTasks) {
      const i = base.indexOf('Mes tâches');
      if (i !== -1) base[i] = 'Tâches';
      // ✨ Assistante RH : voit aussi tout le personnel (lecture seule, cf. renderPersonnelView).
      if (base.indexOf('Personnel') === -1) base.splice(base.indexOf('Tâches') + 1, 0, 'Personnel');
    }
    // ✨ v7.2 : l'onglet salaire est ouvert à TOUS — chacun demande pour lui-même et
    // suit sa demande. Les acteurs du circuit (RH/DF/GE/PAU) et le Chef y voient
    // toute l'entreprise ; les autres, leur seule ligne (cf. getSalaryAuthorizations
    // et la policy salary_select). Sous Apps Script, qui refuse encore l'accès aux
    // non-acteurs, le drapeau est absent et l'onglet reste réservé comme avant.
    if (u.salaryRole || u.role === 'chef' || hasFeature('salarySelf')) {
      if (base.indexOf('Autorisation salaire') === -1) {
        const ai = base.indexOf('Archives');
        if (ai !== -1) base.splice(ai, 0, 'Autorisation salaire');
        else base.push('Autorisation salaire');
      }
    }
    // ✨ v7.1 : « Par niveau » — évaluation des tâches par strate hiérarchique.
    // Réservé aux rôles qui disposent déjà d'une vue transverse (Chef, Directeurs,
    // DA-RH) : c'est la même portée de lecture que « Par directeur ». Chacun garde
    // sa propre courbe d'évolution dans son Tableau de bord, quel que soit son rôle.
    if (hasFeature('hierarchy') && ['chef', 'dir', 'rh'].indexOf(u.role) !== -1
        && base.indexOf('Par niveau') === -1) {
      const di = base.indexOf('Par directeur');
      if (di !== -1) base.splice(di + 1, 0, 'Par niveau');
      else base.splice(Math.max(0, base.indexOf('Objectifs')), 0, 'Par niveau');
    }
    // ✨ v7.0 : Innovation est ouvert à tous les rôles — c'est une boîte à idées.
    // Placé après Rapports, et seulement là où le backend sait le servir.
    if (hasFeature('innovation') && base.indexOf('Innovation') === -1) {
      const ri = base.indexOf('Rapports');
      if (ri !== -1) base.splice(ri + 1, 0, 'Innovation');
      else base.push('Innovation');
    }
    return base;
  }

  // ═════════════════════════════════════════════════════════════════
  //  TABS
  // ═════════════════════════════════════════════════════════════════
  function renderTabs() {
    const role = state.user.role;
    const tabs = menuTabs();
    // ✨ v5.4 : calculer le compteur d'alertes pour le badge de l'onglet Tâches
    const alerts = computeAlertCounts();
    const totalAlerts = alerts.overdue + alerts.lateStart;
    let badgeHtml = '';
    if (totalAlerts > 0) {
      const cls = alerts.overdue > 0 ? '' : 'warn';
      badgeHtml = `<span class="tab-badge ${cls}" title="${alerts.overdue} en retard · ${alerts.lateStart} démarrage tardif">${totalAlerts}</span>`;
    }
    $('tabs').innerHTML = tabs.map(t => {
      const isTaskTab = (t === 'Tâches' || t === 'Mes tâches');
      const badge = isTaskTab ? badgeHtml : '';
      return `<button data-tab="${escapeHtml(t)}" class="${state.currentTab === t ? 'active' : ''}">${escapeHtml(t)}${badge}</button>`;
    }).join('');
    $('tabs').querySelectorAll('button').forEach(b => {
      b.onclick = () => setTab(b.dataset.tab);
    });
  }

  // ✨ v5.4 : compte les tâches en alerte de l'utilisateur actuel
  function computeAlertCounts() {
    if (!state.tasks || !state.user) return { overdue: 0, lateStart: 0 };
    const me = state.user.name;
    const today = todayStr();
    let overdue = 0, lateStart = 0;
    state.tasks.forEach(t => {
      // Compter uniquement les tâches qui me concernent (reçues), pas celles que je vois en lecture
      if (t.recipient !== me) return;
      if (t.status === 'Terminé') return;
      if (t.dateLimit && t.dateLimit < today) overdue++;
      else if (t.status === 'À faire' && t.dateStart && t.dateStart <= today) lateStart++;
    });
    return { overdue, lateStart };
  }
  function setTab(name) {
    state.currentTab = name;
    state.filter = { search: '', status: '', priority: '', dept: '', taskType: '' };
    renderTabs();
    renderCurrent();
  }
  async function renderCurrent() {
    const t = state.currentTab;
    if (t === 'Tableau de bord') return renderDashboardPerso();   // ✨ v6.0
    if (t === 'Tâches' || t === 'Mes tâches') return renderTasksView();
    if (t === 'Personnel')   return renderPersonnelView();
    if (t === 'Annuaire')    return renderAnnuaire();
    if (t === 'Pilotage')    return renderDashboard();
    if (t === 'Par employé') return renderPerEmployee();
    if (t === 'Par directeur') return renderPerDirector();
    if (t === 'Par niveau')  return renderLevels();          // ✨ v7.1
    if (t === 'Autorisation salaire') return renderSalaryAuth();   // ✨ v6.8
    if (t === 'Objectifs')   return renderObjectifs();
    if (t === 'Routine journalière') return renderDaily();   // ✨ v6.7
    if (t === 'Rapports')    return renderReports();
    if (t === 'Innovation')  return renderInnovation();      // ✨ v7.0
    if (t === 'Archives')    return renderArchives();        // ✨ v6.7
  }

  function refreshCatsDatalist() {
    const set = new Set();
    state.tasks.forEach(t => { if (t.category && t.category.trim()) set.add(t.category.trim()); });
    const sorted = Array.from(set).sort();
    $('cats-datalist').innerHTML = sorted.map(c => `<option value="${escapeHtml(c)}">`).join('');
  }

  // ═════════════════════════════════════════════════════════════════
  //  VUE TÂCHES
  // ═════════════════════════════════════════════════════════════════
  // ✨ v6.3 : durée de vie du cache client (ms). Aligné sur le bundle serveur
  // (60 s). En deçà, un changement d'onglet réutilise les données en mémoire
  // au lieu de rappeler le serveur.
  const CLIENT_TTL = 60000;

  function cacheFresh(key) {
    return state.loaded[key] && (Date.now() - state.loaded[key]) < CLIENT_TTL;
  }

  // force=true : ignore le cache (à utiliser après toute mutation).
  async function loadTasks(force) {
    if (!force && cacheFresh('tasks')) return true;
    const res = await call('getTasks', URL_TOKEN);
    if (!res.success) { toast(res.error || 'Erreur', 'error'); return false; }
    state.tasks = res.tasks || [];
    state.loaded.tasks = Date.now();
    refreshCatsDatalist();
    // ✨ v5.4 : rafraîchir le badge d'alertes sur l'onglet
    if (state.user) renderTabs();
    return true;
  }

  // ✨ v6.3 : helpers de chargement avec cache (utilisés aussi par forceRefresh).
  async function loadPersonnel(force) {
    if (!force && state.personnel.length && cacheFresh('personnel')) return true;
    const r = await call('getPersonnel', URL_TOKEN);
    if (!r || !r.success) return false;
    state.personnel = r.personnel || [];
    state.loaded.personnel = Date.now();
    return true;
  }

  async function loadObjectifs(force) {
    if (!force && state.objectifs !== null && cacheFresh('objectifs')) return true;
    const res = await call('getObjectifs', URL_TOKEN);
    if (!res || !res.success) { state.objectifs = state.objectifs || []; return false; }
    state.objectifs = res.objectifs || [];
    state.loaded.objectifs = Date.now();
    return true;
  }

  // Invalide tout le cache client : le prochain chargement repassera par le serveur.
  function invalidateAll() {
    state.loaded.tasks = 0;
    state.loaded.personnel = 0;
    state.loaded.objectifs = 0;
    state.loaded.daily = 0;       // ✨ v6.7
  }

  // ═════════════════════════════════════════════════════════════════
  //  ✨ v6.4 : MISES À JOUR OPTIMISTES
  //  On applique le changement en mémoire et on re-rend AUSSITÔT (UI
  //  instantanée, sans loader ni re-fetch). L'appel serveur part en
  //  arrière-plan : en cas d'échec on restaure l'état (rollback) ; en cas
  //  de succès on invalide le cache pour resynchroniser au prochain rendu
  //  (récupère les champs calculés côté serveur : closeDate, etc.).
  //  Les clés de `changes` sont des champs de l'objet tâche.
  // ═════════════════════════════════════════════════════════════════
  function applyTaskPatch(taskId, changes) {
    const t = state.tasks.find(x => x.id === taskId);
    if (!t) return null;
    const snapshot = {};
    Object.keys(changes).forEach(k => { snapshot[k] = t[k]; t[k] = changes[k]; });
    return { task: t, snapshot: snapshot };
  }
  function revertTaskPatch(patch) {
    if (!patch) return;
    Object.keys(patch.snapshot).forEach(k => { patch.task[k] = patch.snapshot[k]; });
  }
  // Re-rend la table des tâches + le badge d'alertes (cohérent après mutation).
  // Défensif : la table n'est re-rendue que si son conteneur est présent
  // (les modals peuvent être ouvertes depuis un autre contexte que l'onglet Tâches).
  function rerenderAfterTaskMutation() {
    if ($('tasks-table')) renderTasksTable();
    // ✨ v7.0 : les actions (appréciation, renvoi…) peuvent partir de la fiche
    // « Par employé / Par directeur » — il faut donc rafraîchir sa table aussi.
    refreshEmpDetailIfOpen();
    if (state.user) renderTabs();
  }

  async function renderTasksView() {
    showLoader('Chargement des tâches…');
    const ok = await loadTasks();
    hideLoader();
    if (!ok) return;

    const role = state.user.role;
    // ✨ v5.3 : chef de département a la même vue restreinte qu'un employé
    // ✨ v6.8 : l'Assistante RH (emp + seeAllTasks) a la vue globale, pas restreinte
    const isRestrictedView = (role === 'emp' || role === 'dept_head') && !state.user.seeAllTasks;
    const isEmpView = isRestrictedView; // alias pour compatibilité avec le code existant
    // ✨ v5.3 : tout le monde peut créer une tâche (au minimum pour soi-même)
    const canCreate = true;
    // Filtres avancés uniquement pour rôles qui voient TOUTES les tâches
    const showTypeFilter = role === 'dir' || role === 'rh' || role === 'chef';

    let toolbar = '<div class="toolbar">';
    toolbar += `<input type="search" class="search-box" id="task-search" placeholder="🔍 Rechercher…" value="${escapeHtml(state.filter.search)}">`;
    toolbar += `<select class="filter-sel" id="task-status">
      <option value="">Tous statuts</option>
      <option value="À faire"  ${state.filter.status==='À faire' ?'selected':''}>À faire</option>
      <option value="En cours" ${state.filter.status==='En cours'?'selected':''}>En cours</option>
      <option value="Terminé"  ${state.filter.status==='Terminé' ?'selected':''}>Terminé</option>
    </select>`;
    toolbar += `<select class="filter-sel" id="task-prio">
      <option value="">Toutes priorités</option>
      <option value="Haute"   ${state.filter.priority==='Haute'  ?'selected':''}>Haute</option>
      <option value="Moyenne" ${state.filter.priority==='Moyenne'?'selected':''}>Moyenne</option>
      <option value="Basse"   ${state.filter.priority==='Basse'  ?'selected':''}>Basse</option>
    </select>`;
    if (showTypeFilter) {
      toolbar += `<select class="filter-sel" id="task-type">
        <option value=""               ${state.filter.taskType===''               ?'selected':''}>Toutes les tâches</option>
        <option value="assigned_by_me" ${state.filter.taskType==='assigned_by_me' ?'selected':''}>📤 Que j'ai assignées</option>
        <option value="assigned_to_me" ${state.filter.taskType==='assigned_to_me' ?'selected':''}>📥 Qui me sont assignées</option>
        <option value="related_to_me"  ${state.filter.taskType==='related_to_me'  ?'selected':''}>🔗 Qui me concernent</option>
        <option value="readonly"       ${state.filter.taskType==='readonly'       ?'selected':''}>👁 Lecture seule</option>
      </select>`;
    }
    toolbar += '<div class="grow"></div>';
    if (canCreate) toolbar += `<button class="btn btn-secondary" id="btn-new-team-task" title="Assigner à plusieurs personnes">👥 Équipe</button>`;
    if (canCreate) toolbar += `<button class="btn btn-primary" id="btn-new-task">+ Nouvelle tâche</button>`;
    toolbar += '</div>';

    let html = `<div class="page-title">${isEmpView ? 'Mes tâches' : 'Tâches'}</div>`;
    html += `<div class="page-sub">${isEmpView ? 'Tâches qui vous sont assignées + celles que vous vous êtes assignées' : tasksSubtitle(role)}</div>`;
    html += renderPeriodSelector('tasks', 'ps-info-tasks');
    html += toolbar;
    html += '<div id="tasks-table"></div>';
    $('main-content').innerHTML = html;

    wirePeriodSelector('tasks', renderTasksTable);

    $('task-search').oninput  = (e) => { state.filter.search   = e.target.value; resetTablePages(); renderTasksTable(); };
    $('task-status').onchange = (e) => { state.filter.status   = e.target.value; resetTablePages(); renderTasksTable(); };
    $('task-prio').onchange   = (e) => { state.filter.priority = e.target.value; resetTablePages(); renderTasksTable(); };
    if (showTypeFilter) {
      $('task-type').onchange = (e) => { state.filter.taskType = e.target.value; resetTablePages(); renderTasksTable(); };
    }
    if (canCreate) $('btn-new-task').onclick = () => openNewTaskModal();
    if (canCreate) $('btn-new-team-task').onclick = () => openNewTeamTaskModal();

    renderTasksTable();
  }

  function tasksSubtitle(role) {
    if (role === 'chef') return 'Vue d\'ensemble de toutes les tâches de l\'entreprise';
    if (role === 'dir' || role === 'rh') return 'Vue d\'ensemble : vous voyez toutes les tâches. Les tâches que vous pouvez modifier sont celles que vous avez assignées ou qui vous concernent.';
    return '';
  }

  // ✨ v6.6 : pagination de la liste des tâches
  const PAGE_SIZE = 12;
  function resetTablePages() { state.tablePage = { received: 1, assigned: 1, others: 1 }; }
  function pageOf(key, total) {
    const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    let cur = (state.tablePage && state.tablePage[key]) || 1;
    if (cur < 1) cur = 1;
    if (cur > pages) cur = pages;
    return cur;
  }
  function pageSlice(list, key) {
    const cur = pageOf(key, list.length);
    return list.slice((cur - 1) * PAGE_SIZE, cur * PAGE_SIZE);
  }
  function buildPager(key, total) {
    const pages = Math.ceil(total / PAGE_SIZE);
    if (pages <= 1) return '';
    const cur = pageOf(key, total);
    const start = (cur - 1) * PAGE_SIZE + 1;
    const end = Math.min(total, cur * PAGE_SIZE);
    // L'ancre invisible permet à gotoPage() de scroller exactement ici
    return `<div id="pager-anchor-${key}" style="scroll-margin-top:80px;">
      <div class="pager">
        <button class="pager-btn" ${cur <= 1 ? 'disabled' : ''} onclick="gotoPage('${key}',${cur - 1})">‹ Précédent</button>
        <span class="pager-info">${start}–${end} sur ${total} · page ${cur}/${pages}</span>
        <button class="pager-btn" ${cur >= pages ? 'disabled' : ''} onclick="gotoPage('${key}',${cur + 1})">Suivant ›</button>
      </div>
    </div>`;
  }
  function gotoPage(key, p) {
    if (!state.tablePage) state.tablePage = { received: 1, assigned: 1, others: 1 };
    state.tablePage[key] = p;

    // Mémoriser la position du paginateur de cette section AVANT le re-rendu
    // On cherche le bouton qui vient d'être cliqué via son data-pager-key
    const sectionAnchorId = 'pager-anchor-' + key;

    renderTasksTable();

    // Après re-rendu, scroller uniquement vers l'ancre de la section concernée
    requestAnimationFrame(() => {
      const anchor = $(sectionAnchorId);
      if (anchor) {
        anchor.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    });
  }

  function renderTasksTable() {
    const role = state.user.role;
    const me   = state.user.name;
    // ✨ v5.3 : chef de département a la même vue qu'un employé
    // ✨ v6.8 : l'Assistante RH voit toutes les tâches (vue globale, non restreinte)
    const isEmpView = (role === 'emp' || role === 'dept_head') && !state.user.seeAllTasks;

    const tasksPeriod = periodOf('tasks');
    let list = filterTasksByPeriod(state.tasks, tasksPeriod);

    const { from, to } = getPeriodBounds(tasksPeriod);
    const infoEl = $('ps-info-tasks');
    if (infoEl) {
      if (!from && !to) infoEl.textContent = `${list.length} tâche${list.length>1?'s':''} au total`;
      else infoEl.textContent = `${list.length} tâche${list.length>1?'s':''} · du ${from} au ${to}`;
    }

    const f = state.filter;
    if (f.search) {
      const q = f.search.toLowerCase();
      list = list.filter(t =>
        (t.description || '').toLowerCase().includes(q) ||
        (t.recipient   || '').toLowerCase().includes(q) ||
        (t.assignedByName || '').toLowerCase().includes(q) ||
        (t.id || '').toLowerCase().includes(q));
    }
    if (f.status)   list = list.filter(t => t.status   === f.status);
    if (f.priority) list = list.filter(t => t.priority === f.priority);
    if (f.taskType === 'assigned_by_me') list = list.filter(t => t.assignedByName === me);
    if (f.taskType === 'assigned_to_me') list = list.filter(t => t.recipient === me);
    if (f.taskType === 'related_to_me')  list = list.filter(t => t.assignedByName === me || t.recipient === me);
    if (f.taskType === 'readonly')       list = list.filter(t => t.canEdit === false);

    if (!list.length) {
      $('tasks-table').innerHTML = `<div class="empty-state">
        <div class="icon">📭</div><h4>Aucune tâche</h4>
        <p>${state.tasks.length === 0 ? 'Vous n\'avez encore aucune tâche.' : 'Aucune tâche ne correspond aux filtres.'}</p>
      </div>`;
      return;
    }

    // ✨ v5.4 : calcul des alertes pour le bandeau (sur les tâches reçues uniquement)
    const today = todayStr();
    const myOverdue = list.filter(t => t.recipient === me && t.status !== 'Terminé' && t.dateLimit && t.dateLimit < today);
    const myLateStart = list.filter(t => t.recipient === me && t.status === 'À faire' && t.dateStart && t.dateStart <= today && !(t.dateLimit && t.dateLimit < today));

    let bannersHtml = '';
    if (myOverdue.length > 0) {
      bannersHtml += `<div class="alert-banner danger">
        <span class="icon">🚨</span>
        <span class="grow">Vous avez <strong>${myOverdue.length}</strong> tâche${myOverdue.length>1?'s':''} en retard. Pensez à les traiter en priorité.</span>
      </div>`;
    }
    if (myLateStart.length > 0) {
      bannersHtml += `<div class="alert-banner warn">
        <span class="icon">⏰</span>
        <span class="grow"><strong>${myLateStart.length}</strong> tâche${myLateStart.length>1?'s':''} à démarrer ${myLateStart.length>1?'sont':'est'} en retard de démarrage. Lancez-${myLateStart.length>1?'les':'la'} dès que possible.</span>
      </div>`;
    }

    // ✨ v5.4 : tri en 3 sections
    //   📥 Reçues (assignées à moi), trié par échéance la plus proche
    //   📤 Assignées par moi (mais pas à moi-même), trié par échéance
    //   👁 Autres (lecture seule pour dir/rh/chef qui voient tout)
    function sortByUrgency(a, b) {
      // En retard d'abord, puis échéance la plus proche
      const aOver = a.status !== 'Terminé' && a.dateLimit && a.dateLimit < today;
      const bOver = b.status !== 'Terminé' && b.dateLimit && b.dateLimit < today;
      if (aOver && !bOver) return -1;
      if (!aOver && bOver) return 1;
      // Puis tâches non terminées avant terminées
      const aDone = a.status === 'Terminé';
      const bDone = b.status === 'Terminé';
      if (aDone && !bDone) return 1;
      if (!aDone && bDone) return -1;
      // Puis par échéance croissante
      return (a.dateLimit || '9999').localeCompare(b.dateLimit || '9999');
    }

    // REMPLACER tout le bloc sortByUrgency / sortByRecent + les 3 lignes de filter :

    function sortByTaskIdDesc(a, b) {
      // Extraire le numéro après le préfixe (T001 → 1, T099 → 99)
      const numA = parseInt((a.id || '').replace(/\D/g, ''), 10) || 0;
      const numB = parseInt((b.id || '').replace(/\D/g, ''), 10) || 0;
      return numB - numA; // décroissant : plus grand numéro en premier
    }

    const received   = list.filter(t => t.recipient === me).sort(sortByTaskIdDesc);
    const assignedBy = list.filter(t => t.assignedByName === me && t.recipient !== me).sort(sortByTaskIdDesc);
    const others     = list.filter(t => t.recipient !== me && t.assignedByName !== me).sort(sortByTaskIdDesc);
    const ctx = { role, me, isEmpView, today };

    // Construction du HTML par sections
    let html = bannersHtml;

    // Section 1 : Reçues
    if (received.length > 0) {
      html += `<div class="task-section">
        <div class="task-section-header received">
          <span class="icon">📥</span>
          <span class="lbl">Tâches qui me sont assignées</span>
          <span class="count">${received.length}</span>
        </div>
        ${buildTasksTableHtml(pageSlice(received, 'received'), ctx)}
        ${buildPager('received', received.length)}
      </div>`;
    }

    // Section 2 : Assignées par moi
    if (assignedBy.length > 0) {
      html += `<div class="task-section">
        <div class="task-section-header assigned">
          <span class="icon">📤</span>
          <span class="lbl">Tâches que j'ai assignées</span>
          <span class="count">${assignedBy.length}</span>
        </div>
        ${buildTasksTableHtml(pageSlice(assignedBy, 'assigned'), ctx)}
        ${buildPager('assigned', assignedBy.length)}
      </div>`;
    }

    // Section 3 : Autres (lecture seule, masqué par défaut)
    if (others.length > 0) {
      // ✨ v7.0 : pour un compte sans tâche personnelle (comptes d'administration),
      // cette section est le SEUL contenu de la page. La replier donnait un écran
      // qui semblait vide — au point de faire croire que rien ne se chargeait. On
      // l'ouvre donc d'office dans ce cas précis, une seule fois : dès que
      // l'utilisateur actionne le bouton, c'est son choix qui prime.
      if (state.tasksOthersExpanded === undefined) {
        state.tasksOthersExpanded = (received.length === 0 && assignedBy.length === 0);
      }
      const expanded = state.tasksOthersExpanded === true;
      html += `<div class="task-section">
        <button class="task-section-toggle ${expanded ? 'expanded' : ''}" id="btn-toggle-others">
          <span class="arrow">▶</span>
          <span class="icon">👁</span>
          <span style="flex:1;">${expanded ? 'Masquer' : 'Afficher'} les autres tâches (lecture seule)</span>
          <span class="count" style="background:#5f6368;color:#fff;font-size:12px;padding:2px 10px;border-radius:10px;font-weight:600;">${others.length}</span>
        </button>
        ${expanded ? `
          <div class="task-section-header others" style="border-radius:0;margin-top:0;border-top:none;">
            <span class="icon">👁</span>
            <span class="lbl">Autres tâches (lecture seule)</span>
            <span class="count">${others.length}</span>
          </div>
          ${buildTasksTableHtml(pageSlice(others, 'others'), ctx)}
          ${buildPager('others', others.length)}
        ` : ''}
      </div>`;
    }

    // Si AUCUNE section n'a de résultats, message vide
    if (received.length === 0 && assignedBy.length === 0 && others.length === 0) {
      html += `<div class="empty-state">
        <div class="icon">📭</div><h4>Aucune tâche</h4>
        <p>Aucune tâche ne correspond aux filtres.</p>
      </div>`;
    } else if (received.length === 0 && assignedBy.length === 0 && others.length > 0) {
      html = bannersHtml + `<div class="empty-state" style="padding:20px;">
        <div class="icon">✨</div>
        <h4>Vous n'avez aucune tâche personnelle</h4>
        <p>Ni reçue, ni assignée par vous.</p>
      </div>` + html.replace(bannersHtml, '');
    }

    $('tasks-table').innerHTML = html;

    // Wiring du bouton "Afficher / Masquer les autres"
    const toggleBtn = $('btn-toggle-others');
    if (toggleBtn) {
      toggleBtn.onclick = () => {
        state.tasksOthersExpanded = !state.tasksOthersExpanded;
        renderTasksTable();
      };
    }
  }

  // ✨ v5.4 : construit le HTML d'un tableau de tâches (sans wrapper section)
  function buildTasksTableHtml(tasks, ctx) {
    const { isEmpView } = ctx;
    let headers = '<th>ID</th><th>Description</th>';
    if (!isEmpView) headers += '<th>Destinataire</th>';
    headers += '<th>Assigné par</th><th>Échéance</th><th>Priorité</th><th>Statut</th><th>Avancement</th>';
    headers += '<th>Commentaire</th>';
    headers += '<th>Appréciation</th>';
    /* ✨ v6.8 : colonne « 📎 Rapport » retirée — la preuve passe désormais par
       les Pièces jointes (dans le détail de la tâche). */
    headers += '<th>Messagerie</th>';   /* ✨ v6.0 : chat */
    headers += '<th></th>';

    const rows = tasks.map(t => buildTaskRow(t, ctx)).join('');

    return `<div class="table-wrap" style="border-top-left-radius:0;border-top-right-radius:0;border-top:none;">
      <table>
        <thead><tr>${headers}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }

  // ✨ v5.4 : construit une ligne de tâche (extrait pour réutilisation entre sections)
  function buildTaskRow(t, ctx) {
    const { role, me, isEmpView, today } = ctx;
    const overdue      = isOverdue(t);
    const isAssigner   = t.assignedByName === me;
    const isRecipient  = t.recipient === me;
    const isSelfAssigned = isAssigner && isRecipient;
    const canEdit      = t.canEdit !== false;
    const isLateStart  = isRecipient && t.status === 'À faire' && t.dateStart && t.dateStart <= today && !overdue;

    let directionBadge = '';
    // ✨ v5.5 : badge équipe en premier si la tâche fait partie d'un groupe
    if (t.groupId) {
      directionBadge += `<span class="badge badge-team" title="Tâche d'équipe (groupe ${escapeHtml(t.groupId)})">👥 ${escapeHtml(t.groupId)}</span>`;
    }
    if (isSelfAssigned) {
      directionBadge += '<span class="badge badge-self">⚙ Personnelle</span>';
    } else if (!isEmpView && (role === 'dir' || role === 'rh' || role === 'chef')) {
      if (isAssigner && !isRecipient)       directionBadge += '<span class="badge badge-direction">📤 Assignée</span>';
      else if (isRecipient && !isAssigner)  directionBadge += '<span class="badge badge-direction">📥 Reçue</span>';
      else if (!canEdit)                    directionBadge += '<span class="badge badge-readonly">👁 Lecture seule</span>';
    }

    const canEditStatus   = canEdit && (isEmpView || isRecipient || role === 'chef' || isAssigner);
    const canEditProgress = canEdit && (isEmpView || isRecipient);

    const statusCell = canEditStatus
      ? renderStatusEditable(t)
      : `<span class="badge badge-status-${statusKey(t.status)}">${escapeHtml(t.status)}</span>`;

    const progressDisplay = t.status === 'Terminé'
      ? renderProgressReadonly(t)
      : (canEditProgress ? renderProgressEditable(t) : renderProgressReadonly(t));

    // Commentaire
    const canEditComment = canEdit && isRecipient;
    const hasComment = t.employeeComment && t.employeeComment.trim();
    let commentCell;
    if (hasComment) {
      const preview = escapeHtml(t.employeeComment.trim());
      const action = canEditComment
        ? `openEditCommentModal('${t.id}')`
        : `viewCommentPopup('${t.id}')`;
      const title = canEditComment ? 'Voir / modifier' : 'Voir le commentaire complet';
      commentCell = `<div class="content-preview">
        <span class="preview-text" onclick="event.stopPropagation();${action}" title="${title}">${preview}</span>
        <button class="content-eye-btn" onclick="event.stopPropagation();${action}" title="${title}">💬</button>
      </div>`;
    } else if (canEditComment) {
      commentCell = `<button class="content-add-btn"
                            onclick="event.stopPropagation();openEditCommentModal('${t.id}')"
                            title="Ajouter un commentaire">+ Ajouter</button>`;
    } else {
      commentCell = '';
    }

    // Appréciation
    const canAppreciate = canEdit && !isEmpView && (role === 'chef' || isAssigner);
    const hasAppreciation = t.chefComment && t.chefComment.trim();
    let apprCell;
    if (hasAppreciation) {
      const preview = escapeHtml(t.chefComment.trim());
      const action = canAppreciate
        ? `openChefCommentModal('${t.id}')`
        : `viewAppreciationPopup('${t.id}')`;
      const title = canAppreciate ? 'Voir / modifier' : 'Voir l\u2019appréciation complète';
      apprCell = `<div class="content-preview appreciation">
        <span class="preview-text" onclick="event.stopPropagation();${action}" title="${title}">${preview}</span>
        <button class="content-eye-btn appreciation" onclick="event.stopPropagation();${action}" title="${title}">⭐</button>
      </div>`;
    } else if (canAppreciate) {
      apprCell = `<button class="content-add-btn"
                            onclick="event.stopPropagation();openChefCommentModal('${t.id}')"
                            title="Ajouter une appréciation">+ Ajouter</button>`;
    } else {
      apprCell = '';
    }

    let actions = '';
    if (canEdit && (role === 'chef' || isAssigner)) {
      actions += `<button class="btn btn-icon" onclick="openEditTaskModal('${t.id}')" title="Modifier">✏️</button>`;
      actions += `<button class="btn btn-icon danger" onclick="confirmDeleteTask('${t.id}')" title="Supprimer">🗑️</button>`;
    } else if (canEdit && isRecipient) {
      actions += `<button class="btn btn-icon" onclick="openEditCommentModal('${t.id}')" title="Commentaire">💬</button>`;
    }

    const startState = startDateState(t);
    let startLabel = '';
    if (t.dateStart) {
      if (startState === 'late') {
        startLabel = `<div class="start-date-late" style="font-size:11px">Devait débuter : ${escapeHtml(t.dateStart)}</div>`;
      } else if (startState === 'started') {
        startLabel = `<div class="start-date-started" style="font-size:11px">Démarré (prévu : ${escapeHtml(t.dateStart)})</div>`;
      } else {
        startLabel = `<div class="start-date-future" style="font-size:11px">📅 Début : ${escapeHtml(t.dateStart)}</div>`;
      }
    }

    // ✨ v5.4 : classes CSS pour bandeaux d'alerte sur la ligne
    let rowClasses = [];
    if (!canEdit) rowClasses.push('readonly-row');
    if (overdue && isRecipient) rowClasses.push('row-overdue');
    else if (isLateStart) rowClasses.push('row-late-start');
    const rowClass = rowClasses.length ? ` class="${rowClasses.join(' ')}"` : '';

    // ✨ v6.5 : badge indiquant le nombre de pièces jointes
    const attCount = Number(t.attachmentsCount || 0);
    const attBadge = attCount > 0
      ? `<span class="badge badge-attach" title="${attCount} fichier(s) joint(s) — cliquer sur la ligne pour voir">📎 ${attCount}</span>`
      : '';

    let row = `<tr${rowClass} style="cursor:pointer;" onclick="openTaskDetail('${t.id}')" >`;
    row += `<td data-label="ID"><strong>${escapeHtml(t.id)}</strong>${directionBadge}${attBadge}</td>`;
    row += `<td data-label="Description">${escapeHtml(t.description)}${t.expectedResult && t.expectedResult.trim() ? `<div class="row-expected" title="Résultat attendu">🎯 ${escapeHtml(t.expectedResult)}</div>` : ''}</td>`;
    if (!isEmpView) row += `<td data-label="Destinataire">${escapeHtml(t.recipient)}</td>`;
    // ✨ v6.7 : date d'assignation affichée sous l'assigneur (une tâche peut être
    // assignée plus d'une semaine avant son démarrage).
    const assignedLabel = t.dateAssigned
      ? `<div class="assigned-date" title="Date à laquelle la tâche a été assignée">📌 Assignée le ${escapeHtml(t.dateAssigned)}</div>`
      : '';
    row += `<td data-label="Assigné par">${escapeHtml(t.assignedByName)}${assignedLabel}</td>`;
    // Indicateur de terminaison anticipée ou tardive
    let closeInfo = '';
    if (t.status === 'Terminé' && t.closeDate && t.dateLimit) {
      const onTime = t.closeDate <= t.dateLimit;
      const diff   = Math.abs(daysBetween(t.dateLimit, t.closeDate));
      closeInfo = onTime
        ? `<div style="font-size:10px;color:#137333;margin-top:2px;">✅ Terminé ${diff > 0 ? diff+'j avant' : 'dans les temps'}</div>`
        : `<div style="font-size:10px;color:#c5221f;margin-top:2px;">⚠️ Terminé ${diff}j après</div>`;
    }
    row += `<td data-label="Échéance">${overdue ? '<span class="badge badge-overdue">' + escapeHtml(t.dateLimit) + ' ⚠</span>' : escapeHtml(t.dateLimit || '—')}${startLabel}${closeInfo}</td>`;
    row += `<td data-label="Priorité"><span class="badge badge-prio-${t.priority || 'Moyenne'}">${escapeHtml(t.priority || '—')}</span></td>`;
    row += `<td data-label="Statut">${statusCell}</td>`;
    row += `<td data-label="Avancement">${progressDisplay}</td>`;
    row += `<td data-label="Commentaire" class="cell-content-preview">${commentCell}</td>`;
    row += `<td data-label="Appréciation" class="cell-content-preview">${apprCell}</td>`;
    // ✨ v6.8 : colonne « Rapport » supprimée — les preuves passent par les
    // pièces jointes (détail de la tâche). Pour les tâches d'équipe, l'accès à
    // l'avancement individuel des membres est désormais dans le détail.
    // ✨ v6.0 : cellule Messagerie
    const msgCount = Number(t.messagesCount || 0);
    const chatLabel = msgCount > 0 ? `Messagerie (${msgCount})` : 'Messagerie';
    const chatTitle = msgCount > 0 ? `${msgCount} message(s) — Cliquer pour voir` : 'Démarrer une discussion';
    row += `<td data-label="Messagerie" class="cell-content-preview">
      <button class="btn btn-secondary" style="font-size:11px;padding:4px 10px;min-height:24px;"
            onclick="event.stopPropagation();openChatModal('${escapeHtml(t.id)}')"
            title="${chatTitle}">${chatLabel}</button>
    </td>`;
    row += `<td class="actions" onclick="event.stopPropagation()">${actions}</td>`;
    row += '</tr>';
    return row;
  }

  function statusKey(s) {
    if (s === 'À faire') return 'faire';
    if (s === 'En cours') return 'cours';
    if (s === 'Terminé')  return 'termine';
    return 'faire';
  }
  function renderStatusEditable(t) {
    return `<select class="inline-edit" onclick="event.stopPropagation()" onchange="event.stopPropagation();updateTaskField('${t.id}', 'status', this.value)">
      <option value="À faire"  ${t.status==='À faire' ?'selected':''}>À faire</option>
      <option value="En cours" ${t.status==='En cours'?'selected':''}>En cours</option>
      <option value="Terminé"  ${t.status==='Terminé' ?'selected':''}>Terminé</option>
    </select>`;
  }
  function renderProgressEditable(t) {
    const p = Number(t.progress || 0);
    return `<div class="inline-edit" onclick="event.stopPropagation()">
      <div class="progress-bar"><div class="progress-fill ${p===100?'full':''}" style="width:${p}%"></div></div>
      <input type="number" min="0" max="100" value="${p}" style="width:54px"
             onclick="event.stopPropagation()" onchange="event.stopPropagation();updateTaskField('${t.id}', 'progress', this.value)">%
    </div>`;
  }
  function renderProgressReadonly(t) {
    const p = Number(t.progress || 0);
    return `<div class="progress-bar"><div class="progress-fill ${p===100?'full':''}" style="width:${p}%"></div></div> ${p}%`;
  }

  async function updateTaskField(taskId, field, value) {
    // ✨ v6.8 : un rapport requis NE BLOQUE PLUS la clôture. On laisse terminer
    // la tâche et on rappelle simplement de joindre le justificatif ensuite
    // (pièces jointes), pour ne pas bloquer l'utilisateur.
    if (field === 'status' && value === 'Terminé') {
      const t = state.tasks.find(x => x.id === taskId);
      const hasProof = (t && Number(t.attachmentsCount || 0) > 0) || (t && t.reportLink && t.reportLink.trim());
      if (t && t.reportRequired && !hasProof && !t.isTeamTask) {
        toast('✅ Tâche terminée. Pensez à joindre le justificatif dans les pièces jointes du détail.', 'info');
      }
    }

    const changes = {};
    changes[field] = field === 'progress' ? Number(value) : value;
    if (field === 'status' && value === 'Terminé') changes.progress = 100;

    const payload = { id: taskId };
    payload[field] = changes[field];
    if (field === 'status' && value === 'Terminé') payload.progress = 100;

    // ✨ v6.4 : optimiste — appliquer + re-rendre immédiatement
    const patch = applyTaskPatch(taskId, changes);
    rerenderAfterTaskMutation();

    try {
      const res = await call('updateTask', URL_TOKEN, payload);
      if (!res.success) throw new Error(res.error || 'Erreur');
      if (field === 'status' && value === 'Terminé') {
        toast('✅ Tâche terminée — avancement mis à 100 % et notification envoyée', 'success');
      } else if (field === 'status' && value === 'En cours') {
        toast('✅ Tâche démarrée', 'success');
      } else {
        toast('✅ Mis à jour', 'success');
      }
      state.loaded.tasks = 0;   // resync au prochain rendu (closeDate, etc.)
    } catch (e) {
      revertTaskPatch(patch);
      rerenderAfterTaskMutation();
      toast('Erreur : ' + (e.message || e) + ' — modification annulée', 'error');
    }
  }

  // ═════════════════════════════════════════════════════════════════
  //  ✨ v6.2 : DRAWER DÉTAIL TÂCHE (clic sur une ligne)

  // ✨ v6.9 : ouvre directement la tâche ciblée par un lien profond (notification e-mail).
  // L'onglet des tâches est affiché en arrière-plan, puis le détail s'ouvre par-dessus.
  function openTaskFromDeepLink(taskId) {
    const tab = myTasksTab();
    if (tab) setTab(tab);
    const t = state.tasks.find(x => x.id === taskId);
    if (!t) {
      toast('Tâche ' + taskId + ' introuvable ou non accessible avec ce compte.', 'error');
      return;
    }
    setTimeout(() => { try { openTaskDetail(taskId); } catch (e) {} }, 150);
  }

  // ✨ v6.9 : ouvre directement un onglet ciblé par un lien profond (ex. e-mail salaire).
  function openViewFromDeepLink(view) {
    const map = { salary: 'Autorisation salaire', innovation: 'Innovation' };
    const tabs = menuTabs();
    const tab = map[String(view).toLowerCase()] || '';
    if (tab && tabs.indexOf(tab) !== -1) { setTab(tab); return; }

    if (t.isTeamTask) {

      if (e.target.id === 'tdc-overlay') closeTdc();

  // ═════════════════════════════════════════════════════════════════
  //  ✨ v6.5 : PIÈCES JOINTES (PDF / Excel + photos converties en PDF)
  // ═════════════════════════════════════════════════════════════════
  const ATT_MAX_BYTES = 12 * 1024 * 1024;
  const MAX_FILES_PER_UPLOAD = 10;   // ✨ v6.7 : max 10 fichiers par envoi (stockage)

  function attIcon(mime, name) {
    const m = (mime || '').toLowerCase();
    const n = (name || '').toLowerCase();
    if (m.indexOf('pdf') >= 0 || n.endsWith('.pdf')) return '📄';
    if (m.indexOf('sheet') >= 0 || m.indexOf('excel') >= 0 || n.endsWith('.xls') || n.endsWith('.xlsx')) return '📊';
    if (m.indexOf('image') >= 0) return '🖼️';
    return '📎';
  }
  function fmtSize(bytes) {
    bytes = Number(bytes || 0);
    if (bytes < 1024) return bytes + ' o';
    if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' Ko';
    return (bytes / 1048576).toFixed(1) + ' Mo';
  }

  async function loadAndRenderAttachments(taskId) {
    const wrap = $('tdc-attachments');
    if (!wrap) return;
    const canManage = wrap.getAttribute('data-canmanage') === '1';
    try {
      const res = await call('getAttachmentsForTask', URL_TOKEN, taskId);
      const w = $('tdc-attachments');
      if (!w) return; // drawer fermé entre-temps
      if (!res.success) { w.innerHTML = '<div class="tdc-attach-empty">' + escapeHtml(res.error || 'Erreur') + '</div>'; return; }
      renderAttachmentsList(taskId, res.attachments || [], canManage);
    } catch (e) {
      const w = $('tdc-attachments');
      if (w) w.innerHTML = '<div class="tdc-attach-empty">Erreur de chargement</div>';
    }
  }

  function renderAttachmentsList(taskId, list, canManage) {
    const wrap = $('tdc-attachments');
    if (!wrap) return;
    if (!list.length) {
      wrap.innerHTML = '<div class="tdc-attach-empty">Aucune pièce jointe</div>';
      return;
    }
    const me = state.user.name;
    const role = state.user.role;

  // Détecte le type, convertit si image, applique les garde-fous de taille.
  // Renvoie { payload } prêt à envoyer, ou { error }.
  // ✨ v7.0 : tous les formats sont acceptés. Seules les images subissent encore la
  // conversion PDF ; tout autre fichier part tel quel, sans filtrage d'extension.
  async function buildAttachmentPayload(file) {
    const isImage = /^image\//i.test(file.type) || /\.(png|jpe?g|gif|webp|bmp|heic)$/i.test(file.name);

    if (file.size > ATT_MAX_BYTES * 1.6) {
      return { error: 'Fichier trop volumineux : ' + file.name + ' (max 12 Mo)' };
    }

    let payload;
    if (isImage) {
      // La conversion PDF ne doit JAMAIS bloquer l'upload : repli image brute.
      try {
        payload = await imageToPdfPayload(file);
      } catch (convErr) {
        console.error('Conversion image→PDF échouée, envoi brut :', convErr);
        const b64 = await fileToBase64(file);
        payload = {
          name: file.name,
          mimeType: file.type || 'image/jpeg',
          dataBase64: b64,
          __sizeBytes: Math.round(b64.length * 0.75)
        };
      }
    } else {
      const b64 = await fileToBase64(file);
      payload = {
        name: file.name,
        // Le navigateur laisse file.type vide pour les extensions qu'il ne connaît
        // pas (.dwg, .psd…) : octet-stream est le repli correct, le nom du fichier
        // portant l'extension réelle.
        mimeType: file.type || 'application/octet-stream',
        dataBase64: b64,
        __sizeBytes: Math.round(b64.length * 0.75)
      };
    }
    if (!payload || !payload.dataBase64) {
      return { error: 'Préparation du fichier impossible : ' + file.name };
    }
    if (payload.__sizeBytes && payload.__sizeBytes > ATT_MAX_BYTES) {
      return { error: 'Trop volumineux après conversion : ' + file.name + ' (max 12 Mo)' };
    }
    return { payload: payload };
  }

  // Renvoie true si le fichier a bien été envoyé, false sinon.
  async function uploadOneAttachment(taskId, file) {
    showLoader('Préparation de ' + file.name + '…');
    try {
      const built = await buildAttachmentPayload(file);
      if (built.error) { hideLoader(); toast(built.error, 'error'); return false; }
      const payload = built.payload;
      showLoader('Envoi de ' + payload.name + '…');
      const res = await call('addAttachment', URL_TOKEN, taskId, {
        name: payload.name, mimeType: payload.mimeType, dataBase64: payload.dataBase64
      });
      if (!res || !res.success) { toast((res && res.error) || ('Échec : ' + payload.name), 'error'); return false; }
      const t = state.tasks.find(x => x.id === taskId);
      if (t) t.attachmentsCount = Number(t.attachmentsCount || 0) + 1;
      state.loaded.tasks = 0; // resync compteur au prochain rendu
      return true;
    } catch (e) {
      console.error('uploadOneAttachment', e);
      toast('Erreur upload : ' + (e && (e.message || e)), 'error');
      return false;
    } finally {
      hideLoader();
    }
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const res = String(reader.result || '');
        const c = res.indexOf(',');
        resolve(c >= 0 ? res.slice(c + 1) : res);
      };
      reader.onerror = () => reject(new Error('Lecture du fichier impossible'));
      reader.readAsDataURL(file);
    });
  }

  function readImageEl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        let done = false;
        // ✨ v6.7 : certaines photos (HEIC iPhone…) ne déclenchent jamais onload.
        // Sans ce délai, l'envoi resterait bloqué sur « Préparation… » à l'infini.
        // Au-delà de 8 s, on abandonne la conversion → repli sur l'envoi brut.
        const to = setTimeout(() => { if (!done) { done = true; reject(new Error('Image trop longue à charger')); } }, 8000);
        img.onload  = () => { if (!done) { done = true; clearTimeout(to); resolve(img); } };
        img.onerror = () => { if (!done) { done = true; clearTimeout(to); reject(new Error('Image illisible')); } };
        img.src = String(reader.result);
      };
      reader.onerror = () => reject(new Error('Lecture image impossible'));
      reader.readAsDataURL(file);
    });
  }

  // Convertit une image en PDF A4 compressé. Repli : envoi de l'image telle quelle.
  async function imageToPdfPayload(file) {
    const baseName = file.name.replace(/\.[^.]+$/, '');
    if (!(window.jspdf && window.jspdf.jsPDF)) {
      const b64 = await fileToBase64(file);
      toast('Conversion PDF indisponible — photo envoyée telle quelle', 'info');
      return { name: file.name, mimeType: file.type || 'image/jpeg', dataBase64: b64, __sizeBytes: Math.round(b64.length * 0.75) };
    }
    const img = await readImageEl(file);
    const maxDim = 1600;
    let w = img.width, h = img.height;
    const scale = Math.min(1, maxDim / Math.max(w, h));
    w = Math.max(1, Math.round(w * scale));
    h = Math.max(1, Math.round(h * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    const jpeg = canvas.toDataURL('image/jpeg', 0.7);

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: w >= h ? 'l' : 'p', unit: 'pt', format: 'a4' });
    const pw = pdf.internal.pageSize.getWidth();
    const ph = pdf.internal.pageSize.getHeight();
    const r = Math.min(pw / w, ph / h);
    const dw = w * r, dh = h * r;
    pdf.addImage(jpeg, 'JPEG', (pw - dw) / 2, (ph - dh) / 2, dw, dh);
    const uri = pdf.output('datauristring');
    const b64 = uri.slice(uri.indexOf(',') + 1);
    return { name: baseName + '.pdf', mimeType: 'application/pdf', dataBase64: b64, __sizeBytes: Math.round(b64.length * 0.75) };
  }

    rerenderAfterTaskMutation();

      if (!r.success) throw new Error(r.error || 'Erreur');

      state.loaded.tasks = 0;

      state.tasks.splice(Math.min(idx, state.tasks.length), 0, removed);
      rerenderAfterTaskMutation();
      toast('Erreur : ' + (e.message || e) + ' — suppression annulée', 'error');
    }
  }

  async function submitChefComment(taskId) {
    const comment = $('cc-comment').value.trim();
    // ✨ v6.4 : optimiste
    closeModal();
    const patch = applyTaskPatch(taskId, { chefComment: comment });
    rerenderAfterTaskMutation();
    try {
      const r = await call('updateTask', URL_TOKEN, { id: taskId, chefComment: comment });

      state.loaded.tasks = 0;
    } catch (e) {

      rerenderAfterTaskMutation();
